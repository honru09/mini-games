# Render Blueprint：一键部署联机服务端
# 使用方式：Render 控制台 → New → Blueprint → 选择本 GitHub 仓库
services:
  - type: web
    name: mini-games-online
    runtime: node
    plan: free
    # Reward Resolver 当前由单个 Node 写入者计算；扩容前必须先完成数据库版本冲突重算。
    numInstances: 1
    rootDir: .
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      # 以下两个变量在部署后在 Render Dashboard 的 Environment 里填写（值来自 Supabase）
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DEEPSEEK_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://honru09.github.io
