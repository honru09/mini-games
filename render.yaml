# Render Blueprint：一键部署联机服务端
# 使用方式：Render 控制台 → New → Blueprint → 选择本 GitHub 仓库
services:
  - type: web
    name: mini-games-online
    runtime: node
    plan: free
    # Cluster/PubSub 工程基线已具备，但真实 Supabase 迁移、恢复演练和并发验收通过前仍固定单实例。
    numInstances: 1
    rootDir: .
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      # 以下两个变量在部署后在 Render Dashboard 的 Environment 里填写（值来自 Supabase）
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DEEPSEEK_KEY
        sync: false
      - key: ENABLE_CLUSTER_COORDINATION
        value: "0"
      - key: TETRIS_GUIDELINE_SCORING
        value: "1"
      - key: ALLOWED_ORIGINS
        value: https://honru09.github.io
