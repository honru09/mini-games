        actionRow.innerHTML = '';
        const buy = el('button','btn btn-primary','购买 ¥' + cell.price);
        buy.addEventListener('click', () => {
          if (opts.online && cur !== opts.myIdx) return;
          if (opts.ai && opts.ai.has(cur)) return;
          if (opts.online) opts.sendMove({ decision: 'buy' });
          applyDecision(pi, 'buy');
        });
        const pass = el('button','btn','放弃');
        pass.addEventListener('click', () => {
          if (opts.online && cur !== opts.myIdx) return;
          if (opts.ai && opts.ai.has(cur)) return;
          if (opts.online) opts.sendMove({ decision: 'pass' });
          applyDecision(pi, 'pass');
        });
        actionRow.appendChild(buy); actionRow.appendChild(pass);
        scheduleAI();
      } else if (cell.owner === pi){
        setStatus('玩家' + (pi+1) + ' 回到自己的地盘');
        setTimeout(nextTurn, 500);
      } else {
        const rent = rentOf(cell);
        pay(pi, rent, '向玩家' + (cell.owner+1) + ' 支付租金 ' + rent);
        setTimeout(() => { if (!over) nextTurn(); }, 450);
      }
    }
  }
  function applyDecision(pi, decision){
    const p = players[pi];
    const cell = CELLS[p.pos];
    if (decision === 'buy'){
      if (p.money >= cell.price){
        p.money -= cell.price; cell.owner = pi; p.props.push(p.pos);
        toast('🏠 购入「' + cell.name + '」');
      } else {
        toast('资金不足，无法购买');
      }
    }
    phase = 'done';
    actionRow.innerHTML = '';
    renderBoard();
    setTimeout(nextTurn, 450);
  }
  function pay(pi, amt, why){
    const p = players[pi];
    p.money -= amt;
    if (p.money < 0){
      p.alive = false;
      p.props.forEach(idx => CELLS[idx].owner = -1);
      p.props = [];
      toast('💀 玩家' + (pi+1) + ' 破产出局！');
      const alive = aliveList();
      if (alive.length === 1){
        over = true; winner = alive[0];
        creditGame();
        renderBoard();
        setStatus('🏆 玩家' + (winner+1) + ' 获胜！', true);
        return;
      }
    }
    renderBoard();
    if (why) setStatus('玩家' + (pi+1) + ' ' + why);
  }
  function showChance(pi, depth){
    if (depth >= 3){ setStatus('机会卡连续触发，停止结算'); setTimeout(nextTurn, 500); return; }
    phase = 'chance';
    const idx = chanceDeck.shift();
    chanceDeck.push(idx);
    const card = CHANCE[idx];
    if (opts.online || (opts.ai && opts.ai.has(pi))){
      applyChance(pi, card, depth);
      return;
    }
    const modal = el('div','chance-modal');
    const box = el('div','chance-card');
    box.appendChild(el('div','emo','🎁'));
    box.appendChild(el('h3', null, '机会卡'));
    box.appendChild(el('p', null, card.text));
    const ok = el('button','btn btn-primary','确定');
    ok.addEventListener('click', () => {
      modal.remove();
      applyChance(pi, card, depth);
    });
    box.appendChild(ok);
    modal.appendChild(box);
    board.appendChild(modal);
  }
  function applyChance(pi, card, depth){
    const p = players[pi];
    if (!p.alive) return;
    if (card.v !== undefined) pay(pi, -card.v, '抽取机会卡');
    else if (card.each !== undefined){
      if (card.each > 0){
        let got = 0;
        players.forEach((q, qi) => { if (qi !== pi && q.alive){ q.money -= card.each; got += card.each; } });
        p.money += got;
        renderBoard();
        setStatus('玩家' + (pi+1) + ' 收到每人 ' + card.each + ' 的赞助');
      } else {
        let aliveOthers = 0;
        players.forEach((q, qi) => {
          if (qi !== pi && q.alive){ q.money += -card.each; aliveOthers++; }
        });
        p.money += card.each * aliveOthers;
        renderBoard();
        setStatus('玩家' + (pi+1) + ' 请每人吃了 ' + (-card.each) + ' 的大餐');
      }
      // 检查其他人破产
      let ended = false;
      players.forEach((q, qi) => {
        if (qi !== pi && q.alive && q.money < 0){
          q.alive = false;
          q.props.forEach(idx => CELLS[idx].owner = -1);
          q.props = [];
          toast('💀 玩家' + (qi+1) + ' 破产出局！');
          const alive = aliveList();
          if (alive.length === 1){ over = true; winner = alive[0]; ended = true; creditGame(); renderBoard(); setStatus('🏆 玩家' + (winner+1) + ' 获胜！', true); }
        }
      });
      if (ended) return;
    }
    else if (card.move !== undefined){
      const steps = ((card.move % CELLS.length) + CELLS.length) % CELLS.length;
      const old = p.pos;
      const npos = (old + steps) % CELLS.length;
      if (old + steps >= CELLS.length){
        p.money += 2000;
        toast('🚀 经过起点，获得 2000');
      }
      p.pos = npos;
      renderBoard();
      setStatus('玩家' + (pi+1) + ' ' + (card.move > 0 ? '前进' : '后退') + Math.abs(card.move) + ' 格');
      setTimeout(() => resolveCell(pi, depth+1), 450);
      return;
    }
    else if (card.go){
      p.money += 2000;
      p.pos = 0;
      renderBoard();
      setStatus('玩家' + (pi+1) + ' 直达起点，获得 2000');
    }
    setTimeout(() => { if (!over) nextTurn(); }, 600);
  }
  function nextTurn(){
    if (over) return;
    phase = 'roll';
    actionRow.innerHTML = '';
    if (cur === n - 1) round++;
    cur = (cur + 1) % n;
    while (!players[cur].alive) cur = (cur + 1) % n;
    if (round > MAX_ROUND){ settle(); return; }
    renderBoard();
    setStatus('第 ' + Math.min(round, MAX_ROUND) + '/' + MAX_ROUND + ' 轮 · 轮到玩家' + (cur+1) + '，请掷骰子');
    scheduleAI();
  }
  function settle(){
    if (over) return;
    over = true;
    creditGame();
    const order = players.map((p, i) => i).sort((a, b) =>
      ((players[b].alive ? 1 : 0) - (players[a].alive ? 1 : 0)) || (players[b].money - players[a].money));
    winner = order[0];
    renderBoard();
    const lines = order.map((i, k) =>
      (k+1) + '. 玩家' + (i+1) + ' — ¥' + players[i].money + (players[i].alive ? '' : '（破产）'));
    showModal('🏆 结算 · 玩家' + (winner+1) + ' 获胜', lines, '确定');
    setStatus('🏆 玩家' + (winner+1) + ' 是最终赢家！', true);
  }
  function creditGame(){
    const order = players.map((p, i) => i).sort((a, b) =>
      ((players[b].alive ? 1 : 0) - (players[a].alive ? 1 : 0)) || (players[b].money - players[a].money));
    const res = order.map((i, k) => ({ slot: i, coins: k === 0 ? 1 : 0, rank: k + 1 }));
    if (opts.onEnd) opts.onEnd(res);
  }
  opts.onMove = payload => {
    if (!payload) return;
    if (payload.roll) applyRoll(payload.roll[0], payload.roll[1]);
    else if (payload.decision === 'settle') settle();
    else if (payload.decision) applyDecision(cur, payload.decision);
  };
  function resetLocal(){
    init();
    actionRow.innerHTML = '';
    rollBtn.disabled = false;
    diceFaces.forEach(f => f.reset());
    aiPending = false;
    renderBoard();
    setStatus('第 1/' + MAX_ROUND + ' 轮 · 玩家1 的回合，请掷骰子');
  }
  function reset(){
    if (opts.online && !opts.isHost){ toast('由房主开始新一局'); return; }
    if (opts.online) opts.sendRestart();
    resetLocal();
  }
  init();
  renderBoard();
  setStatus('第 1/' + MAX_ROUND + ' 轮 · 玩家1 的回合，请掷骰子');
  return {
    reset,
    onMove: opts.onMove,
    onRestart: resetLocal,
    snapshot: () => ({
      players: players.map(p => ({ money: p.money, pos: p.pos, alive: p.alive, props: p.props.slice() })),
      cur, phase, round, over, winner,
      owners: CELLS.map(c => c.owner),
      deck: chanceDeck.slice(),
    }),
  };
}

/* ================= 弹珠跳棋 ================= */
function makeCheckerBoard(){
  const key = h => h.q + ',' + h.r;
  const hex = [];
  for (let q=-4;q<=4;q++) for (let r=-4;r<=4;r++) if (Math.abs(q+r) <= 4) hex.push({q,r});
  const base = [];
  for (let k=1;k<=4;k++) for (let j=0;j<=4-k;j++) base.push({q:4+k, r:-4+j});
  const rots = [
    (q,r) => [q,r],
    (q,r) => [-r,q+r],
    (q,r) => [-q-r,q],
    (q,r) => [-q,-r],
    (q,r) => [r,-q-r],
    (q,r) => [q+r,-q],
  ];
  const arms = rots.map(R => base.map(p => { const [q,r] = R(p.q,p.r); return {q,r}; }));
  const holes = hex.slice();
  const seen = new Set(hex.map(key));
  for (const arm of arms) for (const h of arm){
    const k = key(h);
    if (!seen.has(k)){ seen.add(k); holes.push(h); }
  }
  return { holes, arms, key };
}
function checkerReachable(holeSet, occupied, hole){
  const key = holeSet.key;
  const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
  const res = new Set();
  for (const [dq,dr] of DIRS){
    const q = hole.q+dq, r = hole.r+dr;
    if (holeSet.set.has(key({q,r})) && !occupied.has(key({q,r}))) res.add(key({q,r}));
  }
  const seen = new Set([key(hole)]);
  const queue = [hole];
  while (queue.length){
    const cur = queue.shift();
    for (const [dq,dr] of DIRS){
      const mq = cur.q+dq, mr = cur.r+dr;
      if (!holeSet.set.has(key({q:mq,r:mr})) || !occupied.has(key({q:mq,r:mr}))) continue;
      const nq = mq+dq, nr = mr+dr;
      const nk = key({q:nq,r:nr});
      if (!holeSet.set.has(key({q:nq,r:nr})) || occupied.has(nk) || seen.has(nk)) continue;
      seen.add(nk); res.add(nk); queue.push({q:nq,r:nr});
    }
  }
  return res;
}
function gameChecker(area, extra, n, opts){
  opts = opts || {};
  const boardData = makeCheckerBoard();
  const { holes, arms, key } = boardData;
  const holeSet = { set: new Set(holes.map(key)), key };
  const cornerSel = n === 2 ? [0,3] : n === 3 ? [0,2,4] : n === 4 ? [0,2,3,5] : [0,1,2,3,4];
  const targetKey = c => arms[(c+3)%6].map(key);
  let marbles = [], cur = 0, over = false, winner = -1, selected = null, dests = null, history = [];
  let aiPending = false;
  function scheduleAI(){
    if (aiPending || over) return;
    if (!opts.ai || !opts.ai.has(cur)) return;
    aiPending = true;
    setTimeout(async () => {
      aiPending = false;
      if (over) return;
      const occ = occupiedMap();
      const list = [];
      marbles[cur].forEach(m => {
        const d = checkerReachable(holeSet, occ, m);
        for (const dk of d){
          const [q, r] = dk.split(',').map(Number);
          const isJump = Math.abs(q - m.q) + Math.abs(r - m.r) > 1;
          list.push({ from: m, to: {q, r}, isJump });
        }
      });
      if (!list.length){ toast('AI 无子可动'); return; }
      // 启发式：优先跳吃，其次向对角营地推进
      const target = arms[(cornerSel[cur] + 3) % 6].map(key);
      const tSet = new Set(target);
      let best = list[0], bestS = -1e9;
      list.forEach(mv => {
        let s = mv.isJump ? 12 : 0;
        s += tSet.has(key(mv.to)) ? 6 : 0;
        s -= Math.abs(mv.to.q - mv.from.q) + Math.abs(mv.to.r - mv.from.r);
        if (s > bestS){ bestS = s; best = mv; }
      });
      applyCheckerMove(best.from, best.to);
    }, 700);
  }
  const canvas = document.createElement('canvas');
  canvas.className = 'board-canvas';
  const dpr = window.devicePixelRatio || 1;
  const W = 560, H = 600;
  canvas.width = W*dpr; canvas.height = H*dpr;
  area.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  if (!opts.online){
    const undoBtn = el('button','btn','↩ 悔棋');
    undoBtn.addEventListener('click', () => {
      if (over || !history.length) return;
      const h = history.pop();
      marbles[h.pi][h.mi] = h.from;
      cur = h.pi;
      selected = null; dests = null;
      const ov = area.querySelector('.overlay'); if (ov) ov.remove();
      draw();
      renderPlayers(cur, progressInfos());
      setStatus('已悔棋，轮到玩家' + (cur+1) + '，点击自己的棋子');
    });
    extra.appendChild(undoBtn);
    const hintBtn = el('button','btn','💡 提示');
    hintBtn.addEventListener('click', () => {
      if (over) return;
      const occ = occupiedMap();
      for (let mi = 0; mi < marbles[cur].length; mi++){
        const d = checkerReachable(holeSet, occ, marbles[cur][mi]);
        if (d.size){
          selected = marbles[cur][mi]; dests = d;
          draw();
          setStatus('玩家' + (cur+1) + ' 的可移动弹珠已高亮');
          return;
        }
      }
      toast('当前无子可动');
    });
    extra.appendChild(hintBtn);
  }
  function occupiedMap(){
    const m = new Map();
    marbles.forEach((list, pi) => list.forEach((h, mi) => m.set(key(h), {pi, mi})));
    return m;
  }
  function computeLayout(){
    const spacing = 34;
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    for (const h of holes){
      const x = h.q + h.r/2, y = h.r * 0.866;
      minX = Math.min(minX, x); maxX = Math.max(maxX, x);
      minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    }
    const scale = Math.min((W-70)/Math.max(1,maxX-minX), (H-70)/Math.max(1,maxY-minY));
    const ox = (W - (maxX+minX)*scale)/2, oy = (H - (maxY+minY)*scale)/2;
    return { scale, ox, oy };
  }
  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    const L = computeLayout();
    const rHole = Math.max(6, 0.42*L.scale);
    const rMarble = Math.max(5, 0.36*L.scale);
    const toXY = h => [L.ox + (h.q + h.r/2)*L.scale, L.oy + h.r*0.866*L.scale];
    // 洞
    for (const h of holes){
      const [x,y] = toXY(h);
      ctx.beginPath(); ctx.arc(x,y,rHole,0,Math.PI*2);
      ctx.fillStyle = '#eef1f6'; ctx.fill();
      ctx.strokeStyle = '#c6cfdd'; ctx.lineWidth = 1; ctx.stroke();
    }
    // 各角落淡色提示
    cornerSel.forEach((c, pi) => {
      const col = PLAYER_COLORS[pi];
      for (const h of arms[c]){
        const [x,y] = toXY(h);
        ctx.beginPath(); ctx.arc(x,y,rHole,0,Math.PI*2);
        ctx.fillStyle = PLAYER_BG[pi]; ctx.fill();
        ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke();
      }
      // 目标营地
      for (const h of arms[(c+3)%6]){
        const [x,y] = toXY(h);
        ctx.beginPath(); ctx.arc(x,y,rHole,0,Math.PI*2);
        ctx.strokeStyle = col; ctx.setLineDash([3,3]); ctx.lineWidth = 1.5; ctx.stroke();
        ctx.setLineDash([]);
      }
    });
    // 可落点
    if (dests){
      for (const dk of dests){
        const [q,r] = dk.split(',').map(Number);
        const [x,y] = toXY({q,r});
        ctx.beginPath(); ctx.arc(x,y,rHole*0.55,0,Math.PI*2);
        ctx.fillStyle = 'rgba(34,160,107,.35)'; ctx.fill();
      }
    }
    // 棋子
    marbles.forEach((list, pi) => list.forEach(h => {
      const [x,y] = toXY(h);
      ctx.beginPath(); ctx.arc(x,y,rMarble,0,Math.PI*2);
      ctx.fillStyle = PLAYER_COLORS[pi]; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    }));
    // 选中
    if (selected){
      const [x,y] = toXY(selected);
      ctx.beginPath(); ctx.arc(x,y,rMarble+4,0,Math.PI*2);
      ctx.strokeStyle = PLAYER_COLORS[cur]; ctx.lineWidth = 3; ctx.stroke();
    }
  }
  canvas.addEventListener('click', e => {
    if (over) return;
    if (opts.online && cur !== opts.myIdx) return;
    if (opts.ai && opts.ai.has(cur)) return;
    const rect = canvas.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width * W;
    const py = (e.clientY - rect.top) / rect.height * H;
    const L = computeLayout();
    let best = null, bestD = 1e9;
    for (const h of holes){
      const x = L.ox + (h.q + h.r/2)*L.scale, y = L.oy + h.r*0.866*L.scale;
      const d = (x-px)*(x-px) + (y-py)*(y-py);
      if (d < bestD){ bestD = d; best = h; }
    }
    if (!best || bestD > (L.scale*0.55)*(L.scale*0.55)){ selected = null; dests = null; draw(); return; }
    const bk = key(best);
    const occ = occupiedMap();
    if (selected){
      if (dests && dests.has(bk)){
        if (opts.online) opts.sendMove({ from: [selected.q, selected.r], to: [best.q, best.r] });
        applyCheckerMove(selected, best);
        return;
      }
      selected = null; dests = null;
    }
    const occAt = occ.get(bk);
    if (occAt && occAt.pi === cur){
      selected = best;
      dests = checkerReachable(holeSet, occ, best);
    }
    draw();
  });
  function applyCheckerMove(fromHole, toHole){
    const occ = occupiedMap();
    const hit = occ.get(key(fromHole));
    history.push({ pi: hit.pi, mi: hit.mi, from: {q:fromHole.q, r:fromHole.r}, to: {q:toHole.q, r:toHole.r} });
    marbles[hit.pi][hit.mi] = toHole;
    selected = null; dests = null;
    const target = new Set(targetKey(cornerSel[cur]));
    if (marbles[cur].every(m => target.has(key(m)))){
      over = true; winner = cur;
      if (opts.onEnd) opts.onEnd(marbles.map((list, i) => ({
        slot: i,
        coins: i === cur ? 1 : 0,
        rank: i === cur ? 1 : 2,
      })));
      draw();
      setStatus('🏆 玩家' + (cur+1) + ' 获胜！', true);
      showCheckerOver();
      return;
    }
    nextPlayer();
  }
  function nextPlayer(){
    cur = (cur + 1) % n;
    // 跳过无子可动的玩家
    let guard = 0;
    while (guard++ < n){
      const occ = occupiedMap();
      const anyMove = marbles[cur].some(m => checkerReachable(holeSet, occ, m).size > 0);
      if (anyMove) break;
      toast('玩家' + (cur+1) + ' 无子可动，跳过');
      cur = (cur + 1) % n;
    }
    renderPlayers(cur, progressInfos());
    setStatus('轮到玩家' + (cur+1) + '，点击自己的棋子');
    scheduleAI();
  }
  function progressInfos(){
    return marbles.map((list, pi) => {
      const t = new Set(targetKey(cornerSel[pi]));
      const cnt = list.filter(m => t.has(key(m))).length;
      return '归位 ' + cnt + '/10';
    });
  }
  function showCheckerOver(){
    const ov = el('div','overlay');
    ov.style.borderRadius = '16px';
    const card = el('div','overlay-card');
    card.appendChild(el('div','big','🏆'));
    card.appendChild(el('h3', null, '玩家' + (winner+1) + ' 获胜！'));
    card.appendChild(el('p', null, '10 颗弹珠全部到达对角营地'));
    const btn = el('button','btn btn-primary','再来一局');
    btn.addEventListener('click', reset);
    card.appendChild(btn);
    ov.appendChild(card);
    area.appendChild(ov);
  }
  opts.onMove = payload => {
    if (payload && payload.from && payload.to){
      applyCheckerMove({ q: payload.from[0], r: payload.from[1] }, { q: payload.to[0], r: payload.to[1] });
    }
  };
  function resetLocal(){
    marbles = cornerSel.map(c => arms[c].map(h => ({q:h.q, r:h.r})));
    cur = 0; over = false; winner = -1; selected = null; dests = null; history = []; aiPending = false;
    const ov = area.querySelector('.overlay'); if (ov) ov.remove();
    draw();
    renderPlayers(0, progressInfos());
    setStatus('轮到玩家1，点击自己的棋子');
  }
  function reset(){
    if (opts.online && !opts.isHost){ toast('由房主开始新一局'); return; }
    if (opts.online) opts.sendRestart();
    resetLocal();
  }
  reset();
  return {
    reset,
    onMove: opts.onMove,
    onRestart: resetLocal,
    snapshot: () => ({
      marbles: marbles.map(list => list.map(key)),
      cur, over, winner,
      history: history.map(h => ({ pi: h.pi, mi: h.mi, from: key(h.from), to: key(h.to) })),
    }),
  };
}

/* ================= 坦克大战 ================= */
function gameTank(area, extra, n, opts){
  opts = opts || {};
  const W = 13, H = 13;
  const dirs = [[-1,0],[0,1],[1,0],[0,-1]]; // 上右下左
  const DIR_KEYS = ['⬆','➡','⬇','⬅'];
  const BASE0 = [1,1], BASE1 = [11,11], T0 = [2,1], T1 = [10,11];
  let grid = Array.from({length:H}, () => Array(W).fill(0));
  let t0 = { r:T0[0], c:T0[1], d:1, lives:3 };
  let t1 = { r:T1[0], c:T1[1], d:3, lives:3 };
  let cur = 0, over = false, winner = -1;
  let aiPending = false;
  function isWall(r,c){ return grid[r] && grid[r][c] === 2; }
  function isSteel(r,c){ return grid[r] && grid[r][c] === 3; }
  function occupied(r,c){
    if (r === t0.r && c === t0.c) return 0;
    if (r === t1.r && c === t1.c) return 1;
    return -1;
  }
  function scheduleAI(){
    if (aiPending || over) return;
    if (!opts.ai || !opts.ai.has(cur)) return;
    aiPending = true;
    setTimeout(async () => {
      aiPending = false;
      if (over) return;
      const me = cur === 0 ? t0 : t1;
      const foe = cur === 0 ? t1 : t0;
      // 同排/同列且路径无障碍 → 射击
      if (me.r === foe.r || me.c === foe.c){
        const dr = Math.sign(foe.r - me.r), dc = Math.sign(foe.c - me.c);
        let rr = me.r + dr, cc = me.c + dc, blocked = false;
        while (rr >= 0 && rr < H && cc >= 0 && cc < W && !(rr === foe.r && cc === foe.c)){
          if (grid[rr][cc] !== 0){ blocked = true; break; }
          rr += dr; cc += dc;
        }
        if (!blocked){
          if (opts.online) opts.sendMove({ act: 'shoot' });
          shoot();
          return;
        }
      }
      // 朝对方靠近（贪心）
      const optsMoves = [];
      dirs.forEach((d, di) => {
        const nr = me.r + d[0], nc = me.c + d[1];
        if (nr < 0 || nr >= H || nc < 0 || nc >= W) return;
        if (grid[nr][nc] !== 0) return;
        if (occupied(nr, nc) >= 0) return;
        optsMoves.push(di);
      });
      if (!optsMoves.length){ if (opts.online) opts.sendMove({ act: 'shoot' }); shoot(); return; }
      let best = optsMoves[0], bestD = 1e9;
      optsMoves.forEach(di => {
        const d = dirs[di];
        const nd = Math.abs(me.r + d[0] - foe.r) + Math.abs(me.c + d[1] - foe.c);
        if (nd < bestD){ bestD = nd; best = di; }
      });
      if (opts.online) opts.sendMove({ act: 'move', d: best });
      moveTank(cur, best);
    }, 700);
  }
  function buildMap(){
    grid = Array.from({length:H}, () => Array(W).fill(0));
    for (let i = 0; i < W; i++){ grid[0][i] = 3; grid[H-1][i] = 3; }
    for (let i = 0; i < H; i++){ grid[i][0] = 3; grid[i][W-1] = 3; }
    const bricks = [[3,3],[3,4],[4,3],[8,8],[8,9],[9,8],[6,2],[6,10],[2,6],[10,6],[5,5],[5,6],[5,7],[7,5],[7,6],[7,7],[3,9],[9,3]];
    bricks.forEach(([r,c]) => { if (grid[r][c] === 0) grid[r][c] = 2; });
    grid[BASE0[0]][BASE0[1]] = 4;
    grid[BASE1[0]][BASE1[1]] = 4;
    grid[T0[0]][T0[1]] = 0;
    grid[T1[0]][T1[1]] = 0;
  }
  function moveTank(pi, d){
    const me = pi === 0 ? t0 : t1;
    me.d = d;
    const nr = me.r + dirs[d][0], nc = me.c + dirs[d][1];
    if (nr < 0 || nr >= H || nc < 0 || nc >= W) return;
    if (grid[nr][nc] !== 0) return;
    if (occupied(nr, nc) >= 0) return;
    me.r = nr; me.c = nc;
    endTurn();
  }
  function shoot(){
    const me = cur === 0 ? t0 : t1;
    const foe = cur === 0 ? t1 : t0;
    const d = dirs[me.d];
    let rr = me.r + d[0], cc = me.c + d[1];
    while (rr >= 0 && rr < H && cc >= 0 && cc < W){
      if (grid[rr][cc] === 3){ break; }
      if (grid[rr][cc] === 2){ grid[rr][cc] = 0; break; }
      if (grid[rr][cc] === 4){
        over = true; winner = cur;
        if (opts.onEnd) opts.onEnd([{ slot: cur, coins: 1, rank: 1 }, { slot: cur ^ 1, coins: 0, rank: 2 }]);
        render();
        return;
      }
      if (rr === foe.r && cc === foe.c){
        foe.lives--;
        if (foe.lives <= 0){
          over = true; winner = cur;
          if (opts.onEnd) opts.onEnd([{ slot: cur, coins: 1, rank: 1 }, { slot: cur ^ 1, coins: 0, rank: 2 }]);
        } else {
          if (cur === 0){ t1.r = T1[0]; t1.c = T1[1]; t1.d = 3; }
          else { t0.r = T0[0]; t0.c = T0[1]; t0.d = 1; }
          toast('💥 敌方坦克被击毁！');
        }
        render();
        endTurn();
        return;
      }
      rr += d[0]; cc += d[1];
    }
    render();
    endTurn();
  }
  function endTurn(){
    if (over) return;
    cur ^= 1;
    render();
    setStatus('轮到玩家' + (cur+1) + '，移动或开炮');
    scheduleAI();
  }
  function render(){
    const w = area.clientWidth || 520;
    const S = Math.min(w, 540);
    area.innerHTML = '';
    const board = el('div','tank-board');
    board.style.width = S + 'px'; board.style.height = S + 'px';
    const cs = S / W;
    for (let r = 0; r < H; r++){
      for (let c = 0; c < W; c++){
        const cell = el('div','tank-cell');
        cell.style.left = (c*cs) + 'px'; cell.style.top = (r*cs) + 'px';
        cell.style.width = cs + 'px'; cell.style.height = cs + 'px';
        if (grid[r][c] === 2) cell.classList.add('brick');
        else if (grid[r][c] === 3) cell.classList.add('steel');
        else if (grid[r][c] === 4) { cell.classList.add('base'); cell.textContent = '🏳️'; }
        board.appendChild(cell);
      }
    }
    const place = (t, cls, emoji) => {
      const tank = el('div','tank-cell ' + cls);
      tank.style.left = (t.c*cs) + 'px'; tank.style.top = (t.r*cs) + 'px';
      tank.style.width = cs + 'px'; tank.style.height = cs + 'px';
      tank.textContent = emoji;
      tank.style.transform = 'rotate(' + (t.d*90) + 'deg)';
      tank.appendChild(el('span','hp','♥'.repeat(Math.max(0,t.lives))));
      board.appendChild(tank);
    };
    place(t0, 'tank0', '🛡️');
    place(t1, 'tank1', '🛡️');
    if (over){
      const ov = el('div','overlay');
      const card = el('div','overlay-card');
      card.appendChild(el('div','big','🏆'));
      card.appendChild(el('h3', null, '玩家' + (winner+1) + ' 获胜！'));
      card.appendChild(el('p', null, '坦克大战'));
      const btn = el('button','btn btn-primary', t('come_back'));
      btn.addEventListener('click', reset);
      card.appendChild(btn);
      ov.appendChild(card);
      board.appendChild(ov);
    }
    area.appendChild(board);
    renderPlayers(cur, [t0.lives + ' ❤', t1.lives + ' ❤']);
  }
  extra.innerHTML = '';
  const actions = el('div','tank-actions');
  if (!opts.online){
    DIR_KEYS.forEach((k, di) => {
      const b = el('button','btn',k);
      b.addEventListener('click', () => {
        if (over) return;
        if (opts.ai && opts.ai.has(cur)) return;
        if (opts.online) opts.sendMove({ act: 'move', d: di });
        moveTank(cur, di);
      });
      actions.appendChild(b);
    });
    const shootBtn = el('button','btn btn-primary','💥 开炮');
    shootBtn.addEventListener('click', () => {
      if (over) return;
      if (opts.ai && opts.ai.has(cur)) return;
      if (opts.online) opts.sendMove({ act: 'shoot' });
      shoot();
    });
    actions.appendChild(shootBtn);
  }
  extra.appendChild(actions);
  opts.onMove = payload => {
    if (!payload) return;
    if (payload.act === 'shoot') shoot();
    else if (payload.act === 'move') moveTank(cur, payload.d);
  };
  function resetLocal(){
    buildMap();
    t0 = { r:T0[0], c:T0[1], d:1, lives:3 };
    t1 = { r:T1[0], c:T1[1], d:3, lives:3 };
    cur = 0; over = false; winner = -1; aiPending = false;
    render();
    setStatus('玩家1 的回合，移动或开炮');
  }
  function reset(){
    if (opts.online && !opts.isHost){ toast('由房主开始新一局'); return; }
    if (opts.online) opts.sendRestart();
    resetLocal();
  }
  resetLocal();
  return { reset, onMove: opts.onMove, onRestart: resetLocal, snapshot: () => ({ t0: {...t0}, t1: {...t1}, cur, over, winner, grid: grid.map(r => r.slice()) }) };
}

/* ================= 贪吃蛇 ================= */
function gameSnake(area, extra, n, opts){
  opts = opts || {};
  const W = 15, H = 15;
  const starts = [[1,1,1],[1,13,3],[13,13,3],[13,1,1]]; // r,c,d
  const dirs = [[-1,0],[0,1],[1,0],[0,-1]];
  let snakes = [];
  let food = [7,7];
  let cur = 0, over = false, winner = -1, aliveCount = 0;
  let aiPending = false;
  function scheduleAI(){
    if (aiPending || over) return;
    if (!opts.ai || !opts.ai.has(cur)) return;
    aiPending = true;
    setTimeout(async () => {
      aiPending = false;
      if (over) return;
      const s = snakes[cur];
      if (!s || !s.alive) return;
      const head = s.body[0];
      const legal = [];
      dirs.forEach((d, di) => {
        if ((di + 2) % 4 === s.d) return;
        const nr = head[0] + d[0], nc = head[1] + d[1];
        if (nr < 0 || nr >= H || nc < 0 || nc >= W) return;
        if (hitTest(nr, nc, cur, false)) return;
        legal.push(di);
      });
      if (!legal.length){ die(cur); return; }
      // 优先朝食物方向
      let best = legal[0], bestD = 1e9;
      legal.forEach(di => {
        const d = dirs[di];
        const nd = Math.abs(head[0]+d[0]-food[0]) + Math.abs(head[1]+d[1]-food[1]);
        if (nd < bestD){ bestD = nd; best = di; }
      });
      step(cur, best, null);
    }, 650);
  }
  function hitTest(r, c, except, allowFood){
    if (r < 0 || r >= H || c < 0 || c >= W) return true;
    for (let i = 0; i < snakes.length; i++){
      const s = snakes[i];
      if (!s || !s.alive) continue;
      const body = allowFood && i === except ? s.body.slice(0, -1) : s.body;
      if (body.some(p => p[0] === r && p[1] === c)) return true;
    }
    return false;
  }
  function die(pi){
    snakes[pi].alive = false;
    aliveCount--;
    toast('💀 玩家' + (pi+1) + ' 的蛇撞了！');
    if (aliveCount <= 1){
      const alives = snakes.map((s, i) => s.alive ? i : -1).filter(i => i >= 0);
      if (alives.length === 1){
        over = true; winner = alives[0];
        if (opts.onEnd) opts.onEnd(snakes.map((s, i) => ({ slot: i, coins: i === winner ? 1 : 0, rank: i === winner ? 1 : 2 })));
      } else {
        over = true;
        let best = 0;
        snakes.forEach((s, i) => { if (s.score > snakes[best].score) best = i; });
        winner = best;
        if (opts.onEnd) opts.onEnd(snakes.map((s, i) => ({ slot: i, coins: i === winner ? 1 : 0, rank: i === winner ? 1 : 2 })));
      }
      render();
      return;
    }
    render();
    endTurn();
  }
  function step(pi, d, newFood){
    const s = snakes[pi];
    s.d = d;
    const head = s.body[0];
    const nr = head[0] + dirs[d][0], nc = head[1] + dirs[d][1];
    if (nr < 0 || nr >= H || nc < 0 || nc >= W){ die(pi); return; }
    if (hitTest(nr, nc, pi, false)){ die(pi); return; }
    s.body.unshift([nr, nc]);
    if (nr === food[0] && nc === food[1]){
      s.score++;
      if (newFood) food = newFood;
      else food = [1 + Math.floor(Math.random()*(H-2)), 1 + Math.floor(Math.random()*(W-2))];
      toast('🍎 玩家' + (pi+1) + ' 吃豆 +1！');
    } else {
      s.body.pop();
    }
    if (s.score >= 10){
      over = true; winner = pi;
      if (opts.onEnd) opts.onEnd(snakes.map((s2, i) => ({ slot: i, coins: i === pi ? 1 : 0, rank: i === pi ? 1 : 2 })));
      render();
      return;
    }
    render();
    endTurn();
  }
  function endTurn(){
    if (over) return;
    do { cur = (cur + 1) % snakes.length; } while (snakes[cur] && !snakes[cur].alive);
    render();
    setStatus('轮到玩家' + (cur+1) + '，选择方向');
    scheduleAI();
  }
  function render(){
    const w = area.clientWidth || 520;
    const S = Math.min(w, 540);
    area.innerHTML = '';
    const board = el('div','snake-board');
    board.style.width = S + 'px'; board.style.height = S + 'px';
    const cs = S / W;
    for (let r = 0; r < H; r++){
      for (let c = 0; c < W; c++){
        const cell = el('div','snake-cell');
        cell.style.left = (c*cs) + 'px'; cell.style.top = (r*cs) + 'px';
        cell.style.width = cs + 'px'; cell.style.height = cs + 'px';
        if (r % 2 === c % 2) cell.style.background = 'rgba(128,150,190,.06)';
        board.appendChild(cell);
      }
    }
    const foodEl = el('div','snake-cell');
    foodEl.style.left = (food[1]*cs) + 'px'; foodEl.style.top = (food[0]*cs) + 'px';
    foodEl.style.width = cs + 'px'; foodEl.style.height = cs + 'px';
    foodEl.style.background = '#e5484d'; foodEl.style.borderRadius = '50%';
    board.appendChild(foodEl);
    snakes.forEach((s, pi) => {
      if (!s || !s.alive) return;
      s.body.forEach((p, i) => {
        const seg = el('div','snake-cell' + (i === 0 ? ' head' + pi : ''));
        seg.style.left = (p[1]*cs) + 'px'; seg.style.top = (p[0]*cs) + 'px';
        seg.style.width = cs + 'px'; seg.style.height = cs + 'px';
        seg.style.background = PLAYER_COLORS[pi];
        if (i === 0) seg.style.boxShadow = '0 0 8px ' + PLAYER_COLORS[pi];
        board.appendChild(seg);
      });
    });
    if (over){
      const ov = el('div','overlay');
      const card = el('div','overlay-card');
      card.appendChild(el('div','big','🏆'));
      card.appendChild(el('h3', null, '玩家' + (winner+1) + ' 获胜！'));
      card.appendChild(el('p', null, '得分 ' + snakes[winner].score));
      const btn = el('button','btn btn-primary', t('come_back'));
      btn.addEventListener('click', reset);
      card.appendChild(btn);
      ov.appendChild(card);
      board.appendChild(ov);
    }
    area.appendChild(board);
    renderPlayers(cur, snakes.map((s, i) => s.alive ? ('🍎 ' + s.score) : '💀 出局'));
  }
  extra.innerHTML = '';
  const actions = el('div','snake-actions');
  ['⬆','➡','⬇','⬅'].forEach((k, di) => {
    const b = el('button','btn',k);
    b.addEventListener('click', () => {
      if (over) return;
      if (opts.ai && opts.ai.has(cur)) return;
      const s = snakes[cur];
      if (!s || !s.alive) return;
      if ((di + 2) % 4 === s.d) return;
      if (opts.online){
        const nr = s.body[0][0] + dirs[di][0], nc = s.body[0][1] + dirs[di][1];
        const eat = nr === food[0] && nc === food[1];
        const nf = eat ? [1 + Math.floor(Math.random()*(H-2)), 1 + Math.floor(Math.random()*(W-2))] : null;
        opts.sendMove({ d: di, food: nf });
      }
      step(cur, di, null);
    });
    actions.appendChild(b);
  });
  extra.appendChild(actions);
  opts.onMove = payload => {
    if (!payload) return;
    if (payload.food) food = payload.food;
    step(cur, payload.d, payload.food || null);
  };
  function resetLocal(){
    snakes = starts.slice(0, n).map(([r, c, d]) => ({ body: [[r,c],[r - dirs[d][0], c - dirs[d][1]]], d, score: 0, alive: true }));
    food = [7,7];
    cur = 0; over = false; winner = -1; aliveCount = n; aiPending = false;
    render();
    setStatus('玩家1 的回合，选择方向');
  }
  function reset(){
    if (opts.online && !opts.isHost){ toast('由房主开始新一局'); return; }
    if (opts.online) opts.sendRestart();
    resetLocal();
  }
  resetLocal();
  return { reset, onMove: opts.onMove, onRestart: resetLocal, snapshot: () => ({ snakes: snakes.map(s => ({ body: s.body.map(b => b.slice()), d: s.d, score: s.score, alive: s.alive })), food: food.slice(), cur, over, winner }) };
}

/* ================= 俄罗斯方块 ================= */
function gameTetris(area, extra, n, opts){
  opts = opts || {};
  const COLS = 10, ROWS = 18;
  const SHAPES = [
    [[1,1,1,1]],                                   // I
    [[1,1],[1,1]],                                 // O
    [[1,0,0],[1,1,1]],                             // J
    [[0,0,1],[1,1,1]],                             // L
    [[0,1,1],[1,1,0]],                             // S
    [[1,1,0],[0,1,1]],                             // Z
    [[0,1,0],[1,1,1]],                             // T
  ];
  const COLORS = ['#22d3ee','#facc15','#a78bfa','#fb923c','#34d399','#f87171','#e879f9'];
  let wells = [];
  let scores = [];
  let cur = 0, over = false, winner = -1;
  let piece = null; // {shape, x, y, rot}
  let pieceCount = 0;
  const MAX_PIECES = 8;
  let aiPending = false;
  function rotate(m){
    const rows = m.length, cols = m[0].length;
    const out = Array.from({length: cols}, () => Array(rows).fill(0));
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) out[c][rows-1-r] = m[r][c];
    return out;
  }
  function cloneWell(w){ return w.map(r => r.slice()); }
  function collide(well, sh, x, y){
    for (let r = 0; r < sh.length; r++){
      for (let c = 0; c < sh[r].length; c++){
        if (!sh[r][c]) continue;
        const rr = y + r, cc = x + c;
        if (cc < 0 || cc >= COLS || rr >= ROWS) return true;
        if (rr >= 0 && well[rr][cc]) return true;
      }
    }
    return false;
  }
  function lock(well, sh, x, y){
    const w = cloneWell(well);
    for (let r = 0; r < sh.length; r++){
      for (let c = 0; c < sh[r].length; c++){
        if (sh[r][c]){
          const rr = y + r, cc = x + c;
          if (rr < 0) return { well: w, cleared: -1 }; // top out
          w[rr][cc] = 1;
        }
      }
    }
    let cleared = 0;
    for (let r = ROWS - 1; r >= 0; r--){
      if (w[r].every(v => v)){
        w.splice(r, 1);
        w.unshift(Array(COLS).fill(0));
        cleared++; r++;
      }
    }
    return { well: w, cleared };
  }
  function evaluatePlacement(well, sh, x, y){
    const res = lock(well, sh, x, y);
    if (res.cleared === -1) return -1e9;
    let height = 0, holes = 0;
    for (let c = 0; c < COLS; c++){
      let colH = 0, found = false;
      for (let r = 0; r < ROWS; r++){
        if (res.well[r][c]){ if (!found){ found = true; colH = ROWS - r; } }
        else if (found) holes++;
      }
      height = Math.max(height, colH);
    }
    return res.cleared * 1000 - height * 2 - holes * 3;
  }
  function aiBestPlacement(well, shape){
    let best = null, bestV = -1e9;
    for (let rot = 0; rot < 4; rot++){
      let sh = shape;
      for (let i = 0; i < rot; i++) sh = rotate(sh);
      for (let x = -3; x <= COLS; x++){
        let y = 0;
        while (!collide(well, sh, x, y + 1)) y++;
        if (collide(well, sh, x, y)) continue;
        const v = evaluatePlacement(well, sh, x, y);
        if (v > bestV){ bestV = v; best = { x, y, sh }; }
      }
    }
    return best;
  }
  function scheduleAI(){
    if (aiPending || over) return;
    if (!opts.ai || !opts.ai.has(cur)) return;
    aiPending = true;
    setTimeout(() => {
      aiPending = false;
      if (over) return;
      if (!piece) return;
      const idx = 0 | Math.floor(Math.random() * SHAPES.length);
      const best = aiBestPlacement(wells[cur], SHAPES[idx]);
      if (!best){ topOut(cur); return; }
      if (opts.online) opts.sendMove({ piece: idx, x: best.x, y: best.y, rot: best.rot || 0, sh: best.sh });
      applyPlacement(cur, idx, best.x, best.y, best.sh);
    }, 700);
  }
  function applyPlacement(pi, idx, x, y, sh){
    const res = lock(wells[pi], sh, x, y);
    if (res.cleared === -1){ topOut(pi); return; }
    wells[pi] = res.well;
    const pts = [0, 100, 300, 500, 800][Math.min(4, res.cleared)];
    scores[pi] += pts;
    pieceCount++;
    piece = null;
    render();
    if (pieceCount >= MAX_PIECES * n){
      over = true;
      winner = scores.reduce((a, b, i) => b > scores[a] ? i : a, 0);
      if (opts.onEnd) opts.onEnd(scores.map((s, i) => ({ slot: i, coins: i === winner ? 1 : 0, rank: i === winner ? 1 : 2 })));
      render();
      return;
    }
    endTurn();
  }
  function topOut(pi){
    scores[pi] = -1;
    toast('💀 玩家' + (pi+1) + ' 方块堆到顶出局！');
    over = true;
    winner = scores.reduce((a, b, i) => b > scores[a] ? i : a, 0);
    if (opts.onEnd) opts.onEnd(scores.map((s, i) => ({ slot: i, coins: i === winner ? 1 : 0, rank: i === winner ? 1 : 2 })));
    render();
  }
  function endTurn(){
    if (over) return;
    cur = (cur + 1) % n;
    piece = null;
    render();
    setStatus('轮到玩家' + (cur+1) + '，自动放置方块（AI）或点「放一个」');
    scheduleAI();
  }
  function render(){
    const w = area.clientWidth || 520;
    const S = Math.min(w, 540);
    area.innerHTML = '';
    const wrap = el('div','tetris-wrap');
    wells.forEach((wdata, pi) => {
      const colW = S / n - 10;
      const cell = Math.min(22, colW / COLS);
      const boardW = cell * COLS, boardH = cell * ROWS;
      const box = el('div');
      box.style.width = boardW + 'px';
      box.appendChild(el('div','tetris-score','玩家' + (pi+1) + ' · ' + Math.max(0, scores[pi]) + ' 分' + (pi === cur && !over ? ' ⏩' : '')));
      const well = el('div','tetris-well');
      well.style.width = boardW + 'px'; well.style.height = boardH + 'px';
      for (let r = 0; r < ROWS; r++){
        for (let c = 0; c < COLS; c++){
          if (wdata[r][c]){
            const cellEl = el('div','tetris-cell');
            cellEl.style.left = (c*cell) + 'px'; cellEl.style.top = (r*cell) + 'px';
            cellEl.style.width = cell + 'px'; cellEl.style.height = cell + 'px';
            cellEl.style.background = COLORS[(r*COLS+c) % 7];
            well.appendChild(cellEl);
          }
        }
      }
      if (pi === cur && piece){
        for (let r = 0; r < piece.sh.length; r++){
          for (let c = 0; c < piece.sh[r].length; c++){
            if (piece.sh[r][c]){
              const cellEl = el('div','tetris-cell');
              cellEl.style.left = ((piece.x+c)*cell) + 'px'; cellEl.style.top = ((piece.y+r)*cell) + 'px';
              cellEl.style.width = cell + 'px'; cellEl.style.height = cell + 'px';
              cellEl.style.background = COLORS[piece.idx % 7];
              well.appendChild(cellEl);
            }
          }
        }
      }
      box.appendChild(well);
      wrap.appendChild(box);
    });
    if (over){
      const ov = el('div','overlay');
      const card = el('div','overlay-card');
      card.appendChild(el('div','big','🏆'));
      card.appendChild(el('h3', null, '玩家' + (winner+1) + ' 获胜！'));
      card.appendChild(el('p', null, '得分 ' + Math.max(0, scores[winner])));
      const btn = el('button','btn btn-primary','再来一局');
      btn.addEventListener('click', reset);
      card.appendChild(btn);
      ov.appendChild(card);
      wrap.appendChild(ov);
    }
    area.appendChild(wrap);
    renderPlayers(cur, scores.map((s, i) => s < 0 ? '💀' : (s + ' 分')));
  }
  extra.innerHTML = '';
  if (!opts.online){
    const actions = el('div','tetris-actions');
    const placeBtn = el('button','btn btn-primary','🧱 放一个');
    placeBtn.addEventListener('click', () => {
      if (over) return;
      if (opts.ai && opts.ai.has(cur)) return;
      const idx = 0 | Math.floor(Math.random() * SHAPES.length);
      const best = aiBestPlacement(wells[cur], SHAPES[idx]);
      if (!best){ topOut(cur); return; }
      applyPlacement(cur, idx, best.x, best.y, best.sh);
    });
    actions.appendChild(placeBtn);
    extra.appendChild(actions);
  }
  opts.onMove = payload => {
    if (!payload) return;
    applyPlacement(cur, payload.piece, payload.x, payload.y, payload.sh);
  };
  function resetLocal(){
    wells = Array.from({length: n}, () => Array.from({length: ROWS}, () => Array(COLS).fill(0)));
    scores = Array(n).fill(0);
    cur = 0; over = false; winner = -1; piece = null; pieceCount = 0; aiPending = false;
    render();
    setStatus('玩家1 的回合，点「放一个」放置方块');
  }
  function reset(){
    if (opts.online && !opts.isHost){ toast('由房主开始新一局'); return; }
    if (opts.online) opts.sendRestart();
    resetLocal();
  }
  resetLocal();
  return { reset, onMove: opts.onMove, onRestart: resetLocal, snapshot: () => ({ wells: wells.map(w => w.map(r => r.slice())), scores: scores.slice(), cur, over, winner }) };
}

/* ================= 国际跳棋 ================= */
function gameDraughts(area, extra, n, opts){
  opts = opts || {};
  const N = 8;
  let board = Array.from({length:N}, () => Array(N).fill(null)); // {p, king}
  let cur = 0, over = false, winner = -1, mustCapture = null;
  let aiPending = false;
  const cv = document.createElement('canvas');
  cv.className = 'drg-canvas';
  const dpr = window.devicePixelRatio || 1;
  cv.addEventListener('click', e => {
    if (over) return;
    if (opts.online && cur !== opts.myIdx) return;
    if (opts.ai && opts.ai.has(cur)) return;
    const rect = cv.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    handleClick(0 | Math.floor(y * N), 0 | Math.floor(x * N));
  });
  function handleClick(r, c){
    if (mustCapture){
      const from = mustCapture;
      if (board[r][c] && board[r][c].p === cur && capturesFor(cur, r, c).length){ mustCapture = [r,c]; render(); return; }
      const caps = capturesFor(cur, from[0], from[1]);
      const hit = caps.find(cap => cap[0] === r && cap[1] === c);
      if (hit){
        if (opts.online) opts.sendMove({ from, to: [r,c], via: [hit[2],hit[3]] });
        applyMove(cur, from, [r,c], [hit[2],hit[3]]);
        mustCapture = null;
      }
      return;
    }
    if (board[r][c] && board[r][c].p === cur){
      mustCapture = [r,c];
      render();
    }
  }
  function initBoard(){
    board = Array.from({length:N}, () => Array(N).fill(null));
    for (let r = 0; r < 3; r++){
      for (let c = 0; c < N; c++){
        if ((r + c) % 2 === 1) board[r][c] = { p: 0, king: false };
      }
    }
    for (let r = 5; r < 8; r++){
      for (let c = 0; c < N; c++){
        if ((r + c) % 2 === 1) board[r][c] = { p: 1, king: false };
      }
    }
  }
  function capturesFor(pi, r, c){
    const piece = board[r][c];
    if (!piece || piece.p !== pi) return [];
    const res = [];
    const drs = piece.king ? [-1,1] : (pi === 0 ? [1] : [-1]);
    for (const dr of drs){
      for (const dc of [-1,1]){
        const mr = r + dr, mc = c + dc;
        const lr = r + 2*dr, lc = c + 2*dc;
        if (lr < 0 || lr >= N || lc < 0 || lc >= N) continue;
        const mid = board[mr] && board[mr][mc];
        if (mid && mid.p !== pi && !board[lr][lc]) res.push([lr, lc, mr, mc]);
      }
    }
    return res;
  }
  function allCaptures(pi){
    const res = [];
    for (let r = 0; r < N; r++){
      for (let c = 0; c < N; c++){
        if (board[r][c] && board[r][c].p === pi){
          capturesFor(pi, r, c).forEach(cap => res.push({ from: [r,c], to: [cap[0],cap[1]], via: [cap[2],cap[3]] }));
        }
      }
    }
    return res;
  }
  function simpleMoves(pi){
    const res = [];
    for (let r = 0; r < N; r++){
      for (let c = 0; c < N; c++){
        const piece = board[r][c];
        if (!piece || piece.p !== pi) continue;
        const drs = piece.king ? [-1,1] : (pi === 0 ? [1] : [-1]);
        for (const dr of drs){
          for (const dc of [-1,1]){
            const nr = r + dr, nc = c + dc;
            if (nr < 0 || nr >= N || nc < 0 || nc >= N) continue;
            if (!board[nr][nc]) res.push({ from: [r,c], to: [nr,nc] });
          }
        }
      }
    }
    return res;
  }
  function scheduleAI(){
    if (aiPending || over) return;
    if (!opts.ai || !opts.ai.has(cur)) return;
    aiPending = true;
    setTimeout(() => {
      aiPending = false;
      if (over) return;
      const caps = allCaptures(cur);
      let moves = caps.length ? caps : simpleMoves(cur);
      if (!moves.length){ lose(cur); return; }
      let pick = moves[0];
      if (caps.length){
        pick = caps.sort((a, b) => {
          const ka = board[a.from[0]][a.from[1]].king ? 1 : 0, kb = board[b.from[0]][b.from[1]].king ? 1 : 0;
          return kb - ka;
        })[0];
      } else {
        let best = -1e9;
        moves.forEach(mv => {
          let v = (mv.to[0] === (cur === 0 ? 7 : 0) ? 3 : 0) - Math.abs(mv.to[0] - (cur === 0 ? 7 : 0));
          if (v > best){ best = v; pick = mv; }
        });
      }
      applyMove(cur, pick.from, pick.to);
    }, 600);
  }
  function applyMove(pi, from, to, via){
    const piece = board[from[0]][from[1]];
    board[from[0]][from[1]] = null;
    if (via) board[via[0]][via[1]] = null;
    let king = piece.king;
    if (!king && ((pi === 0 && to[0] === 7) || (pi === 1 && to[0] === 0))) king = true;
    board[to[0]][to[1]] = { p: pi, king };
    // 连跳
    if (via && capturesFor(pi, to[0], to[1]).length && !king){
      setTimeout(() => {
        // 简化：连续跳时保持回合
        const caps = capturesFor(pi, to[0], to[1]);
        if (caps.length){
          // 由玩家继续
          render();
          return;
        }
        endTurn();
      }, 200);
      render();
      return;
    }
    endTurn();
  }
  function lose(pi){
    over = true;
    winner = pi ^ 1;
    if (opts.onEnd) opts.onEnd([{ slot: winner, coins: 1, rank: 1 }, { slot: pi, coins: 0, rank: 2 }]);
    render();
  }
  function countPieces(pi){
    let c = 0;
    for (let r = 0; r < N; r++) for (let x = 0; x < N; x++) if (board[r][x] && board[r][x].p === pi) c++;
    return c;
  }
  function endTurn(){
    if (over) return;
    cur ^= 1;
    if (!countPieces(cur) || !(allCaptures(cur).length || simpleMoves(cur).length)){
      lose(cur);
      return;
    }
    render();
    setStatus('轮到玩家' + (cur+1) + '，点击自己的棋子');
    scheduleAI();
  }
  function render(){
    const w = area.clientWidth || 520;
    const S = Math.min(w, 560);
    area.innerHTML = '';
    cv.width = S*dpr; cv.height = S*dpr;
    area.appendChild(cv);
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const cs = S / N;
    for (let r = 0; r < N; r++){
      for (let c = 0; c < N; c++){
        ctx.fillStyle = (r + c) % 2 === 0 ? '#f1eee4' : '#7b5e3b';
        ctx.fillRect(c*cs, r*cs, cs, cs);
        const piece = board[r][c];
        if (piece){
          ctx.beginPath();
          ctx.arc((c+0.5)*cs, (r+0.5)*cs, cs*0.36, 0, Math.PI*2);
          ctx.fillStyle = piece.p === 0 ? '#e5484d' : '#3b82f6';
          ctx.fill();
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
          if (piece.king){
            ctx.fillStyle = '#fbbf24';
            ctx.font = (cs*0.5) + 'px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('★', (c+0.5)*cs, (r+0.52)*cs);
          }
        }
      }
    }
    if (over){
      const ov = el('div','overlay');
      const card = el('div','overlay-card');
      card.appendChild(el('div','big','🏆'));
      card.appendChild(el('h3', null, '玩家' + (winner+1) + ' 获胜！'));
      const btn = el('button','btn btn-primary','再来一局');
      btn.addEventListener('click', reset);
      card.appendChild(btn);
      ov.appendChild(card);
      area.appendChild(ov);
    }
    renderPlayers(cur, null);
  }
  opts.onMove = payload => {
    if (!payload) return;
    applyMove(cur, payload.from, payload.to, payload.via);
  };
  function resetLocal(){
    initBoard();
    cur = 0; over = false; winner = -1; mustCapture = null; aiPending = false;
    render();
    setStatus('轮到玩家1，点击自己的棋子');
  }
  function reset(){
    if (opts.online && !opts.isHost){ toast('由房主开始新一局'); return; }
    if (opts.online) opts.sendRestart();
    resetLocal();
  }
  resetLocal();
  return { reset, onMove: opts.onMove, onRestart: resetLocal, snapshot: () => ({ board: board.map(r => r.map(x => x ? { p: x.p, king: x.king } : null)), cur, over, winner }) };
}

/* ================= 斗兽棋 ================= */
function gameJungle(area, extra, n, opts){
  opts = opts || {};
  const COLS = 9, ROWS = 7;
  const RANK = { '鼠':1,'猫':2,'狗':3,'狼':4,'豹':5,'虎':6,'狮':7,'象':8 };
  const PIECES = ['象','狮','虎','豹','狼','狗','猫','鼠'];
  const EMOJI = { '象':'🐘','狮':'🦁','虎':'🐯','豹':'🐆','狼':'🐺','狗':'🐶','猫':'🐱','鼠':'🐭' };
  let board = Array.from({length:ROWS}, () => Array(COLS).fill(null)); // {p, type}
  let cur = 0, over = false, winner = -1, selected = null, legalMoves = [];
  let aiPending = false;
  function isWater(r,c){ return r >= 2 && r <= 4 && ((c >= 1 && c <= 3) || (c >= 5 && c <= 7)); }
  function denOf(p){ return p === 0 ? [3,0] : [3,8]; }
  function trapOf(p){
    const d = denOf(p);
    if (p === 0) return [[3,1],[2,0],[4,0]];
    return [[3,7],[2,8],[4,8]];
  }
  function initBoard(){
    board = Array.from({length:ROWS}, () => Array(COLS).fill(null));
    const row0 = ['象','狮','虎','豹','狼','狗','猫','鼠']; // 蓝方（上方）
    row0.forEach((t, i) => {
      const col = i < 4 ? i : i + 1; // 0-3 与 5-8，4 是兽穴
      board[0][col] = { p: 1, type: t };
    });
    const row6 = ['鼠','猫','狗','狼','豹','虎','狮','象']; // 红方（下方）
    row6.forEach((t, i) => {
      const col = i < 4 ? i : i + 1;
      board[6][col] = { p: 0, type: t };
    });
  }
  function inBoard(r,c){ return r >= 0 && r < ROWS && c >= 0 && c < COLS; }
  function canCapture(att, def, r, c){
    if (!def) return true;
    if (att.p === def.p) return false;
    let ar = RANK[att.type], dr = RANK[def.type];
    if (isWater(r,c)){
      if (def.type === '鼠') return att.type === '鼠';
      return false;
    }
    const trap = trapOf(att.p);
    if (trap.some(([tr,tc]) => tr === r && tc === c)) dr = 0;
    if (att.type === '鼠' && def.type === '象') return true;
    return ar > dr;
  }
  function movesOf(p, r, c){
    const piece = board[r][c];
    if (!piece || piece.p !== p) return [];
    const res = [];
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    for (const [dr,dc] of dirs){
      const nr = r + dr, nc = c + dc;
      if (!inBoard(nr,nc)) continue;
      const d0 = denOf(p);
      if (nr === d0[0] && nc === d0[1]) continue; // 不能进自己兽穴
      if (board[nr][nc] && board[nr][nc].p === p) continue;
      if (isWater(nr,nc)){
        if (piece.type !== '鼠') continue;
        if (canCapture(piece, board[nr][nc], nr, nc)) res.push([nr,nc]);
        continue;
      }
      if (canCapture(piece, board[nr][nc], nr, nc)) res.push([nr,nc]);
    }
    // 狮/虎跳河
    if (piece.type === '狮' || piece.type === '虎'){
      for (const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]){
        let nr = r + dr, nc = c + dc;
        if (isWater(nr,nc)){
          let jumped = false, blockedByRat = false;
          while (inBoard(nr,nc) && isWater(nr,nc)){
            if (board[nr][nc]){ blockedByRat = true; break; }
            nr += dr; nc += dc; jumped = true;
          }
          if (jumped && !blockedByRat && inBoard(nr,nc)){
            const d0 = denOf(p);
            if (!(nr === d0[0] && nc === d0[1]) && canCapture(piece, board[nr][nc], nr, nc)) res.push([nr,nc]);
          }
        }
      }
    }
    return res;
  }
  function scheduleAI(){
    if (aiPending || over) return;
    if (!opts.ai || !opts.ai.has(cur)) return;
    aiPending = true;
    setTimeout(() => {
      aiPending = false;
      if (over) return;
      const all = [];
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
        const piece = board[r][c];
        if (piece && piece.p === cur){
          movesOf(cur, r, c).forEach(m => all.push({ from: [r,c], to: m }));
        }
      }
      if (!all.length) return;
      const d0 = denOf(cur);
      let best = all[0], bestV = -1e9;
      all.forEach(mv => {
        const target = board[mv.to[0]][mv.to[1]];
        let v = target ? (RANK[target.type] * 10) : 0;
        if (target && target.type === '象' && board[mv.from[0]][mv.from[1]].type === '鼠') v = 80;
        v += (Math.abs(mv.to[0] - d0[0]) + Math.abs(mv.to[1] - d0[1])) * 2;
        if (v > bestV){ bestV = v; best = mv; }
      });
      if (opts.online) opts.sendMove({ from: best.from, to: best.to });
      doMove(best.from, best.to);
    }, 650);
  }
  function doMove(from, to){
    const piece = board[from[0]][from[1]];
    board[from[0]][from[1]] = null;
    board[to[0]][to[1]] = piece;
    selected = null; legalMoves = [];
    const d1 = denOf(cur ^ 1);
    if (to[0] === d1[0] && to[1] === d1[1]){
      over = true; winner = cur;
      if (opts.onEnd) opts.onEnd([{ slot: cur, coins: 1, rank: 1 }, { slot: cur ^ 1, coins: 0, rank: 2 }]);
      render();
      return;
    }
    const cnt0 = board.flat().filter(x => x && x.p === 0).length;
    const cnt1 = board.flat().filter(x => x && x.p === 1).length;
    if (cnt1 === 0 || cnt0 === 0){
      over = true;
      winner = cnt1 === 0 ? 0 : 1;
      if (opts.onEnd) opts.onEnd([{ slot: winner, coins: 1, rank: 1 }, { slot: winner ^ 1, coins: 0, rank: 2 }]);
      render();
      return;
    }
    cur ^= 1;
    render();
    setStatus('轮到玩家' + (cur+1) + '，点击棋子');
    scheduleAI();
  }
  function render(){
    const w = area.clientWidth || 520;
    const S = Math.min(w, 540);
    area.innerHTML = '';
    const boardEl = el('div','jungle-board');
    boardEl.style.width = S + 'px'; boardEl.style.height = S * ROWS / COLS + 'px';
    const cs = S / COLS;
    for (let r = 0; r < ROWS; r++){
      for (let c = 0; c < COLS; c++){
        const cell = el('div','j-cell');
        cell.style.left = (c*cs) + 'px'; cell.style.top = (r*cs) + 'px';
        cell.style.width = cs + 'px'; cell.style.height = cs + 'px';
        if (isWater(r,c)) cell.classList.add('water');
        const trap = trapOf(0).concat(trapOf(1));
        if (trap.some(([tr,tc]) => tr === r && tc === c)) cell.classList.add('trap');
        if ((r === 3 && c === 0) || (r === 3 && c === 8)) cell.classList.add('den');
        const piece = board[r][c];
        if (piece){
          cell.textContent = EMOJI[piece.type];
          cell.classList.add('king' + piece.p);
          const sub = el('span','j-sub', piece.type);
          cell.appendChild(sub);
        }
        if (selected && selected[0] === r && selected[1] === c) cell.classList.add('sel');
        if (legalMoves.some(([lr,lc]) => lr === r && lc === c)) cell.style.boxShadow = '0 0 0 3px rgba(34,160,107,.6)';
        cell.addEventListener('click', () => {
          if (over) return;
          if (opts.online && cur !== opts.myIdx) return;
          if (opts.ai && opts.ai.has(cur)) return;
          if (selected){
            if (legalMoves.some(([lr,lc]) => lr === r && lc === c)){
              if (opts.online) opts.sendMove({ from: selected, to: [r,c] });
              doMove(selected, [r,c]);
              return;
            }
            selected = null; legalMoves = [];
          }
          const piece = board[r][c];
          if (piece && piece.p === cur){
            selected = [r,c];
            legalMoves = movesOf(cur, r, c);
          }
          render();
        });
        boardEl.appendChild(cell);
      }
    }
    if (over){
      const ov = el('div','overlay');
      const card = el('div','overlay-card');
      card.appendChild(el('div','big','🏆'));
      card.appendChild(el('h3', null, '玩家' + (winner+1) + ' 获胜！'));
      const btn = el('button','btn btn-primary','再来一局');
      btn.addEventListener('click', reset);
      card.appendChild(btn);
      ov.appendChild(card);
      boardEl.appendChild(ov);
    }
    area.appendChild(boardEl);
    const cnt = [board.flat().filter(x => x && x.p === 0).length, board.flat().filter(x => x && x.p === 1).length];
    renderPlayers(cur, ['🐘x' + cnt[0], '🐘x' + cnt[1]]);
  }
  opts.onMove = payload => {
    if (!payload) return;
    doMove(payload.from, payload.to);
  };
  function resetLocal(){
    initBoard();
    cur = 0; over = false; winner = -1; selected = null; legalMoves = []; aiPending = false;
    render();
    setStatus('轮到玩家1，点击棋子');
  }
  function reset(){
    if (opts.online && !opts.isHost){ toast('由房主开始新一局'); return; }
    if (opts.online) opts.sendRestart();
    resetLocal();
  }
  resetLocal();
  return { reset, onMove: opts.onMove, onRestart: resetLocal, snapshot: () => ({ board: board.map(r => r.map(x => x ? { p: x.p, type: x.type } : null)), cur, over, winner }) };
}

/* ================= 象棋 ================= */
function gameXiangqi(area, extra, n, opts){
  opts = opts || {};
  const COLS = 9, ROWS = 10;
  const PIECE = { 'k':'帅','a':'仕','e':'相','h':'马','r':'车','c':'炮','p':'兵' };
  const BLACK_PIECE = { 'k':'将','a':'士','e':'象','h':'马','r':'车','c':'炮','p':'卒' };
  const EMOJI = { '帅':'🤴','仕':'🧑‍⚖️','相':'🧓','马':'🐴','车':'🚗','炮':'💣','兵':'🪖','将':'👑','士':'🧑‍⚖️','象':'🐘','卒':'🪖' };
  let board = Array.from({length:ROWS}, () => Array(COLS).fill(null)); // {p, t}
  let cur = 0, over = false, winner = -1, selected = null, legalMoves = [], lastMove = null;
  let aiPending = false;
  function initBoard(){
    board = Array.from({length:ROWS}, () => Array(COLS).fill(null));
    const setup = [
      ['r','h','e','a','k','a','e','h','r'],
      [null,null,null,null,null,null,null,null,null],
      [null,'c',null,null,null,null,null,'c',null],
      ['p',null,'p',null,'p',null,'p',null,'p'],
      [null,null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null,null],
      ['p',null,'p',null,'p',null,'p',null,'p'],
      [null,'c',null,null,null,null,null,'c',null],
      [null,null,null,null,null,null,null,null,null],
      ['r','h','e','a','k','a','e','h','r'],
    ];
    for (let r = 0; r < ROWS; r++){
      for (let c = 0; c < COLS; c++){
        const t = setup[r][c];
        if (t) board[r][c] = { p: r < 5 ? 1 : 0, t };
      }
    }
  }
  function inPalace(r, c, p){
    return c >= 3 && c <= 5 && (p === 1 ? (r >= 0 && r <= 2) : (r >= 7 && r <= 9));
  }
  function findKing(p){
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
      if (board[r][c] && board[r][c].p === p && board[r][c].t === 'k') return [r,c];
    }
    return null;
  }
  function isCheck(p){
    const k = findKing(p);
    if (!k) return true;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
      const piece = board[r][c];
      if (piece && piece.p !== p){
        if (movesOf(piece.p, r, c).some(([mr,mc]) => mr === k[0] && mc === k[1])) return true;
      }
    }
    return false;
  }
  function movesOf(p, r, c){
    const piece = board[r][c];
    if (!piece || piece.p !== p) return [];
    const res = [];
    const oppKing = findKing(p ^ 1);
    const canMoveTo = (nr, nc) => {
      if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) return false;
      if (board[nr][nc] && board[nr][nc].p === p) return false;
      return true;
    };
    if (piece.t === 'k'){
      for (const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]){
        const nr = r+dr, nc = c+dc;
        if (inPalace(nr, nc, p) && canMoveTo(nr,nc)) res.push([nr,nc]);
      }
      // 飞将
      if (oppKing && oppKing[1] === c){
        let blocked = false;
        for (let rr = Math.min(r, oppKing[0]) + 1; rr < Math.max(r, oppKing[0]); rr++){
          if (board[rr][c]){ blocked = true; break; }
        }
        if (!blocked) res.push(oppKing);
      }
    } else if (piece.t === 'a'){
      for (const [dr,dc] of [[-1,-1],[-1,1],[1,-1],[1,1]]){
        const nr = r+dr, nc = c+dc;
        if (inPalace(nr, nc, p) && canMoveTo(nr,nc)) res.push([nr,nc]);
      }
    } else if (piece.t === 'e'){
      for (const [dr,dc] of [[-2,-2],[-2,2],[2,-2],[2,2]]){
        const nr = r+dr, nc = c+dc;
        const eye = [r+dr/2, c+dc/2];
        if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
        const cross = p === 1 ? nr <= 4 : nr >= 5;
        if (!cross) continue;
        if (board[eye[0]][eye[1]]) continue;
        if (canMoveTo(nr,nc)) res.push([nr,nc]);
      }
    } else if (piece.t === 'h'){
      const legs = [[[-1,0],[-2,-1]],[[-1,0],[-2,1]],[[1,0],[2,-1]],[[1,0],[2,1]],[[0,-1],[-1,-2]],[[0,-1],[1,-2]],[[0,1],[-1,2]],[[0,1],[1,2]]];
      for (const [leg, step] of legs){
        const lr = r+leg[0], lc = c+leg[1];
        const nr = r+step[0], nc = c+step[1];
        if (!canMoveTo(nr,nc)) continue;
        if (board[lr][lc]) continue;
        res.push([nr,nc]);
      }
    } else if (piece.t === 'r'){
      for (const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]){
        let nr = r+dr, nc = c+dc;
        while (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS){
          if (!board[nr][nc]){ res.push([nr,nc]); }
          else { if (board[nr][nc].p !== p) res.push([nr,nc]); break; }
          nr += dr; nc += dc;
        }
      }
    } else if (piece.t === 'c'){
      for (const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]){
        let nr = r+dr, nc = c+dc, screen = false;
        while (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS){
          if (!screen){
            if (!board[nr][nc]) res.push([nr,nc]);
            else screen = true;
          } else {
            if (board[nr][nc]){
              if (board[nr][nc].p !== p) res.push([nr,nc]);
              break;
            }
          }
          nr += dr; nc += dc;
        }
      }
    } else if (piece.t === 'p'){
      const fwd = p === 1 ? 1 : -1;
      const nr = r + fwd;
      if (nr >= 0 && nr < ROWS && canMoveTo(nr, c)) res.push([nr, c]);
      if ((p === 1 && r >= 5) || (p === 0 && r <= 4)){
        for (const dc of [-1,1]){
          if (canMoveTo(r, c+dc)) res.push([r, c+dc]);
        }
      }
    }
    return res;
  }
  function legalMovesOf(p, r, c){
    return movesOf(p, r, c).filter(([nr,nc]) => {
      const from = board[r][c], to = board[nr][nc];
      board[r][c] = null; board[nr][nc] = from;
      const bad = isCheck(p);
      board[r][c] = from; board[nr][nc] = to;
      return !bad;
    });
  }
  function scheduleAI(){
    if (aiPending || over) return;
    if (!opts.ai || !opts.ai.has(cur)) return;
    aiPending = true;
    setTimeout(async () => {
      aiPending = false;
      if (over) return;
      const all = [];
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
        const piece = board[r][c];
        if (piece && piece.p === cur){
          legalMovesOf(cur, r, c).forEach(m => all.push({ from: [r,c], to: m }));
        }
      }
      if (!all.length){ lose(cur); return; }
      const VAL = { 'p':1,'a':2,'e':2,'h':4,'c':4.5,'r':9,'k':100 };
      let best = all[0], bestV = -1e9;
      all.forEach(mv => {
        const target = board[mv.to[0]][mv.to[1]];
        let v = target ? (VAL[target.t] * 10) : 0;
        const rnd = (Math.random() - 0.5) * 0.5;
        if (v + rnd > bestV){ bestV = v + rnd; best = mv; }
      });
      if (opts.online) opts.sendMove({ from: best.from, to: best.to });
      doMove(best.from, best.to);
    }, 750);
  }
  function doMove(from, to){
    const piece = board[from[0]][from[1]];
    board[from[0]][from[1]] = null;
    board[to[0]][to[1]] = piece;
    lastMove = [from, to];
    selected = null; legalMoves = [];
    cur ^= 1;
    // 判断对方是否被将死
    const all = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
      const p2 = board[r][c];
      if (p2 && p2.p === cur) legalMovesOf(cur, r, c).forEach(m => all.push([r,c,m]));
    }
    if (!all.length){
      over = true;
      winner = cur ^ 1;
      if (opts.onEnd) opts.onEnd([{ slot: winner, coins: 1, rank: 1 }, { slot: cur, coins: 0, rank: 2 }]);
      render();
      return;
    }
    render();
    setStatus(isCheck(cur) ? '⚠️ 玩家' + (cur+1) + ' 被将军！请应将' : '轮到玩家' + (cur+1));
    scheduleAI();
  }
  function lose(pi){
    over = true;
    winner = pi ^ 1;
    if (opts.onEnd) opts.onEnd([{ slot: winner, coins: 1, rank: 1 }, { slot: pi, coins: 0, rank: 2 }]);
    render();
  }
  function render(){
    const w = area.clientWidth || 520;
    const S = Math.min(w, 560);
    area.innerHTML = '';
    const wrap = el('div','xiangqi-wrap');
    const boardEl = el('div','xiangqi-board');
    boardEl.style.width = S + 'px'; boardEl.style.height = S * ROWS / COLS + 'px';
    const cs = S / COLS;
    const cv = document.createElement('canvas');
    cv.style.position = 'absolute'; cv.style.left = '0'; cv.style.top = '0';
    const dpr = window.devicePixelRatio || 1;
    cv.width = S*dpr; cv.height = S*ROWS/COLS*dpr;
    boardEl.appendChild(cv);
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle = '#e9c79a'; ctx.fillRect(0,0,S,S*ROWS/COLS);
    ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 1.4;
    const pad = cs/2;
    for (let c = 0; c < COLS; c++){
      ctx.beginPath(); ctx.moveTo(pad + c*cs, pad); ctx.lineTo(pad + c*cs, S - pad); ctx.stroke();
    }
    for (let r = 0; r < ROWS; r++){
      ctx.beginPath(); ctx.moveTo(pad, pad + r*cs); ctx.lineTo(S - pad, pad + r*cs); ctx.stroke();
    }
    // 九宫斜线
    const palace = (r0) => {
      ctx.beginPath();
      ctx.moveTo(pad + 3*cs, pad + r0*cs); ctx.lineTo(pad + 5*cs, pad + (r0+2)*cs);
      ctx.moveTo(pad + 5*cs, pad + r0*cs); ctx.lineTo(pad + 3*cs, pad + (r0+2)*cs);
      ctx.stroke();
    };
    palace(0); palace(7);
    // 河界
    ctx.setLineDash([6,5]);
    ctx.beginPath(); ctx.moveTo(pad, pad + 5*cs); ctx.lineTo(S - pad, pad + 5*cs); ctx.stroke();
    ctx.setLineDash([]);
    for (let r = 0; r < ROWS; r++){
      for (let c = 0; c < COLS; c++){
        const piece = board[r][c];
        if (!piece) continue;
        const x = pad + c*cs, y = pad + r*cs;
        ctx.beginPath(); ctx.arc(x, y, cs*0.42, 0, Math.PI*2);
        ctx.fillStyle = piece.p === 0 ? '#fde2d3' : '#d9e6f2';
        ctx.fill();
        ctx.strokeStyle = piece.p === 0 ? '#b23a1f' : '#1f4e79';
        ctx.lineWidth = 1.6; ctx.stroke();
        const label = piece.p === 0 ? PIECE[piece.t] : BLACK_PIECE[piece.t];
        ctx.fillStyle = piece.p === 0 ? '#b23a1f' : '#1f4e79';
        ctx.font = 'bold ' + (cs*0.5) + 'px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(label, x, y + 1);
        if (lastMove && ((lastMove[0][0] === r && lastMove[0][1] === c) || (lastMove[1][0] === r && lastMove[1][1] === c))){
          ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2.4;
          ctx.beginPath(); ctx.arc(x, y, cs*0.46, 0, Math.PI*2); ctx.stroke();
        }
      }
    }
    if (selected){
      ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(pad + selected[1]*cs, pad + selected[0]*cs, cs*0.46, 0, Math.PI*2); ctx.stroke();
      legalMoves.forEach(([nr,nc]) => {
        ctx.fillStyle = 'rgba(34,160,107,.4)';
        ctx.beginPath(); ctx.arc(pad + nc*cs, pad + nr*cs, cs*0.18, 0, Math.PI*2); ctx.fill();
      });
    }
    boardEl.addEventListener('click', e => {
      if (over) return;
      if (opts.online && cur !== opts.myIdx) return;
      if (opts.ai && opts.ai.has(cur)) return;
      const rect = boardEl.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width * S;
      const y = (e.clientY - rect.top) / (rect.height) * S * ROWS / COLS;
      const c = Math.round((x - pad) / cs), r = Math.round((y - pad) / cs);
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
      if (selected){
        if (legalMoves.some(([mr,mc]) => mr === r && mc === c)){
          if (opts.online) opts.sendMove({ from: selected, to: [r,c] });
          doMove(selected, [r,c]);
          return;
        }
        selected = null; legalMoves = [];
      }
      const piece = board[r][c];
      if (piece && piece.p === cur){
        selected = [r,c];
        legalMoves = legalMovesOf(cur, r, c);
      }
      render();
    });
    if (over){
      const ov = el('div','overlay');
      const card = el('div','overlay-card');
      card.appendChild(el('div','big','🏆'));
      card.appendChild(el('h3', null, '玩家' + (winner+1) + ' 获胜！'));
      const btn = el('button','btn btn-primary','再来一局');
      btn.addEventListener('click', reset);
      card.appendChild(btn);
      ov.appendChild(card);
      boardEl.appendChild(ov);
    }
    wrap.appendChild(boardEl);
    area.appendChild(wrap);
    renderPlayers(cur, null);
  }
  opts.onMove = payload => {
    if (!payload) return;
    doMove(payload.from, payload.to);
  };
  function resetLocal(){
    initBoard();
    cur = 0; over = false; winner = -1; selected = null; legalMoves = []; lastMove = null; aiPending = false;
    render();
    setStatus('轮到玩家1，点击棋子走棋');
  }
  function reset(){
    if (opts.online && !opts.isHost){ toast('由房主开始新一局'); return; }
    if (opts.online) opts.sendRestart();
    resetLocal();
  }
  resetLocal();
  return { reset, onMove: opts.onMove, onRestart: resetLocal, snapshot: () => ({ board: board.map(r => r.map(x => x ? { p: x.p, t: x.t } : null)), cur, over, winner }) };
}
