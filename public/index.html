<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="app_title">小游戏合集 · 本地多人</title>
<style>
:root{
  --bg:#eef1f8; --card:rgba(255,255,255,.72); --text:#1d2433; --muted:#6b7388;
  --primary:#4f6ef7; --primary-dark:#3d5ce5; --border:#e2e7f0;
  --shadow:0 8px 24px rgba(29,41,75,.08); --radius:14px;
  --p0:#e5484d; --p1:#3b82f6; --p2:#22a06b; --p3:#f59e0b; --p4:#8b5cf6;
  --p0bg:#fdecec; --p1bg:#eaf1fe; --p2bg:#e6f6ef; --p3bg:#fef4e0; --p4bg:#f3eefe;
}
html[data-theme="dark"]{
  --bg:#0d1220; --card:rgba(25,32,52,.68); --text:#e8edf8; --muted:#93a0ba;
  --primary:#6d8bff; --primary-dark:#5470ea; --border:rgba(148,163,198,.16);
  --shadow:0 10px 30px rgba(0,0,0,.38);
  --p0bg:#3a1f24; --p1bg:#1c2a45; --p2bg:#16352b; --p3bg:#3a2d14; --p4bg:#2a2240;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
body::before, body::after{
  content:''; position:fixed; z-index:-1; width:64vmax; height:64vmax; border-radius:50%;
  filter:blur(100px); opacity:.6; pointer-events:none;
}
body::before{background:radial-gradient(circle, rgba(79,110,247,.30), transparent 62%); top:-22vmax; left:-16vmax}
body::after{background:radial-gradient(circle, rgba(245,180,60,.24), transparent 62%); bottom:-26vmax; right:-16vmax}
html[data-theme="dark"] body::before{background:radial-gradient(circle, rgba(79,110,247,.24), transparent 62%)}
html[data-theme="dark"] body::after{background:radial-gradient(circle, rgba(160,100,255,.20), transparent 62%)}
button{font-family:inherit; cursor:pointer}
.hidden{display:none !important}
#app{max-width:1080px; margin:0 auto; padding:18px 16px 40px}
.app-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px}
.brand{display:flex; align-items:center; gap:8px; font-size:17px; font-weight:700; letter-spacing:.4px}
.brand .brand-icon{font-size:24px}
.brand .brand-tag{font-size:12px; color:var(--muted); font-weight:500; letter-spacing:.6px}
.theme-btn{font-size:19px; padding:6px 11px; border-radius:99px; background:var(--card); border:1px solid var(--border)}

/* 大厅双栏布局 */
.hub-grid{display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:16px; align-items:start}
.hub-main{display:flex; flex-direction:column; gap:14px; min-width:0}
.hub-side{display:flex; flex-direction:column; gap:14px; min-width:0}
@media (max-width: 880px){
  .hub-grid{grid-template-columns:1fr}
}

/* 通用按钮 */
.btn{
  border:1px solid var(--border); background:var(--card); color:var(--text);
  border-radius:10px; padding:8px 14px; font-size:14px; font-weight:500;
  transition:transform .08s ease, box-shadow .15s ease, background .15s ease;
}
.btn:hover{box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary); border-color:var(--primary); color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-ghost{background:transparent; border-color:transparent; color:var(--muted)}
.btn-ghost:hover{background:rgba(29,41,75,.05); color:var(--text); box-shadow:none}
.btn:disabled{opacity:.5; cursor:not-allowed; box-shadow:none}

/* 大厅 */
.hub-count{
  display:flex; align-items:center; justify-content:center; gap:12px;
  flex-wrap:wrap; margin-bottom:18px;
}
.hub-label{font-size:14px; font-weight:500; color:var(--muted)}
.mode-group{display:flex; gap:6px; background:var(--card); padding:6px; border-radius:12px; border:1px solid var(--border); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px)}
.count-group{display:flex; gap:8px; background:var(--card); padding:6px; border-radius:12px; border:1px solid var(--border)}
.count-btn{padding:8px 18px; border:1px solid transparent; background:transparent; border-radius:8px; font-size:14px; color:var(--muted)}
.count-btn:hover{background:rgba(79,110,247,.08)}
.count-btn[aria-pressed="true"]{background:var(--primary); color:#fff}
.game-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px;
}
.game-card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px 16px; text-align:left; transition:transform .12s ease, box-shadow .15s ease;
  display:flex; flex-direction:column; gap:8px;
}
.game-card:hover{transform:translateY(-2px); box-shadow:var(--shadow)}
.game-card .icon{font-size:34px; line-height:1}
.game-card .name{font-size:17px; font-weight:600}
.game-card .desc{font-size:12.5px; color:var(--muted); line-height:1.5; min-height:36px}
.game-card .range{font-size:12px; color:var(--primary); background:var(--p1bg); padding:3px 9px; border-radius:99px; align-self:flex-start}
.game-card .badge-row{display:flex; gap:6px; align-items:center; align-self:flex-start}
.ai-badge{font-size:12px; color:#fff; background:linear-gradient(135deg,#8b5cf6,#6366f1); padding:3px 9px; border-radius:99px}
.game-card.disabled{cursor:not-allowed; opacity:.55}
.game-card.disabled:hover{transform:none; box-shadow:none}

/* 联机面板 */
.online-panel{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:16px;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
}
.online-panel h3{margin:0 0 10px; font-size:15px}
.online-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.online-row input{
  flex:1; min-width:150px; padding:8px 12px; border:1px solid var(--border);
  border-radius:10px; font-size:14px; font-family:inherit;
}
.online-row input:focus{outline:2px solid var(--primary); outline-offset:1px}
.online-status{margin-top:8px; font-size:13px; color:var(--muted); min-height:18px}
.online-status .room-code{color:var(--primary); font-weight:600; letter-spacing:1px}
#online-banner{
  text-align:center; background:rgba(79,110,247,.08); border:1px dashed var(--primary);
  border-radius:10px; padding:7px 10px; font-size:13px; margin-bottom:10px; color:var(--text);
}

/* 用户档案与排行榜 */
.hub-meta{display:flex; justify-content:center; margin-bottom:14px}
.me-chip{
  display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--border);
  border-radius:99px; padding:7px 14px; font-size:14px; font-weight:500;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
}
.me-chip:hover{border-color:var(--primary)}
.me-chip .me-av{font-size:22px}
.me-chip .me-pts{color:var(--muted); font-size:12.5px; font-weight:400}
.slots-row{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:14px}
.slot-chip{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  background:var(--card); border:1px dashed var(--border); border-radius:12px;
  padding:9px 16px; font-size:12px; min-width:92px;
}
.slot-chip:hover{border-color:var(--primary)}
.slot-chip.set{border-style:solid}
.slot-chip.ai{border-style:solid; border-color:rgba(139,92,246,.55); background:rgba(139,92,246,.10)}
.slot-chip .av{font-size:25px; line-height:1}
.slot-chip .nm{font-weight:500; font-size:12.5px}
.slot-chip .pts{color:var(--muted); font-size:11px}
.lb-panel{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-top:18px}
.lb-panel, .lobby-panel, .game-card, .count-group, .slot-chip, .game-top, .status-bar, .pchip, .modal-card{backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px)}
.lb-panel h3{margin:0 0 10px; font-size:15px}
.lb-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.lb-head h3{margin:0}
.lb-tabs{display:flex; gap:6px}
.lb-list{display:flex; flex-direction:column; gap:4px}
.lb-row{display:flex; align-items:center; gap:10px; font-size:13.5px; padding:6px 8px; border-radius:8px}
.lb-row.me{background:rgba(79,110,247,.07)}
.lb-rank{width:24px; text-align:center; color:var(--muted); font-weight:500; flex:none}
.lb-av{font-size:20px; flex:none}
.lb-name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lb-game{font-size:11px; color:var(--muted); max-width:38%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lb-pts{font-weight:600; font-variant-numeric:tabular-nums; flex:none}
.lb-empty{color:var(--muted); font-size:13px; padding:8px 0}
.lb-note{font-size:11.5px; color:var(--muted); margin-top:8px}
.avatar-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:10px 0 14px}
.avatar-opt{
  font-size:25px; border:2px solid var(--border); border-radius:12px; background:#fff;
  padding:6px 0; line-height:1.2;
}
.avatar-opt.selected{border-color:var(--primary); background:rgba(79,110,247,.08)}
.avatar-opt:hover{border-color:var(--primary)}
.nick-input{
  width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:10px;
  font-size:15px; font-family:inherit; box-sizing:border-box;
}
.nick-input:focus{outline:2px solid var(--primary); outline-offset:1px}
.profile-stats{display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 14px}
.stat-chip{display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--text); background:var(--p1bg); border:1px solid var(--border); border-radius:99px; padding:4px 10px}
.stat-chip.small{background:transparent}
.roster-list{display:flex; flex-direction:column; gap:6px; margin:10px 0 12px}
.roster-item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:rgba(255,255,255,.78); border:1px solid var(--border); border-radius:10px; padding:8px 12px; font-size:14px;
}
.roster-item:hover{border-color:var(--primary)}
.roster-item .av{font-size:22px}
.roster-item .nm{flex:1; font-weight:500}

/* L 金币 */
.coin{
  display:inline-flex; align-items:center; justify-content:center;
  width:16px; height:16px; border-radius:50%; flex:none;
  background:radial-gradient(circle at 35% 30%, #ffe28a, #f5b400 55%, #c98a00);
  border:1.5px solid #a06a00; color:#7a4d00; font-size:10px; font-weight:700;
  box-shadow:0 1px 2px rgba(0,0,0,.2);
}
.coin.sm{width:13px; height:13px; font-size:8px; border-width:1px}
.coin-line{display:inline-flex; align-items:center; gap:3px}
.online-dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 2px #fff; flex:none}
.online-dot.off{background:#cbd5e1}
.me-chip .me-online{margin-left:2px}

/* 房间面板 */
.room-panel{
  background:linear-gradient(180deg, rgba(79,110,247,.08), rgba(79,110,247,.03));
  border:1px solid var(--primary); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:14px;
}
.room-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px}
.room-head h3{margin:0; font-size:15px}
.room-code-big{font-size:19px; font-weight:700; letter-spacing:2px; color:var(--primary)}
.room-info{font-size:13px; margin-bottom:6px}
.room-status{font-size:13px; font-weight:500; margin-bottom:10px; min-height:18px}
.room-actions{display:flex; gap:8px; flex-wrap:wrap}

/* 游戏大厅 */
.lobby-panel{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:14px;
}
.lobby-panel h3{margin:0 0 10px; font-size:15px}
.lobby-list{display:flex; flex-direction:column; gap:8px}
.lobby-row{
  display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.78);
  border:1px solid var(--border); border-radius:12px; padding:9px 12px;
}
.lobby-row .av{flex:none}
.lobby-row .info{flex:1; min-width:0}
.lobby-row .nm{font-weight:600; font-size:14px}
.lobby-row .meta{font-size:12px; color:var(--muted)}
.lobby-empty{color:var(--muted); font-size:13px; padding:8px 0}
.player-list{display:flex; flex-direction:column; gap:4px}
.player-row{display:flex; align-items:center; gap:10px; font-size:13.5px; padding:5px 8px; border-radius:8px}
.player-row .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.player-row .pts{font-weight:600; font-variant-numeric:tabular-nums}
.invite-btn{padding:4px 12px; font-size:12.5px}

/* 游戏顶栏 */
.game-top{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:10px 14px; margin-bottom:12px;
}
.game-top h2{margin:0; font-size:18px}
.game-top h2{background:linear-gradient(120deg,var(--primary),#8b5cf6); -webkit-background-clip:text; background-clip:text; color:transparent}
.game-top .top-actions{display:flex; gap:8px}

/* 规则/结算弹层 */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(18,24,42,.46); display:flex;
  align-items:center; justify-content:center; z-index:80;
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
}
.modal-card{
  background:var(--card); border-radius:16px; padding:22px 26px; max-width:88vw;
  width:430px; box-shadow:0 16px 50px rgba(0,0,0,.25); max-height:82vh; overflow:auto;
}
.modal-card h3{margin:0 0 12px; font-size:17px}
.modal-card .lines{margin:0 0 16px; padding-left:20px; font-size:13.5px; line-height:1.8; color:var(--text)}
.modal-card .lines li{margin-bottom:3px}

/* 玩家栏 */
.player-bar{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:10px}
.pchip{
  display:flex; align-items:center; gap:7px; padding:7px 12px; border-radius:99px;
  background:var(--card); border:2px solid var(--border); font-size:13.5px; font-weight:500;
}
.pchip .dot{width:12px; height:12px; border-radius:50%; flex:none}
.pchip .extra{font-size:11.5px; color:var(--muted); font-weight:400}
.pchip.active{border-color:var(--primary); background:rgba(79,110,247,.07)}
.pchip.bankrupt{opacity:.5; text-decoration:line-through}

/* 状态栏 */
.status-bar{
  text-align:center; color:var(--text); background:var(--card);
  border:1px solid var(--border); border-radius:10px; padding:9px 14px;
  font-size:14px; margin-bottom:12px; min-height:42px; display:flex;
  align-items:center; justify-content:center;
}
.status-bar.win{background:rgba(34,160,107,.1); border-color:rgba(34,160,107,.35); font-weight:600}

.board-area{display:flex; justify-content:center; position:relative}
.game-extra{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:14px}

/* ============ 井字棋 ============ */
.ttt-grid{display:grid; grid-template-columns:repeat(3, min(88px, 25vw)); gap:8px}
.ttt-cell{
  aspect-ratio:1; border:1px solid var(--border); border-radius:12px; background:var(--card);
  font-size:44px; font-weight:600; display:flex; align-items:center; justify-content:center;
}
.ttt-cell:hover:not(:disabled){border-color:var(--primary)}
.ttt-cell.win{background:rgba(34,160,107,.12); border-color:rgba(34,160,107,.5)}

/* ============ 五子棋 / 弹珠跳棋 画布 ============ */
canvas.board-canvas{width:100%; max-width:560px; display:block; border-radius:12px; background:var(--card); border:1px solid var(--border)}

/* ============ 飞行棋 ============ */
.ludo-board{position:relative; background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow)}
.tcell,.hcell{
  position:absolute; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:#f8fafc; border:1px solid var(--border);
}
.tcell.start{border-width:2px}
.hcell{background:transparent; border-style:dashed}
.ludo-center{
  position:absolute; border-radius:50%; background:#fff; border:2px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:22px;
}
.ludo-base{
  position:absolute; border-radius:12px; display:grid; grid-template-columns:1fr 1fr;
  place-items:center; border:2px solid; background:#fff;
}
.ludo-base .slot{width:46%; aspect-ratio:1; border-radius:50%; background:rgba(255,255,255,.5); position:relative}
.ludo-base .slot .tok{position:absolute; inset:0}
.tok{
  border-radius:50%; border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.25);
  position:absolute; transform:translate(-50%,-50%);
}
.tok.movable{cursor:pointer; animation:pulse 1s ease-in-out infinite}
.tok.movable:hover{transform:translate(-50%,-50%) scale(1.18)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(79,110,247,.55)}50%{box-shadow:0 0 0 7px rgba(79,110,247,0)}}

/* 骰子 */
.dice{
  width:56px; height:56px; background:#fff; border:2px solid var(--border); border-radius:12px;
  display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
  padding:7px; box-shadow:var(--shadow); flex:none;
}
.dice.sm{width:44px; height:44px; padding:5px}
.pip{display:flex; align-items:center; justify-content:center}
.pip::before{content:''; width:10px; height:10px; border-radius:50%; background:var(--text); opacity:0}
.pip.on::before{opacity:1}
.dice-btn{
  border:none; background:transparent; padding:0; border-radius:12px; line-height:0;
}
.dice-btn:disabled{cursor:not-allowed}
.dice-btn:hover .dice{border-color:var(--primary)}

/* 3D 骰子 */
.dice3d-wrap{width:66px; height:66px; perspective:280px; display:inline-flex; align-items:center; justify-content:center}
.dice3d-wrap.sm{width:52px; height:52px; perspective:220px}
.dice3d{position:relative; transform-style:preserve-3d; transition:transform .55s cubic-bezier(.2,.75,.3,1)}
.dice3d .face{
  position:absolute; inset:0; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
  padding:8px; border-radius:12px; background:#fff; border:1px solid var(--border);
  box-shadow:inset 0 0 10px rgba(0,0,0,.06); backface-visibility:hidden;
}
.dice3d-wrap.sm .face{padding:5px; border-radius:9px}
.dice3d .pip{display:flex; align-items:center; justify-content:center}
.dice3d .pip::before{content:''; width:9px; height:9px; border-radius:50%; background:#28334d}
.dice3d-wrap.sm .pip::before{width:6px; height:6px}

/* 开局倒计时 */
.cd-overlay{background:rgba(12,17,32,.58); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); z-index:40}
.cd-overlay.fade{opacity:0; transition:opacity .25s ease}
.cd-num{font-size:66px; font-weight:800; color:#fff; text-shadow:0 6px 30px rgba(109,139,255,.85); animation:cdPop .68s ease}
@keyframes cdPop{0%{transform:scale(1.7); opacity:0}40%{transform:scale(.9); opacity:1}100%{transform:scale(1)}}

/* 棋子覆盖层 */
.overlay{
  position:absolute; inset:0; background:rgba(29,41,75,.35); border-radius:16px;
  display:flex; align-items:center; justify-content:center; z-index:20;
}
.overlay-card{
  background:var(--card); border-radius:16px; padding:22px 28px; text-align:center;
  box-shadow:0 16px 50px rgba(0,0,0,.25); max-width:80%;
}
.overlay-card .big{font-size:30px; margin-bottom:6px}
.overlay-card h3{margin:0 0 4px; font-size:19px}
.overlay-card p{margin:0 0 14px; color:var(--muted); font-size:13px}

/* ============ 迷你大富翁 ============ */
.m-board{position:relative; background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow)}
.m-cell{
  position:absolute; border-radius:10px; background:#fff; border:1px solid var(--border);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  box-shadow:0 1px 3px rgba(29,41,75,.08); font-size:11px; font-weight:500; text-align:center;
}
.m-cell .stripe{position:absolute; top:0; left:0; right:0; height:6px; border-radius:9px 9px 0 0}
.m-cell .emo{font-size:15px; line-height:1}
.m-cell .owner-dot{
  position:absolute; bottom:-3px; right:-3px; width:11px; height:11px; border-radius:50%;
  border:2px solid #fff; box-shadow:0 1px 2px rgba(0,0,0,.2);
}
.m-marker{
  position:absolute; width:10px; height:10px; border-radius:50%; border:1.5px solid #fff;
  transform:translate(-50%,-50%); box-shadow:0 1px 2px rgba(0,0,0,.25); z-index:3;
}
.m-center{
  position:absolute; border-radius:50%; background:#fff; border:2px solid var(--border);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  font-size:13px; font-weight:600; color:var(--muted);
}
.m-center .dice-row{display:flex; gap:6px}
.money-row{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:10px}
.money-chip{
  display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--border);
  border-radius:99px; padding:6px 12px; font-size:13px;
}
.money-chip.active{border-color:var(--primary); background:rgba(79,110,247,.07)}
.money-chip .dot{width:10px; height:10px; border-radius:50%}
.money-chip .amt{font-weight:600; font-variant-numeric:tabular-nums}

/* 机会卡弹层 */
.chance-modal{
  position:absolute; inset:0; background:rgba(29,41,75,.35); border-radius:16px;
  display:flex; align-items:center; justify-content:center; z-index:25;
}
.chance-card{
  background:var(--card); border-radius:16px; padding:24px 30px; text-align:center;
  box-shadow:0 16px 50px rgba(0,0,0,.25); max-width:78%;
}
.chance-card .emo{font-size:34px}
.chance-card h3{margin:10px 0 4px; font-size:19px}
.chance-card p{margin:0 0 14px; color:var(--muted); font-size:13px}

/* Toast */
#toast-wrap{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:99; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none}
.toast{
  background:#1d2433; color:#fff; font-size:13.5px; border-radius:10px; padding:9px 18px;
  box-shadow:0 8px 24px rgba(0,0,0,.25); animation:toastIn .18s ease; max-width:86vw; text-align:center;
}
@keyframes toastIn{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}

/* ============ 账号 / 个人化 ============ */
.auth-hero{
  border-radius:14px; padding:26px 22px; text-align:center; margin-bottom:14px;
  background:linear-gradient(135deg, rgba(79,110,247,.16), rgba(139,92,246,.18));
  border:1px solid var(--border);
}
.auth-hero .big{font-size:40px; line-height:1; margin-bottom:8px}
.auth-hero h2{margin:0 0 4px; font-size:19px}
.auth-hero p{margin:0; font-size:12.5px; color:var(--muted)}
.auth-avatar-wrap{display:flex; justify-content:center; margin:12px 0}
.avatar-stage{position:relative; width:84px; height:84px}
.avatar-stage canvas{position:relative; z-index:2; display:block; border-radius:50%}
.avatar-stage .frame-ring{
  position:absolute; inset:-7px; border-radius:50%; z-index:1; pointer-events:none;
  border:3px solid transparent; background-clip:padding-box;
}
.avatar-stage .frame-ring.frame-1{border-color:linear-gradient(135deg,#f6d365,#fda085)}
.avatar-stage .frame-ring.frame-1{border-color:#e8b63a; box-shadow:0 0 14px rgba(232,182,58,.75)}
.avatar-stage .frame-ring.frame-2{border-color:#22d3ee; box-shadow:0 0 14px rgba(34,211,238,.85)}
.avatar-stage .frame-ring.frame-3{border-color:#a78bfa; box-shadow:0 0 14px rgba(167,139,250,.9)}
.avatar-stage .frame-ring.frame-4{box-shadow:0 0 0 3px #fff, 0 0 18px rgba(244,63,94,.9)}
.avatar-stage.effect-1 canvas{animation:fxPulse 2s ease-in-out infinite}
.avatar-stage.effect-2 canvas{animation:fxTwinkle 1.8s ease-in-out infinite}
.avatar-stage.effect-3{animation:fxFloat 3s ease-in-out infinite}
.avatar-stage.effect-4{animation:fxSpin 6s linear infinite}
.avatar-stage.effect-4 .frame-ring{animation:none}
@keyframes fxPulse{0%,100%{box-shadow:0 0 0 0 rgba(79,110,247,.55)}50%{box-shadow:0 0 0 12px rgba(79,110,247,0)}}
@keyframes fxTwinkle{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35) saturate(1.3)}}
@keyframes fxFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fxSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.mini-avatar-stage{position:relative; display:inline-flex; align-items:center; justify-content:center; flex:none}
.mini-avatar-stage canvas{position:relative; z-index:2; border-radius:50%; display:block}
.mini-avatar-stage .frame-ring{
  position:absolute; inset:-4px; border-radius:50%; z-index:1; pointer-events:none; border:2px solid transparent;
}
.mini-avatar-stage .frame-ring.frame-1{border-color:#e8b63a; box-shadow:0 0 8px rgba(232,182,58,.7)}
.mini-avatar-stage .frame-ring.frame-2{border-color:#22d3ee; box-shadow:0 0 8px rgba(34,211,238,.8)}
.mini-avatar-stage .frame-ring.frame-3{border-color:#a78bfa; box-shadow:0 0 8px rgba(167,139,250,.85)}
.mini-avatar-stage .frame-ring.frame-4{box-shadow:0 0 0 2px #fff, 0 0 10px rgba(244,63,94,.85)}
.mini-avatar-stage.effect-1 canvas{animation:fxPulseMini 2s ease-in-out infinite}
.mini-avatar-stage.effect-2 canvas{animation:fxTwinkle 1.8s ease-in-out infinite}
.mini-avatar-stage.effect-3{animation:fxFloat 3s ease-in-out infinite}
@keyframes fxPulseMini{0%,100%{box-shadow:0 0 0 0 rgba(79,110,247,.5)}50%{box-shadow:0 0 0 7px rgba(79,110,247,0)}}
.profile-hero{
  position:relative; border-radius:14px; padding:20px 18px 16px; text-align:center; overflow:hidden;
  border:1px solid var(--border); margin-bottom:12px;
}
.profile-hero.bg-0{background:linear-gradient(135deg,#eef1f8,#dfe7fb)}
.profile-hero.bg-1{background:linear-gradient(135deg,#ede9fe,#c4b5fd)}
.profile-hero.bg-2{background:linear-gradient(135deg,#dbeafe,#93c5fd)}
.profile-hero.bg-3{background:linear-gradient(135deg,#ffedd5,#fdba74)}
.profile-hero.bg-4{background:linear-gradient(135deg,#dcfce7,#86efac)}
.profile-hero.bg-5{background:linear-gradient(135deg,#fce7f3,#f9a8d4)}
.profile-hero.bg-6{background:linear-gradient(135deg,#1e293b,#334155); color:#e2e8f0}
.profile-hero .hero-avatar{display:flex; justify-content:center; margin-bottom:8px}
.profile-hero .pname{font-size:18px; font-weight:700}
.profile-hero .pmeta{font-size:12.5px; color:var(--muted); margin-top:3px}
html[data-theme="dark"] .profile-hero.bg-6{border-color:rgba(148,163,198,.25)}
.shop-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px; margin:8px 0 12px}
.shop-item{
  border:1.5px solid var(--border); border-radius:12px; padding:10px 6px; text-align:center;
  background:var(--card); display:flex; flex-direction:column; align-items:center; gap:5px; font-size:12px;
}
.shop-item:hover{border-color:var(--primary)}
.shop-item .si-name{font-weight:600}
.shop-item .si-price{color:var(--muted); font-size:11.5px}
.shop-item.selected{border-color:var(--primary); background:rgba(79,110,247,.08)}
.shop-item.owned{border-style:dashed}
.shop-item button{padding:3px 10px; font-size:11.5px}
.shop-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px}
.shop-tab{padding:5px 12px; font-size:12.5px; border-radius:99px}
.bg-swatch{
  width:38px; height:38px; border-radius:10px; border:2px solid var(--border); cursor:pointer;
}
.bg-swatch.selected{border-color:var(--primary); box-shadow:0 0 0 2px rgba(79,110,247,.35)}
.bg-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(44px,1fr)); gap:8px; margin:8px 0 12px}
.pin-hint{font-size:11.5px; color:var(--muted); margin-top:2px}
.profile-links{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:10px}

/* ============ 坦克大战 ============ */
.tank-board{position:relative; background:var(--card); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow)}
.tank-cell{position:absolute; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:11px}
.tank-cell.brick{background:repeating-linear-gradient(45deg,#c9885f,#c9885f 5px,#a96a45 5px,#a96a45 10px); border:1px solid #8a5133}
.tank-cell.steel{background:linear-gradient(135deg,#cbd5e1,#94a3b8); border:1px solid #64748b}
.tank-cell.base{background:rgba(79,110,247,.18); border:1px dashed var(--primary); font-size:15px}
.tank-cell.tank0{background:#e5484d; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tank-cell.tank1{background:#3b82f6; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tank-cell .hp{position:absolute; bottom:-12px; font-size:9px; color:var(--muted); white-space:nowrap}
.tank-actions{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:8px}
.tank-actions button{min-width:42px}

/* ============ 贪吃蛇 ============ */
.snake-board{position:relative; background:var(--card); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow)}
.snake-cell{position:absolute; border-radius:3px}
.snake-cell.head0,.snake-cell.head1,.snake-cell.head2,.snake-cell.head3{border-radius:5px}
.snake-actions{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:8px}

/* ============ 俄罗斯方块 ============ */
.tetris-wrap{display:flex; gap:14px; justify-content:center; flex-wrap:wrap}
.tetris-well{position:relative; background:#0f172a; border:2px solid var(--border); border-radius:8px; overflow:hidden}
.tetris-cell{position:absolute; border-radius:2px}
.tetris-cell.ghost{opacity:.28}
.tetris-score{text-align:center; margin-bottom:6px; font-size:13px; color:var(--muted)}
.tetris-actions{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:8px}

/* ============ 国际跳棋 ============ */
.drg-canvas{width:100%; max-width:560px; display:block; border-radius:12px; background:var(--card); border:1px solid var(--border)}

/* ============ 斗兽棋 ============ */
.jungle-board{position:relative; background:var(--card); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow)}
.j-cell{position:absolute; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:19px; cursor:pointer; transition:transform .08s ease}
.j-cell:hover{transform:scale(1.08)}
.j-cell.water{background:linear-gradient(180deg,#a5d8ff,#5cb0f0); box-shadow:inset 0 2px 6px rgba(0,0,0,.18)}
.j-cell.trap{background:rgba(244,63,94,.18); box-shadow:inset 0 0 0 2px rgba(244,63,94,.5)}
.j-cell.den{background:rgba(139,92,246,.22); box-shadow:inset 0 0 0 2px rgba(139,92,246,.55); font-size:22px}
.j-cell.sel{outline:3px solid var(--primary); outline-offset:1px}
.j-cell.king0{outline:2px solid #e5484d; outline-offset:1px}
.j-cell.king1{outline:2px solid #3b82f6; outline-offset:1px}
.j-cell .j-sub{position:absolute; bottom:1px; font-size:8px; color:var(--muted)}

/* ============ 象棋 ============ */
.xiangqi-wrap{display:flex; gap:14px; justify-content:center; flex-wrap:wrap}
.xiangqi-board{position:relative; background:var(--card); border-radius:14px; box-shadow:var(--shadow); overflow:hidden}
.xq-cell{position:absolute; display:flex; align-items:center; justify-content:center; font-size:21px; cursor:pointer; border-radius:6px}
.xq-cell.sel{background:rgba(79,110,247,.18)}
.xq-cell.legal{background:rgba(34,160,107,.18)}
.xq-cell.last{box-shadow:inset 0 0 0 2px rgba(245,158,11,.8)}

/* 深色主题下的硬编码浅色面 */
html[data-theme="dark"] .lobby-row,
html[data-theme="dark"] .roster-item,
html[data-theme="dark"] .m-cell,
html[data-theme="dark"] .tcell,
html[data-theme="dark"] .ludo-base,
html[data-theme="dark"] .ludo-center,
html[data-theme="dark"] .dice3d .face{background:rgba(31,39,63,.92); color:var(--text)}
html[data-theme="dark"] .m-cell .stripe{filter:brightness(.82)}
html[data-theme="dark"] .avatar-opt{background:rgba(31,39,63,.92)}
html[data-theme="dark"] .ttt-cell{background:var(--card)}
html[data-theme="dark"] .modal-card{background:rgba(24,31,52,.94)}
html[data-theme="dark"] .overlay-card{background:rgba(24,31,52,.96)}
html[data-theme="dark"] .chance-card{background:rgba(24,31,52,.96)}
html[data-theme="dark"] .toast{background:#e8edf8; color:#0d1220}
html[data-theme="dark"] .dice3d .pip::before{background:#dbe4f5}
html[data-theme="dark"] .online-dot{box-shadow:0 0 0 2px #1a2238}
</style>
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="brand"><span class="brand-icon">🎮</span><span>Playroom</span><span class="brand-tag" data-i18n="brand_tag">11 款小游戏 · 联机对战</span></div>
        <div style="display:flex;gap:6px">
      <button type="button" class="btn" id="btn-settings-page" title="设置">⚙️</button>
      <button type="button" class="btn theme-btn" id="btn-theme" title="切换黑夜/白昼主题">🌙</button>
    </div>
  </header>

  <section id="screen-hub">
    <div class="hub-grid">
      <div class="hub-main">
        <div class="hub-meta">
          <button type="button" class="me-chip" id="btn-me" title="我的档案 / 登录"></button>
        </div>
        <div class="slots-row" id="slots-row"></div>
        <div class="room-panel hidden" id="room-panel">
          <div class="room-head">
            <h3 data-i18n="my_room">🚪 我的房间</h3>
            <span class="room-code-big" id="room-code-big"></span>
          </div>
          <div class="room-info" id="room-info"></div>
          <div class="room-status" id="room-status"></div>
          <div class="room-actions" id="room-actions"></div>
        </div>
        <div class="hub-count">
          <div class="mode-group" id="mode-group" role="group" aria-label="游戏模式">
            <button type="button" class="btn count-btn" data-mode="local" aria-pressed="true" data-i18n="mode_local">👥 本地热座</button>
            <button type="button" class="btn count-btn" data-mode="ai" aria-pressed="false" data-i18n="mode_ai">🤖 人机对战</button>
          </div>
          <span class="hub-label" id="count-label" data-i18n="player_count">玩家人数</span>
          <div class="count-group" id="count-group" role="group" aria-label="选择玩家人数">
            <button type="button" class="btn count-btn" data-n="2" aria-pressed="true">2 人</button>
            <button type="button" class="btn count-btn" data-n="3" aria-pressed="false">3 人</button>
            <button type="button" class="btn count-btn" data-n="4" aria-pressed="false">4 人</button>
            <button type="button" class="btn count-btn" data-n="5" aria-pressed="false">5 人</button>
          </div>
        </div>
        <div class="online-panel">
          <h3 data-i18n="online_title">🌐 联机对战（2-5 人 · 全部游戏）</h3>
          <div class="online-row">
            <button type="button" class="btn btn-primary" id="btn-create-room" data-i18n="create_room">🎮 创建房间</button>
          </div>
          <div class="online-status" id="online-status">未连接</div>
        </div>
        <div class="game-grid" id="game-grid"></div>
      </div>
      <aside class="hub-side">
        <div class="lobby-panel" id="lobby-panel">
          <h3 data-i18n="lobby_title">🎮 游戏大厅（等待中的房间）</h3>
          <div class="lobby-list" id="lobby-list"></div>
        </div>
        <div class="lb-panel">
          <div class="lb-head">
            <h3 data-i18n="leaderboard_title">🏆 总排行榜</h3>
            <div class="lb-tabs">
              <button type="button" class="count-btn" id="lb-tab-all" aria-pressed="true" data-i18n="leaderboard_all">全部</button>
              <button type="button" class="count-btn" id="lb-tab-online" aria-pressed="false" data-i18n="leaderboard_online">在线</button>
            </div>
          </div>
          <div class="lb-list" id="lb-list"></div>
          <div class="lb-note" id="lb-note"></div>
        </div>
        <div class="lb-panel">
          <div class="lb-head">
            <h3 data-i18n="player_list_title">👥 玩家列表</h3>
          </div>
          <div class="player-list" id="player-list"></div>
        </div>
      </aside>
    </div>
  </section>

  <section id="screen-game" class="hidden">
    <div class="game-top">
      <button type="button" class="btn btn-ghost" id="btn-back">← 返回</button>
      <h2 id="game-title"></h2>
      <div class="top-actions">
        <button type="button" class="btn hidden" id="btn-end-game" title="结束本局，可在当前房间切换游戏">⏹ 结束本局</button>
        <button type="button" class="btn" id="btn-rules">📖 规则</button>
        <button type="button" class="btn" id="btn-restart">🔄 新一局</button>
      </div>
    </div>
    <div id="player-bar" class="player-bar"></div>
    <div id="status-bar" class="status-bar"></div>
    <div id="online-banner" class="hidden"></div>
    <div id="board-area" class="board-area"></div>
    <div id="game-extra" class="game-extra"></div>
  </section>
</div>
<div id="toast-wrap"></div>

<script>
'use strict';
/* ================= 通用工具 ================= */
const $ = id => document.getElementById(id);
function applyTheme(theme){
  if (document.documentElement && document.documentElement.setAttribute){
    document.documentElement.setAttribute('data-theme', theme);
  }
  const btn = $('btn-theme');
  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
}
function initTheme(){
  let t = 'light';
  try { t = localStorage.getItem('mg_theme') || 'light'; } catch {}
  applyTheme(t);
}
const PLAYER_COLORS = ['#e5484d','#3b82f6','#22a06b','#f59e0b','#8b5cf6'];
const PLAYER_BG = ['#fdecec','#eaf1fe','#e6f6ef','#fef4e0','#f3eefe'];
const GAMES = {
  tictactoe:  { name:'井字棋',     icon:'⭕', desc:'3×3 棋盘，三子连线即获胜', min:2, max:2 },
  gomoku:     { name:'五子棋',     icon:'⚫', desc:'15×15 棋盘，先连成五子获胜', min:2, max:2 },
  ludo:       { name:'飞行棋',     icon:'✈️', desc:'掷骰起飞，四架飞机全部归位获胜', min:2, max:4 },
  monopoly:   { name:'迷你大富翁', icon:'🏙️', desc:'买地收租，坚持到最后的玩家获胜', min:2, max:5 },
  checker:    { name:'弹珠跳棋',   icon:'🔮', desc:'跳子搬家，占领对角营地获胜', min:2, max:5 },
  tank:       { name:'坦克大战',   icon:'🛡️', desc:'双人对战：走位射击，击毁敌方基地或坦克', min:2, max:2 },
  snake:      { name:'贪吃蛇',     icon:'🐍', desc:'每人一条蛇竞速吃豆，撞墙/撞己即出局', min:2, max:4 },
  tetris:     { name:'俄罗斯方块', icon:'🧱', desc:'轮流行进消行，得分最高者获胜', min:2, max:4 },
  draughts:   { name:'跳棋',       icon:'⚪', desc:'8×8 国际跳棋：斜走吃子、成王连跳', min:2, max:2 },
  jungle:     { name:'斗兽棋',     icon:'🐘', desc:'8 兽互克过河，占领对方兽穴获胜', min:2, max:2 },
  xiangqi:    { name:'象棋',       icon:'♞', desc:'经典中国象棋：将死或困毙对方即获胜', min:2, max:2 },
};
const RULES = {
  tictactoe: ['3×3 棋盘，两名玩家轮流落子。','横、竖或斜向连成三子即获胜。','九格下满仍无人连成三子则为平局。'],
  gomoku: ['15×15 棋盘，两名玩家轮流落子。','先连成横向、竖向或斜向五子者获胜。','支持悔棋，可撤回上一步。'],
  ludo: ['支持 2-4 人，每人 4 架飞机，从基地起飞。','掷出 6 才能起飞，并额外再掷一次。','飞机沿轨道绕行一圈后进入自己的终点航线。','落在对方飞机所在格，可将其击回基地。','点数必须正好够到终点；四架全部归位即获胜。'],
  monopoly: ['支持 2-5 人，轮流掷两颗骰子前进。','走到未购买的地块可购买；他人地块需付租金。','机会卡包含随机事件；经过起点获得 2000。','资金不足即破产出局，地块回归银行。','第 30 轮结束时资产最多者获胜，也可随时提前结算。'],

  tank: ['两名玩家各操控一辆坦克与一座基地。','每回合可移动 1 格（方向键）或开炮（射击键）。','炮弹直线飞行，命中敌方坦克或基地即得分/获胜。','砖墙可被炮弹摧毁，钢墙不可摧毁。','先击毁敌方基地，或先击毁敌方坦克 3 次者获胜。'],

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}
function toast(msg){
  const wrap = $('toast-wrap');
  const t = el('div', 'toast', msg);
  wrap.appendChild(t);
  setTimeout(() => t.remove(), 1900);
}
function showModal(title, lines, btnText){

function pipsHTML(v){
  const map = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
  let h = '';
  for (let i=0;i<9;i++) h += '<span class="pip' + (map[v].includes(i) ? ' on' : '') + '"></span>';
  return h;
}
function animateDice(faces, final, cb){
  faces.forEach(f => f.classList.add('rolling'));
  let tick = 0;
  const iv = setInterval(() => {
    faces.forEach(f => f.innerHTML = pipsHTML(1 + Math.floor(Math.random()*6)));
    if (++tick >= 8){
      clearInterval(iv);
      faces.forEach(f => { f.innerHTML = pipsHTML(final); f.classList.remove('rolling'); });
      if (cb) cb();
    }
  }, 55);
}

/* ---------------- 3D 骰子 ---------------- */
function makeDice3D(size, sm){
  const wrap = el('div', 'dice3d-wrap' + (sm ? ' sm' : ''));
  const die = el('div', 'dice3d');
  wrap.style.width = wrap.style.height = (size + 10) + 'px';
  die.style.width = die.style.height = size + 'px';
  const half = size / 2;
  const faces = [
    [1, 'translateZ(' + half + 'px)'],
    [6, 'rotateY(180deg) translateZ(' + half + 'px)'],
    [3, 'rotateY(90deg) translateZ(' + half + 'px)'],
    [4, 'rotateY(-90deg) translateZ(' + half + 'px)'],
    [2, 'rotateX(90deg) translateZ(' + half + 'px)'],
    [5, 'rotateX(-90deg) translateZ(' + half + 'px)'],
  ];
  for (const [v, tf] of faces){
    const f = el('div', 'face');
    f.style.transform = tf;
    f.innerHTML = pipsHTML(v);
    die.appendChild(f);
  }
  const ROT = {
    1: 'rotateX(0deg) rotateY(0deg)',
    2: 'rotateX(-90deg) rotateY(0deg)',
    3: 'rotateX(0deg) rotateY(-90deg)',
    4: 'rotateX(0deg) rotateY(90deg)',
    5: 'rotateX(90deg) rotateY(0deg)',
    6: 'rotateX(0deg) rotateY(180deg)',
  };
  let rolling = false;
  function roll(final, cb){
    if (rolling){ if (cb) setTimeout(cb, 60); return; }
    rolling = true;
    die.style.transition = 'transform .09s linear';
    let i = 0;
    const iv = setInterval(() => {
      i++;
      die.style.transform = 'rotateX(' + Math.floor(Math.random() * 720) + 'deg) rotateY(' + Math.floor(Math.random() * 720) + 'deg)';
      if (i >= 12){
        clearInterval(iv);
        die.style.transition = 'transform .55s cubic-bezier(.2,.75,.3,1)';
        die.style.transform = ROT[final] || ROT[1];
        setTimeout(() => { rolling = false; if (cb) cb(); }, 560);
      }
    }, 65);
  }
  function reset(){
    rolling = false;
    die.style.transition = 'none';
    die.style.transform = ROT[1];
  }
  wrap.appendChild(die);
  return { wrap, die, roll, reset };
}

async function aiChoose(game, state, options){
  try {
    if (typeof fetch !== 'function') return null;
    const server = resolveServer();
    const url = server ? server.replace(/\/+$/, '') + '/api/ai' : '/api/ai';
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ game, state, options }),
      signal: (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) ? AbortSignal.timeout(15000) : undefined,
    });
    if (!res.ok) return null;
    const data = await res.json();
    return (data && data.choice) || null;
  } catch {
    return null;
  }
}
function aiPick(options){
  return options[Math.floor(Math.random() * options.length)];
}

/* ---------------- 开局倒计时 ---------------- */
function runCountdown(){
  const area = $('board-area');
  if (!area) return;
  const ov = el('div', 'overlay cd-overlay');
  const num = el('div', 'cd-num', '3');
  ov.appendChild(num);
  area.appendChild(ov);
  let n = 3;
  const iv = setInterval(() => {
    n--;
    if (n > 0){
      num.textContent = n;
      num.style.animation = 'none';
      void num.offsetWidth;
      num.style.animation = '';
    } else {
      clearInterval(iv);
      ov.classList.add('fade');
      setTimeout(() => ov.remove(), 260);
    }
  }, 700);
}

/* ================= 联机对战（WebSocket 中继） ================= */
const online = {
  ws: null, room: null, player: 0, isHost: false, game: null, connected: false, pending: null, roomInfo: null, capacity: 2, _hb: null,
  lobby: [], inviteTarget: null,
  defaultServer: 'https://mini-games-online.onrender.com',
  connect(){
    if (this.connected) return;
    let wsUrl;
    try {
      const raw = resolveServer();
      if (raw){
        const u = raw.replace(/\/+$/, '');
        wsUrl = (u.startsWith('https') ? 'wss://' : 'ws://') + u.replace(/^https?:\/\//, '') + '/ws';
      } else {
        wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
      }
    } catch {
      wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
    }
    this.ws = new WebSocket(wsUrl);
    this.ws.onopen = () => {
      this.connected = true;
      this.status('已连接服务器，可创建或加入房间');
      this.send({ type: 'hello', payload: { uid: typeof deviceUid !== 'undefined' ? deviceUid : null } });
      this.send({ type: 'lobby' });
      if (typeof syncProfiles === 'function') syncProfiles();
      if (account && account.uid && !account.registered){
        this.send({ type: 'register', payload: {
          uid: account.uid, pin: account.pin, name: account.name, avatar: account.avatar,
          background: account.background, frame: account.frame, effect: account.effect, owned: account.owned,
        } });
      }
      if (this._hb) clearInterval(this._hb);
      this._hb = setInterval(() => { if (this.connected) this.send({ type: 'ping' }); }, 10000);
      if (this.pending){
        const p = this.pending;
        this.pending = null;
        if (p.type === 'create') this.create();
        else if (p.type === 'join') this.join(p.room);
      }
    };
    this.ws.onmessage = e => this.onMessage(JSON.parse(e.data));
    this.ws.onclose = () => {
      this.connected = false;
      if (this._hb){ clearInterval(this._hb); this._hb = null; }
      this.status('连接已断开');
      this.resetState();
    };
    this.ws.onerror = () => this.status('连接失败，请确认服务已启动');
  },
  status(text){ $('online-status').innerHTML = text; },
  send(msg){ if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(msg)); },
  create(){
    if (!account){ toast('请先创建账号或登录后再联机'); openAuthModal(); return; }
    if (this.connected){
      this.send({type:'create', payload:{ capacity: playerCount }});
      this.status('正在创建房间…');
    } else {
      this.pending = { type:'create' };
      this.connect();
      this.status('正在连接服务器…');
    }
  },
  join(code){
    if (!account){ toast('请先创建账号或登录后再联机'); openAuthModal(); return; }
    code = String(code || '').trim().toUpperCase();
    if (code.length < 4){ toast('请输入房间码'); return; }
    if (this.connected){
      this.send({type:'join', payload:{room:code}});
      this.status('正在加入房间 ' + code + ' …');
    } else {
      this.pending = { type:'join', room:code };
      this.connect();
      this.status('正在连接服务器…');
    }
  },
  selectGame(id){ this.send({ type:'select_game', payload:{ game:id } }); },
  sendMove(payload){ this.send({type:'move', payload}); },
  sendRestart(){ this.send({type:'restart'}); },
  onMessage(msg){
    switch (msg.type){
      case 'created':
        this.room = msg.room; this.player = msg.player; this.isHost = true;
        this.capacity = msg.capacity || 2;
        this.roomInfo = { room: msg.room, game: null, capacity: this.capacity, players: [{ uid: null, player: 0 }], size: 1, started: false };
        this.status('房间已创建：<span class="room-code">' + msg.room + '</span>，等待对方加入…');
        renderRoomPanel();
        if (this.inviteTarget){
          const toUid = this.inviteTarget;
          this.inviteTarget = null;
          this.send({ type: 'invite', payload: { toUid } });
          toast('邀请已发送');
        }
        break;
      case 'joined':
        this.room = msg.room; this.player = msg.player; this.isHost = false;
        this.roomInfo = { room: msg.room, game: null, capacity: 2, players: [{ uid: null, player: 0 }], size: 1, started: false };
        this.status('已加入房间 <span class="room-code">' + msg.room + '</span>，等待房主开始…');
        renderRoomPanel();
        break;
      case 'room_update':
        this.roomInfo = msg.payload;
        this.capacity = msg.payload.capacity || this.capacity;
        if (!this.isHost && !this.room) this.room = msg.payload.room;
        if (this.game && !msg.payload.game && !msg.payload.started){
          finishRoomGame();
          return;
        }
        renderRoomPanel();
        break;
      case 'lobby':
        this.lobby = msg.payload || [];
        renderLobby();
        break;
      case 'invite':
        showInviteModal(msg.payload);
        break;
      case 'invite_result':
        toast(msg.payload && msg.payload.accepted ? '对方已接受邀请 🎉' : '对方拒绝了邀请');
        break;
      case 'started':
        this.game = msg.game;
        startOnlineGame(msg.game, msg.size);
        break;
      case 'move':
        if (this.game && currentGame && currentGame.onMove) currentGame.onMove(msg.payload);
        break;
      case 'restart':
        runCountdown();
        if (currentGame && currentGame.onRestart) currentGame.onRestart();
        else if (this.game) startOnlineGame(this.game);
        break;
      case 'end_game':
        finishRoomGame();
        break;
      case 'peer_left':
        if (this.isHost){
          this.game = null;
          toast('对方已离开');
          if (currentGameId) showHub();
          this.status('对方已离开，房间仍保留，等待新对手加入…');
          renderRoomPanel();
        } else {
          toast('房主已关闭房间');
          this.resetState();
          this.status('房间已关闭，可重新创建或加入房间');
        }
        break;
      case 'error':
        this.status(msg.msg || '出错了');
        toast(msg.msg || '出错了');
        break;
      case 'leaderboard':
        lastServerLB = msg.payload;
        renderLeaderboard();
        break;
      case 'profile_ok':
        if (msg.payload && account && msg.payload.uid === account.uid){
          // profile_ok 只是档案同步回执：只更新展示字段，不覆盖本地金币/局数（以免回写 0）
          account.name = msg.payload.name;
          account.avatar = msg.payload.avatar;
          account.background = msg.payload.background || account.background || 0;
          account.frame = msg.payload.frame || account.frame || 0;
          account.effect = msg.payload.effect || account.effect || 0;
          account.lang = msg.payload.lang || account.lang || 'zh-CN';
          const me = roster.find(x => x.uid === account.uid);
          if (me){ me.name = account.name; me.avatar = account.avatar; }
          saveRoster(); saveAccount();
          renderMe(); renderSlots();
        }
        break;
      case 'registered':
        if (msg.payload && msg.payload.uid){
          account.pin = account.pin || '';
          account.registered = true;
          updateAccountProfile(msg.payload.profile);
          toast('🎉 账号创建成功，欢迎 ' + account.name);
          if (authModalEl){ authModalEl.remove(); authModalEl = null; }
        }
        break;
      case 'logged_in':
        if (msg.payload && msg.payload.uid){
          account = Object.assign({}, msg.payload.profile, { device: deviceFingerprint() });
          updateAccountProfile(msg.payload.profile);
          toast('✅ 登录成功：' + account.name);
          if (authModalEl){ authModalEl.remove(); authModalEl = null; }
        }
        break;
      case 'auth_error':
        toast(msg.msg || '账号验证失败');
        break;
      case 'profile_data':
        if (msg.payload){
          renderProfilePopup(msg.payload, false);
        }
        break;
    }
  },
  resetState(){
    this.room = null; this.game = null; this.isHost = false; this.pending = null; this.roomInfo = null; this.capacity = 2; this.inviteTarget = null;
    $('online-banner').classList.add('hidden');
    $('room-panel').classList.add('hidden');
    const endBtn = $('btn-end-game');
    if (endBtn) endBtn.classList.add('hidden');
    if (currentGameId && $('screen-game') && !$('screen-game').classList.contains('hidden')){
      showHub();
    }
  },
};
function resolveServer(){
  try {
    const raw = (localStorage.getItem('mg_server') || '').trim();
    if (raw) return raw;
  } catch {}
  const h = (typeof location !== 'undefined' && location.hostname) || '';
  if (!h || h === 'localhost' || h === '127.0.0.1' || h.endsWith('.local')) return '';
  return online.defaultServer;
}
function finishRoomGame(){
  online.game = null;
  toast('本局已结束，可以在当前房间切换游戏');
  showHub();
  renderRoomPanel();
}
function startOnlineGame(id, sizeOverride){
  const size = Math.max(2, sizeOverride || (online.roomInfo && online.roomInfo.size) || online.capacity || 2);
  playerCount = size;
  showGame(id);
  const banner = $('online-banner');
  banner.classList.remove('hidden');
  banner.textContent = '房间 ' + online.room + ' · ' + size + ' 人局 · 你是玩家' + (online.player+1) + (online.isHost ? '（房主）' : '');
  runCountdown();
}
function renderRoomPanel(){
  const panel = $('room-panel');
  if (!online.room){
    panel.classList.add('hidden');
    return;
  }
  panel.classList.remove('hidden');
  $('room-code-big').textContent = online.room;
  const info = online.roomInfo || { size: 1, capacity: 2, players: [], game: null, started: false };
  const cap = info.capacity || 2;
  const names = (info.players || []).map(p => {
    const prof = p.uid ? profileByUid(p.uid) : null;
    return (prof ? prof.name : '玩家' + (p.player + 1)) + (p.uid && p.uid === deviceUid ? '（你）' : '');
  });
  $('room-info').textContent = '人数 ' + (info.size || 1) + '/' + cap + (names.length ? ' · ' + names.join(' vs ') : '') + ' · 游戏：' + (info.game ? GAMES[info.game].name : '未选择');
  let status;
  if (online.game){
    status = '对局进行中…';
  } else if (online.isHost){
    if (info.game){
      if (info.started) status = '对局进行中…';
      else if (info.size >= cap) status = '房间已满，对局即将开始…';
      else if (info.size >= 2) status = '已选择 ' + GAMES[info.game].name + '，可点击「开始游戏」或等人到齐';
      else status = '已选择 ' + GAMES[info.game].name + '，等待其他玩家加入…';
    } else {
      status = info.size >= 2 ? '玩家已就位！请选择游戏' : '等待玩家加入…（选择游戏后开始）';
    }
  } else {
    status = info.game
      ? (info.started ? '对局进行中…' : ('房主已选择 ' + GAMES[info.game].name + (info.size >= cap ? '，即将开始…' : '，等待更多玩家…')))
      : '等待房主选择游戏…';
  }
  $('room-status').textContent = status;
  const actions = $('room-actions');
  actions.innerHTML = '';
  if (online.game){
    if (currentGameId && $('screen-hub') && !$('screen-hub').classList.contains('hidden')){
      const backBtn = el('button','btn','🎮 返回对局');
      backBtn.addEventListener('click', () => startOnlineGame(online.game));
      actions.appendChild(backBtn);
    }
  } else {

/* ================= 账号注册 / PIN 登录 ================= */
function openAuthModal(mode){
  const bd = el('div','modal-backdrop auth-backdrop');
  authModalEl = bd;
  const card = el('div','modal-card');
  card.style.width = '460px';
  let m = mode || 'register';
  function render(){
    card.innerHTML = '';
    const hero = el('div','auth-hero');
    hero.appendChild(el('div','big', m === 'register' ? '✨' : '🔑'));
    hero.appendChild(el('h2', null, m === 'register' ? '创建你的账号' : 'PIN 登录'));
    hero.appendChild(el('p', null, m === 'register' ? '设置昵称、头像、背景，并创建一个专属 PIN 码。以后在任何设备输入 PIN 即可登录，账号永不丢失。' : '输入注册时设置的 PIN 码即可登录（仅限字母和数字）。'));
    card.appendChild(hero);
    if (m === 'register'){
      let avatar = 0, bg = 0;
      const nameInput = el('input','nick-input');
      nameInput.type = 'text'; nameInput.maxLength = 12;
      nameInput.placeholder = '昵称（12 字以内）';
      card.appendChild(nameInput);
      const avLabel = el('div','lb-note','选择头像');
      card.appendChild(avLabel);
      const grid = el('div','avatar-grid');
      for (let i = 0; i < 20; i++){
        const opt = el('button','avatar-opt' + (i === avatar ? ' selected' : ''));
        opt.type = 'button';
        opt.appendChild(avatarCanvas(i, 26));
        opt.addEventListener('click', () => {
          avatar = i;
          grid.querySelectorAll('.avatar-opt').forEach(o => o.classList.toggle('selected', o === opt));
        });
        grid.appendChild(opt);
      }
      card.appendChild(grid);
      card.appendChild(el('div','lb-note','选择背景'));
      const bgGrid = el('div','bg-grid');
      SHOP.backgrounds.forEach(b => {
        const sw = el('div','bg-swatch' + (b.id === bg ? ' selected' : '') + ' ' + b.cls);
        sw.title = b.name;
        sw.addEventListener('click', () => {
          bg = b.id;
          bgGrid.querySelectorAll('.bg-swatch').forEach(x => x.classList.toggle('selected', x === sw));
        });
        bgGrid.appendChild(sw);
      });
      card.appendChild(bgGrid);
      const pinInput = el('input','nick-input');
      pinInput.type = 'text'; pinInput.maxLength = 20;
      pinInput.placeholder = '设置 PIN 码（4-20 位，仅字母和数字）';
      card.appendChild(pinInput);
      const pin2 = el('input','nick-input');
      pin2.type = 'text'; pin2.maxLength = 20;
      pin2.placeholder = '再次输入 PIN 码确认';
      card.appendChild(pin2);
      card.appendChild(el('p','pin-hint','PIN 是唯一识别你账号的代码，登录时使用，请务必牢记。'));
      const submit = el('button','btn btn-primary','创建账号');
      submit.addEventListener('click', () => {
        const nm = nameInput.value.trim();
        if (!nm){ toast('请输入昵称'); return; }
        if (pinInput.value !== pin2.value){ toast('两次输入的 PIN 不一致'); return; }
        if (!/^[A-Za-z0-9]{4,20}$/.test(pinInput.value)){ toast('PIN 只能包含字母和数字，长度 4-20 位'); return; }
        registerAccount(nm, pinInput.value, avatar, bg);
      });
      card.appendChild(submit);
      const toLogin = el('button','btn btn-ghost','已有账号？输入 PIN 登录');
      toLogin.addEventListener('click', () => { m = 'login'; render(); });
      card.appendChild(toLogin);
    } else {
      const pinInput = el('input','nick-input');
      pinInput.type = 'text'; pinInput.maxLength = 20;
      pinInput.placeholder = '输入 PIN 码';
      card.appendChild(pinInput);
      const submit = el('button','btn btn-primary','登录');
      submit.addEventListener('click', () => loginAccount(pinInput.value));
      card.appendChild(submit);
      const toReg = el('button','btn btn-ghost','没有账号？去注册');
      toReg.addEventListener('click', () => { m = 'register'; render(); });
      card.appendChild(toReg);
    }
    const cancel = el('button','btn','取消');
    cancel.addEventListener('click', () => bd.remove());
    card.appendChild(cancel);
  }
  render();
  bd.appendChild(card);
  bd.addEventListener('click', e => { if (e.target === bd) bd.remove(); });
  document.body.appendChild(bd);
}

function openProfileModal(uid){
  if (!uid){
    if (!account){ openAuthModal(); return; }
    renderProfilePopup(account, true);
    return;
  }
  const isMe = account && account.uid === uid;
  if (isMe){ renderProfilePopup(account, true); return; }
  const local = profileByUid(uid);
  if (online.connected && lastServerLB){
    const u = lastServerLB.list.find(x => x.uid === uid);
    if (u) renderProfilePopup(u, false);
    else if (local) renderProfilePopup(local, false);
  } else if (local){
    renderProfilePopup(local, false);
  } else {
    toast('未找到该玩家档案');
  }
}

function openShop(){

  card.style.width = '520px';
  card.appendChild(el('h3', null, '🛍️ 个性商城'));

    ['avatars','头像'], ['frames','头像框'], ['effects','动态效果'], ['backgrounds','背景'],

      SHOP.avatars.forEach(a => {

        it.appendChild(avatarCanvas(a.id, 34));

            if ((account.coins || 0) < a.price){ toast('余额不足，先去赢几局吧'); return; }
            account.coins -= a.price;
            addOwned(account, 'avatars', a.id);
            saveAccount(); syncProfiles(); render(); renderMe();
            toast('✅ 已购买「' + a.name + '」');
          });
          it.appendChild(buy);
        } else {
          it.appendChild(el('div','si-price','已拥有'));

          it.appendChild(use);

          const ring = el('span','frame-ring ' + (tab === 'frames' ? item.cls : ''), '');
          if (tab === 'frames') st.appendChild(ring);
          st.appendChild(avatarCanvas(account.avatar, 30));
          it.appendChild(st);
        }
        it.appendChild(el('div','si-name', item.name));
        if (!owned){
          const price = el('div','si-price');
          price.appendChild(el('span','coin sm','$'));
          price.appendChild(el('span', null, ' ' + item.price));
          it.appendChild(price);
          const buy = el('button','btn btn-primary','购买');
          buy.addEventListener('click', () => {
            if ((account.coins || 0) < item.price){ toast('余额不足，先去赢几局吧'); return; }

            addOwned(account, cat, item.id);

            toast('✅ 已购买「' + item.name + '」');
          });
          it.appendChild(buy);
        } else {
          it.appendChild(el('div','si-price','已拥有'));
          const use = el('button','btn','使用');
          use.addEventListener('click', () => {
            if (tab === 'frames') account.frame = item.id;

            toast('✅ 已应用「' + item.name + '」');
          });
          it.appendChild(use);
        }
        listEl.appendChild(it);
      });
    }
  }
  render();
  const close = el('button','btn','关闭');
  close.addEventListener('click', () => bd.remove());

  card.appendChild(listEl);
  card.appendChild(close);
  bd.appendChild(card);
  bd.addEventListener('click', e => { if (e.target === bd) bd.remove(); });
  document.body.appendChild(bd);
}

function avatarMeta(idx){

function ownItem(acc, kind, id){
  if (!acc) return false;

function makeAvatar(idx){
  const BG = ['#fde68a','#fbcfe8','#bfdbfe','#bbf7d0','#e9d5ff','#fed7aa','#a5f3fc','#fecaca'];
  const SKIN = ['#ffdbac','#f1c27d','#e0ac69','#c68642','#8d5524','#ffe0bd'];
  const HAIR = ['#1f2937','#6b4226','#eab308','#dc2626','#2563eb','#ec4899'];
  const SHIRT = ['#ef4444','#3b82f6','#22c55e','#eab308','#a855f7','#14b8a6'];
  if (idx >= 20){
    const PRE = [
      { bg:'#fef08a', skin:'#ffdbac', hair:'#d97706', shirt:'#f59e0b', hat:'#fbbf24', glasses:true, crown:true },
      { bg:'#c7d2fe', skin:'#f1c27d', hair:'#e5e7eb', shirt:'#6366f1', visor:true },
      { bg:'#fecaca', skin:'#e0ac69', hair:'#b91c1c', shirt:'#dc2626', horns:true },
      { bg:'#a5f3fc', skin:'#cbd5e1', hair:'#64748b', shirt:'#0ea5e9', antenna:true, robot:true },
      { bg:'#bbf7d0', skin:'#c68642', hair:'#111827', shirt:'#16a34a', mask:true },
      { bg:'#dbeafe', skin:'#f1c27d', hair:'#78350f', shirt:'#f97316', eyePatch:true },
      { bg:'#ddd6fe', skin:'#ffe0bd', hair:'#7c3aed', shirt:'#8b5cf6', hat:true, stars:true },
      { bg:'#fde68a', skin:'#ffdbac', hair:'#1e40af', shirt:'#3b82f6', crown:true, scales:true },
    ][idx - 20];
    return {
      bg: PRE.bg, skin: PRE.skin, hair: PRE.hair, shirt: PRE.shirt,
      style: (idx * 3) % 4, glasses: !!PRE.glasses, blush: idx % 2 === 0, hat: !!PRE.hat,
      crown: !!PRE.crown, visor: !!PRE.visor, horns: !!PRE.horns, antenna: !!PRE.antenna, robot: !!PRE.robot,
      mask: !!PRE.mask, eyePatch: !!PRE.eyePatch, stars: !!PRE.stars, scales: !!PRE.scales,
    };
  }
  return {
    bg: BG[idx % 8],
    skin: SKIN[Math.floor(idx / 3) % 6],
    hair: HAIR[(idx * 2 + 1) % 6],
    shirt: SHIRT[(idx * 3) % 6],
    style: idx % 4,
    glasses: idx % 4 === 1,
    blush: idx % 3 === 0,
    hat: idx % 5 === 0,
  };
}
function avatarCanvas(idx, size){
  size = size || 40;
  const st = makeAvatar(idx);
  const off = document.createElement('canvas');
  off.width = 16; off.height = 16;
  const octx = off.getContext('2d');
  const img = octx.createImageData(16, 16);
  const px = (x, y, col) => {
    if (x < 0 || x > 15 || y < 0 || y > 15) return;
    const i = (y * 16 + x) * 4;
    img.data[i] = parseInt(col.slice(1,3), 16);
    img.data[i+1] = parseInt(col.slice(3,5), 16);
    img.data[i+2] = parseInt(col.slice(5,7), 16);
    img.data[i+3] = 255;
  };
  const rect = (x0, y0, x1, y1, col) => { for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) px(x, y, col); };
  rect(0, 0, 15, 15, st.bg);
  if (st.style === 2) rect(3, 2, 12, 12, st.hair); // 长发打底
  rect(6, 12, 9, 15, st.shirt);                    // 衣服
  rect(4, 3, 11, 12, st.skin);                     // 脸
  px(3, 7, st.skin); px(12, 7, st.skin);           // 耳朵
  if (st.style === 0){                              // 短发
    rect(3, 0, 12, 5, st.hair); rect(3, 3, 4, 6, st.hair); rect(11, 3, 12, 6, st.hair);
  } else if (st.style === 1){                       // 尖刺头
    rect(3, 1, 12, 4, st.hair); px(4, 0, st.hair); px(6, 0, st.hair); px(8, 0, st.hair); px(11, 0, st.hair);
    rect(3, 4, 4, 5, st.hair); rect(11, 4, 12, 5, st.hair);
  } else if (st.style === 2){                       // 长发
    rect(3, 3, 3, 10, st.hair); rect(12, 3, 12, 10, st.hair); rect(4, 1, 11, 4, st.hair);
  } else {                                          // 光头 + 刘海
    rect(4, 1, 11, 3, st.hair); px(4, 4, st.hair); px(7, 4, st.hair); px(11, 4, st.hair);
  }
  if (st.hat){ rect(2, 0, 13, 3, '#ef4444'); rect(1, 4, 14, 4, '#dc2626'); }
  if (st.crown){
    px(3, 0, '#fbbf24'); px(5, 0, '#fbbf24'); px(7, 0, '#fbbf24'); px(9, 0, '#fbbf24'); px(11, 0, '#fbbf24');
    rect(2, 1, 12, 3, '#f59e0b'); px(6, 2, '#fde047');
  }
  if (st.visor){ rect(2, 5, 13, 8, '#0f172a'); rect(4, 6, 11, 7, '#38bdf8'); }
  if (st.horns){ px(4, 1, '#f59e0b'); px(11, 1, '#f59e0b'); px(4, 2, '#fbbf24'); px(11, 2, '#fbbf24'); }
  if (st.antenna){ px(7, 0, '#94a3b8'); px(7, 1, '#ef4444'); }
  if (st.mask){ rect(5, 7, 10, 8, '#111827'); px(6, 7, '#ef4444'); px(9, 7, '#ef4444'); }
  if (st.eyePatch){ rect(8, 6, 10, 8, '#111827'); rect(9, 8, 9, 9, '#78350f'); }
  if (st.stars){ px(2, 2, '#fde047'); px(13, 3, '#fde047'); px(3, 12, '#fde047'); px(12, 13, '#fde047'); }
  if (st.scales){ px(3, 12, '#22d3ee'); px(5, 12, '#22d3ee'); px(10, 12, '#22d3ee'); px(12, 12, '#22d3ee'); }
  if (st.glasses){
    rect(5, 7, 6, 8, '#111827'); rect(8, 7, 9, 8, '#111827'); px(7, 7, '#111827');
  } else {
    px(6, 7, '#1f2937'); px(9, 7, '#1f2937');
  }
  if (st.blush){ px(5, 9, '#fda4af'); px(10, 9, '#fda4af'); }
  rect(7, 10, 8, 10, '#b45309'); // 嘴
  octx.putImageData(img, 0, 0);
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, 0, 0, size, size);
  return c;
}
function avatarStageNode(profile, size, extraCls){
  const st = el('span', 'mini-avatar-stage' + (extraCls ? ' ' + extraCls : ''));

function deviceFingerprint(){
  let s = '';
  try { s += (navigator.userAgent || '') + '|'; } catch {}
  try { s += (navigator.language || '') + '|'; } catch {}
  try { s += String(screen.width) + 'x' + String(screen.height) + '|'; } catch {}
  try { s += String(navigator.hardwareConcurrency || 0) + '|'; } catch {}
  try { s += (Intl.DateTimeFormat().resolvedOptions().timeZone || '') + '|'; } catch {}
  try { s += (navigator.platform || '') + '|'; } catch {}
  let h1 = 0, h2 = 0;
  for (let i = 0; i < s.length; i++){
    h1 = (h1 * 31 + s.charCodeAt(i)) | 0;
    h2 = (h2 * 33 + s.charCodeAt(i)) | 0;
  }
  return 'd' + Math.abs(h1).toString(36) + Math.abs(h2).toString(36);
}
function defaultOwned(){
  return {
    avatars: Array.from({ length: 20 }, (_, i) => i),
    frames: [0], effects: [0], backgrounds: [0],
  };
}
function loadRoster(){
  try {
    const raw = localStorage.getItem(LS_ROSTER);
    roster = raw ? JSON.parse(raw) : [];
  } catch { roster = []; }
  if (!Array.isArray(roster)) roster = [];
  roster.forEach(p => {
    if (p.coins === undefined) p.coins = p.points ? 1 : 0;
    delete p.points;
    if (!p.played) p.played = {};
    if (!p.total) p.total = 0;
  });
  try {
    const raw = localStorage.getItem(LS_ACCOUNT);
    account = raw ? JSON.parse(raw) : null;
  if (account && !account.lang) account.lang = 'zh-CN';
  } catch { account = null; }
  if (account && account.uid && account.device === deviceFingerprint()){
    deviceUid = account.uid;
    const me = roster.find(p => p.uid === account.uid);
    if (!me) roster.unshift({ uid: account.uid, name: account.name, avatar: account.avatar, coins: account.coins || 0, played: account.played || {}, total: account.total || 0 });
  } else {
    deviceUid = null;
  }
  try { localStorage.setItem('mg_uid', deviceUid || ''); } catch {}
}

function genUid(){

  return 'u_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}

function registerAccount(name, pin, avatar, background, frame, effect){
  name = String(name || '').trim().slice(0, 12) || '玩家';
  pin = String(pin || '').trim();

    return null;
  }
  const uid = genUid();
  account = {
    uid, pin, name, lang: currentLang,
    avatar: Number.isInteger(avatar) ? Math.max(0, Math.min(AVATAR_COUNT - 1, avatar)) : 0,
    background: Number.isInteger(background) ? Math.max(0, background) : 0,
    frame: Number.isInteger(frame) ? Math.max(0, frame) : 0,
    effect: Number.isInteger(effect) ? Math.max(0, effect) : 0,
    owned: defaultOwned(), coins: 0, played: {}, total: 0, device: deviceFingerprint(),
  };
  const me = roster.find(p => p.uid === uid);
  if (me){ me.name = name; me.avatar = account.avatar; }
  else roster.unshift({ uid, name, avatar: account.avatar, coins: 0, played: {}, total: 0 });
  deviceUid = uid;
  saveRoster(); saveAccount();
  if (online.connected){
    online.send({ type: 'register', payload: {

function applyGameResult(results){
  if (!results || !results.length) return;
  const gameId = currentGameId;
  const entries = [];
  const parts = [];
  results.forEach(r => {
    let uid = null;
    if (online.connected && online.game){
      if (r.slot !== online.player) return;
      uid = deviceUid;
    } else {
      uid = slots[r.slot];
    }
    const p = uid ? profileByUid(uid) : null;
    if (!p) return;
    if (r.coins === 1) p.coins = (p.coins || 0) + 1;
    p.played[gameId] = (p.played[gameId] || 0) + 1;
    p.total = (p.total || 0) + 1;
    if (account && p.uid === account.uid){
      account.coins = p.coins;
      account.played = p.played;
      account.total = p.total;
      saveAccount();
    }
    entries.push({ uid:p.uid, name:p.name, avatar:p.avatar, game:gameId, coins: r.coins === 1 ? 1 : 0, played: 1 });
    parts.push(p.name + (r.coins === 1 ? ' 获得 $1' : ' 本局无奖励'));
  });
  saveRoster();
  if (entries.length){
    if (online.connected){
      entries.forEach(e => online.send({ type:'profile', payload:{ uid:e.uid, name:e.name, avatar:e.avatar } }));
      online.send({ type:'result', payload: entries.map(e => ({ uid:e.uid, game:e.game, coins:e.coins, played:1 })) });
    }
    toast(t('toast_win_reward') + parts.join('，'));
  }
  renderMe(); renderSlots(); renderLeaderboard();
}
