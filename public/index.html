<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title data-i18n="app_title">Playroom · 联机与人机游戏平台</title>
<style>
:root{
  /* ================= Design Tokens ================= */
  /* --- Color System --- */
  --bg-main:#eef1f8; --bg-card:rgba(255,255,255,.74); --bg-card-solid:#ffffff;
  --text-primary:#1d2433; --text-secondary:#6b7388; --text-on-accent:#ffffff;
  --accent:#4f6ef7; --accent-strong:#3d5ce5; --accent-soft:rgba(79,110,247,.10);
  --success:#22a06b; --warning:#f59e0b; --danger:#e5484d;
  --border-color:#e2e7f0;
  --hero-grad-a:rgba(79,110,247,.32); --hero-grad-b:rgba(139,92,246,.28); --hero-grad-c:rgba(245,158,11,.22);
  --shadow-sm:0 2px 8px rgba(29,41,75,.05);
  --shadow-md:0 8px 24px rgba(29,41,75,.09);
  --shadow-lg:0 18px 52px rgba(29,41,75,.16);
  --glow-accent:0 0 0 0 rgba(79,110,247,0);
  /* 玩家色（保持旧变量兼容） */
  --p0:#e5484d; --p1:#3b82f6; --p2:#22a06b; --p3:#f59e0b; --p4:#8b5cf6;
  --p0bg:#fdecec; --p1bg:#eaf1fe; --p2bg:#e6f6ef; --p3bg:#fef4e0; --p4bg:#f3eefe;

  /* --- Typography --- */
  --font-primary:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-display:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --fs-display:28px; --fs-title:20px; --fs-subtitle:16px; --fs-body:14px; --fs-small:12px; --fs-micro:11px;
  --fw-light:300; --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700; --fw-black:800;
  --lh-tight:1.2; --lh-normal:1.5; --lh-loose:1.8;
  --ls-tight:-.2px; --ls-normal:0; --ls-wide:.6px;

  /* --- Spacing（4px 基础单位） --- */
  --sp-xs:4px; --sp-sm:8px; --sp-md:16px; --sp-lg:24px; --sp-xl:32px; --sp-xxl:48px;

  /* --- Shape / Motion --- */
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:22px; --radius-full:999px;
  /* --- Motion System --- */
  --dur-instant:60ms; --dur-fast:120ms; --dur-base:220ms; --dur-slow:420ms; --dur-slower:640ms;
  --ease-out:cubic-bezier(.22,.86,.4,1.2); --ease-in:cubic-bezier(.55,.06,.68,.19);
  --ease-standard:cubic-bezier(.4,0,.2,1); --ease-spring:cubic-bezier(.34,1.56,.64,1); --ease-bounce:cubic-bezier(.18,.89,.32,1.28);
  --motion-pop:scale(1.05); --motion-press:scale(.97); --motion-rise:translateY(-3px);
  /* --- Elevation --- */
  --elev-0:none;
  --elev-1:0 1px 3px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.04);
  --elev-2:0 4px 12px rgba(15,23,42,.10), 0 2px 4px rgba(15,23,42,.06);
  --elev-3:0 12px 28px rgba(15,23,42,.14), 0 4px 10px rgba(15,23,42,.08);
  --elev-4:0 24px 56px rgba(15,23,42,.20), 0 8px 20px rgba(15,23,42,.12);
  /* --- Focus / a11y --- */
  --focus-ring:0 0 0 3px var(--accent-soft);
  --focus-ring-visible:0 0 0 3px rgba(79,110,247,.45);
  /* --- Icon --- */
  --icon-xs:14px; --icon-sm:18px; --icon-md:24px; --icon-lg:32px; --icon-xl:44px;
  /* --- Component: Badge --- */
  --badge-pad:3px 9px; --badge-radius:999px; --badge-font:11px; --badge-weight:600;
  /* --- Glass --- */
  --glass-bg:rgba(255,255,255,.72);
  --glass-bg-dark:rgba(25,32,52,.72);
  --glass-border:var(--border-color);
  --glass-blur:blur(14px);
  --dur-fast:120ms; --dur-base:220ms; --dur-slow:420ms;
  --ease-out:cubic-bezier(.22,.86,.4,1.2); --ease-standard:cubic-bezier(.4,0,.2,1);

  /* --- Legacy aliases（旧组件零改动兼容） --- */
  --bg:var(--bg-main); --card:var(--bg-card); --text:var(--text-primary); --muted:var(--text-secondary);
  --primary:var(--accent); --primary-dark:var(--accent-strong); --border:var(--border-color);
  --shadow:var(--shadow-md); --radius:var(--radius-lg);
}

/* ================= Theme: Light ================= */
html[data-theme="light"]{
  --bg-main:#eef1f8; --bg-card:rgba(255,255,255,.74); --bg-card-solid:#ffffff;
  --text-primary:#1d2433; --text-secondary:#6b7388;
  --accent:#4f6ef7; --accent-strong:#3d5ce5; --accent-soft:rgba(79,110,247,.10);
  --border-color:#e2e7f0;
  --hero-grad-a:rgba(79,110,247,.32); --hero-grad-b:rgba(139,92,246,.28); --hero-grad-c:rgba(245,158,11,.22);
  --p0bg:#fdecec; --p1bg:#eaf1fe; --p2bg:#e6f6ef; --p3bg:#fef4e0; --p4bg:#f3eefe;
}

/* ================= Theme: Midnight / Dark ================= */
html[data-theme="dark"], html[data-theme="midnight"]{
  --bg-main:#0d1220; --bg-card:rgba(25,32,52,.70); --bg-card-solid:#161d30;
  --text-primary:#e8edf8; --text-secondary:#93a0ba;
  --accent:#6d8bff; --accent-strong:#5470ea; --accent-soft:rgba(109,139,255,.16);
  --border-color:rgba(148,163,198,.16);
  --hero-grad-a:rgba(79,110,247,.28); --hero-grad-b:rgba(139,92,246,.24); --hero-grad-c:rgba(80,200,255,.14);
  --p0bg:#3a1f24; --p1bg:#1c2a45; --p2bg:#16352b; --p3bg:#3a2d14; --p4bg:#2a2240;
}

/* ================= Theme: Ocean ================= */
html[data-theme="ocean"]{
  --bg-main:#eef7fb; --bg-card:rgba(255,255,255,.78); --bg-card-solid:#ffffff;
  --text-primary:#10303f; --text-secondary:#4f7181;
  --accent:#0e9bb8; --accent-strong:#0b7d95; --accent-soft:rgba(14,155,184,.12);
  --border-color:#d5e8ef;
  --hero-grad-a:rgba(14,155,184,.30); --hero-grad-b:rgba(45,212,191,.26); --hero-grad-c:rgba(59,130,246,.18);
  --p0bg:#fdecec; --p1bg:#e0f4f9; --p2bg:#e0f5f1; --p3bg:#fef4e0; --p4bg:#eef2fd;
  --p0:#e5484d; --p1:#0e9bb8; --p2:#0d9f8e; --p3:#f59e0b; --p4:#5b7ce8;
}

/* ================= Theme: Forest ================= */
html[data-theme="forest"]{
  --bg-main:#eef6ee; --bg-card:rgba(255,255,255,.76); --bg-card-solid:#ffffff;
  --text-primary:#1c3326; --text-secondary:#5c7565;
  --accent:#2e9e5b; --accent-strong:#238048; --accent-soft:rgba(46,158,91,.12);
  --border-color:#d6e7da;
  --hero-grad-a:rgba(46,158,91,.28); --hero-grad-b:rgba(132,204,22,.20); --hero-grad-c:rgba(251,191,36,.16);
  --p0bg:#fdecec; --p1bg:#e3f3e8; --p2bg:#e3f5e5; --p3bg:#fef4e0; --p4bg:#eef2e0;
  --p0:#e5484d; --p1:#2e9e5b; --p2:#3fb950; --p3:#c98912; --p4:#7c9c2f;
}

/* ================= Theme: Cyber ================= */
html[data-theme="cyber"]{
  --bg-main:#12101f; --bg-card:rgba(28,24,54,.78); --bg-card-solid:#1b1734;
  --text-primary:#ece9ff; --text-secondary:#9c96c8;
  --accent:#8b5cf6; --accent-strong:#6d3ef0; --accent-soft:rgba(139,92,246,.18);
  --border-color:rgba(139,92,246,.26);
  --hero-grad-a:rgba(139,92,246,.30); --hero-grad-b:rgba(6,182,212,.24); --hero-grad-c:rgba(244,114,182,.16);
  --p0bg:#3a1f2e; --p1bg:#241f45; --p2bg:#1d2f42; --p3bg:#3a2d14; --p4bg:#2f1e3f;
  --p0:#ff5d8f; --p1:#38bdf8; --p2:#34d399; --p3:#fbbf24; --p4:#c084fc;
}

/* ================= Theme: Sakura ================= */
html[data-theme="sakura"]{
  --bg-main:#fdf0f4; --bg-card:rgba(255,255,255,.82); --bg-card-solid:#ffffff;
  --text-primary:#44262f; --text-secondary:#8d6873;
  --accent:#e85d8b; --accent-strong:#d23f72; --accent-soft:rgba(232,93,139,.12);
  --border-color:#f2d7df;
  --hero-grad-a:rgba(232,93,139,.26); --hero-grad-b:rgba(251,182,206,.30); --hero-grad-c:rgba(255,224,130,.20);
  --p0bg:#fde9ee; --p1bg:#fce7ef; --p2bg:#e7f6ee; --p3bg:#fdf3d8; --p4bg:#f1e7fc;
  --p0:#e85d8b; --p1:#7c9cf0; --p2:#5db58a; --p3:#e0a93f; --p4:#a98be8;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg-main); color:var(--text-primary);
  font-family:var(--font-primary); font-size:var(--fs-body); line-height:var(--lh-normal);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background var(--dur-base) var(--ease-standard), color var(--dur-base) var(--ease-standard);
}
body::before, body::after{
  content:''; position:fixed; z-index:-1; width:64vmax; height:64vmax; border-radius:50%;
  filter:blur(100px); opacity:.6; pointer-events:none;
}
body::before{background:radial-gradient(circle, rgba(79,110,247,.30), transparent 62%); top:-22vmax; left:-16vmax}
body::after{background:radial-gradient(circle, rgba(245,180,60,.24), transparent 62%); bottom:-26vmax; right:-16vmax}
:is(html[data-theme="dark"], html[data-theme="midnight"], html[data-theme="ocean"], html[data-theme="forest"], html[data-theme="cyber"], html[data-theme="sakura"]) body::before{background:radial-gradient(circle, rgba(79,110,247,.24), transparent 62%)}
:is(html[data-theme="dark"], html[data-theme="midnight"], html[data-theme="ocean"], html[data-theme="forest"], html[data-theme="cyber"], html[data-theme="sakura"]) body::after{background:radial-gradient(circle, rgba(160,100,255,.20), transparent 62%)}
button{font-family:inherit; cursor:pointer}
.hidden{display:none !important}
#app{max-width:1080px; margin:0 auto; padding:18px 16px 40px}
.app-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--sp-lg)}
.brand{display:flex; align-items:center; gap:var(--sp-sm); font-size:var(--fs-subtitle); font-weight:var(--fw-bold); letter-spacing:var(--ls-wide); text-shadow:0 1px 2px rgba(15,23,42,.06)}
.brand .brand-icon{width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center}
.brand .brand-icon img{width:100%; height:100%; display:block}
.asset-fallback{display:none}
.asset-failed .asset-fallback{display:inline}
.brand .brand-tag{font-size:12px; color:var(--muted); font-weight:500; letter-spacing:.6px}
.theme-btn{font-size:19px; padding:6px 11px; border-radius:99px; background:var(--card); border:1px solid var(--border)}
.ui-icon{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;line-height:0;color:currentColor}
.ui-icon img{display:block;width:100%;height:100%;filter:none}
:is(html[data-theme="dark"],html[data-theme="midnight"],html[data-theme="cyber"]) .ui-icon img{filter:brightness(0) invert(1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px}.ui-icon-label{min-width:0}

/* 大厅双栏布局 */
.hub-grid{display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:16px; align-items:start}
.hub-main{display:flex; flex-direction:column; gap:14px; min-width:0}
.hub-side{display:flex; flex-direction:column; gap:14px; min-width:0}
@media (max-width: 880px){
  .hub-grid{grid-template-columns:1fr}
}

/* 通用按钮 */
.btn{
  border:1px solid var(--border); background:var(--card); color:var(--text);
  border-radius:10px; padding:8px 14px; font-size:14px; font-weight:500;
  transition:transform .08s ease, box-shadow .15s ease, background .15s ease;
}
.btn:hover{box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary); border-color:var(--primary); color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-ghost{background:transparent; border-color:transparent; color:var(--muted)}
.btn-ghost:hover{background:rgba(29,41,75,.05); color:var(--text); box-shadow:none}
.btn:disabled{opacity:.5; cursor:not-allowed; box-shadow:none}

/* 大厅 */
.hub-count{
  display:flex; align-items:center; justify-content:center; gap:12px;
  flex-wrap:wrap; margin-bottom:18px;
}
.hub-label{font-size:14px; font-weight:500; color:var(--muted)}
.mode-group{display:flex; gap:6px; background:var(--card); padding:6px; border-radius:12px; border:1px solid var(--border); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px)}
.count-group{display:flex; gap:8px; background:var(--card); padding:6px; border-radius:12px; border:1px solid var(--border)}
.count-btn{padding:8px 18px; border:1px solid transparent; background:transparent; border-radius:8px; font-size:14px; color:var(--muted)}
.count-btn:hover{background:rgba(79,110,247,.08)}
.count-btn[aria-pressed="true"]{background:var(--primary); color:#fff}
.game-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px;
}
.game-card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px 16px; text-align:left; transition:transform .12s ease, box-shadow .15s ease;
  display:flex; flex-direction:column; gap:8px;
}
.game-card:hover{transform:translateY(-2px); box-shadow:var(--shadow)}
.game-card .icon{
  font-size:30px; line-height:1; width:52px; height:52px; border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--border-color);
  transition:transform var(--dur-fast) var(--ease-out);
}
.game-card:hover .icon{transform:scale(1.08) rotate(-4deg)}
.game-card.has-cover{padding:10px 10px 14px; overflow:hidden}
.game-cover{position:relative; width:100%; aspect-ratio:16/9; border-radius:12px; overflow:hidden; background:linear-gradient(145deg,var(--accent-soft),var(--bg-card-solid)); border:1px solid var(--border-color)}
.game-cover img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transform:scale(1.015); transition:opacity var(--dur-base),transform var(--dur-slow)}
.game-cover.asset-ready img{opacity:1}
.game-card:hover .game-cover.asset-ready img{transform:scale(1.055)}
.game-cover-fallback{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:34px; color:var(--text-primary)}
.game-cover.asset-ready .game-cover-fallback{opacity:0}
.game-card .name{font-size:17px; font-weight:600}
.game-card .desc{font-size:12.5px; color:var(--muted); line-height:1.5; min-height:36px}
.game-card .range{font-size:12px; color:var(--primary); background:var(--p1bg); padding:3px 9px; border-radius:99px; align-self:flex-start}
.game-card .badge-row{display:flex; gap:6px; align-items:center; align-self:flex-start}
.ai-badge{font-size:12px; color:#fff; background:linear-gradient(135deg,#8b5cf6,#6366f1); padding:3px 9px; border-radius:99px}
.game-card.disabled{cursor:not-allowed; opacity:.55}
.game-card.disabled:hover{transform:none; box-shadow:none}

/* 联机面板 */
.online-panel{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:16px;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
}
.online-panel h3{margin:0 0 10px; font-size:15px}
.online-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.online-row input{
  flex:1; min-width:150px; padding:8px 12px; border:1px solid var(--border);
  border-radius:10px; font-size:14px; font-family:inherit;
}
.online-row input:focus{outline:2px solid var(--primary); outline-offset:1px}
.online-status{margin-top:8px; font-size:13px; color:var(--muted); min-height:18px}
.online-status .room-code{color:var(--primary); font-weight:600; letter-spacing:1px}
#online-banner{
  text-align:center; background:rgba(79,110,247,.08); border:1px dashed var(--primary);
  border-radius:10px; padding:7px 10px; font-size:13px; margin-bottom:10px; color:var(--text);
}

/* 用户档案与排行榜 */
.hub-meta{display:flex; justify-content:center; margin-bottom:14px}
.me-chip{
  display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
  background:var(--card); border:1px solid var(--border);
  border-radius:99px; padding:7px 14px; font-size:14px; font-weight:500;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  max-width:100%;
}
.me-chip.logged-out{
  background:linear-gradient(135deg, rgba(79,110,247,.14), rgba(139,92,246,.10));
  border-color:var(--primary); cursor:pointer;
  animation:mePulse 2.2s ease-in-out infinite;
  min-width:220px;
}
@keyframes mePulse{0%,100%{box-shadow:0 0 0 0 rgba(79,110,247,.18)}50%{box-shadow:0 0 0 8px rgba(79,110,247,0)}}
.me-chip:hover{border-color:var(--primary)}
.me-chip .me-av{font-size:22px}
.me-chip .me-pts{color:var(--muted); font-size:12.5px; font-weight:400}
.slots-row{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:14px}
.slot-chip{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  background:var(--card); border:1px dashed var(--border); border-radius:12px;
  padding:9px 16px; font-size:12px; min-width:92px;
}
.slot-chip:hover{border-color:var(--primary)}
.slot-chip.set{border-style:solid}
.slot-chip.ai{border-style:solid; border-color:rgba(139,92,246,.55); background:rgba(139,92,246,.10)}
.slot-chip .av{font-size:25px; line-height:1}
.slot-chip .nm{font-weight:500; font-size:12.5px}
.slot-chip .pts{color:var(--muted); font-size:11px}
.lb-panel{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-top:18px}
.lb-panel, .lobby-panel, .game-card, .count-group, .slot-chip, .game-top, .status-bar, .pchip, .modal-card{backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px)}
.lb-panel h3{margin:0 0 10px; font-size:15px}
.lb-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.lb-head h3{margin:0}
.lb-tabs{display:flex; gap:6px}
.lb-list{display:flex; flex-direction:column; gap:4px}
.lb-row{display:flex; align-items:center; gap:10px; font-size:13.5px; padding:6px 8px; border-radius:8px}
.lb-row.me{background:rgba(79,110,247,.07)}
.lb-rank{width:24px; text-align:center; color:var(--muted); font-weight:500; flex:none}
.lb-av{font-size:20px; flex:none}
.lb-name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lb-game{font-size:11px; color:var(--muted); max-width:38%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lb-pts{font-weight:600; font-variant-numeric:tabular-nums; flex:none}
.lb-empty{color:var(--muted); font-size:13px; padding:8px 0}
.lb-note{font-size:11.5px; color:var(--muted); margin-top:8px}
.social-panel .lb-head{align-items:center}.social-count{display:inline-flex;min-width:20px;height:20px;padding:0 6px;align-items:center;justify-content:center;border-radius:99px;background:var(--primary);color:#fff;font-size:11px;font-weight:700}.social-tabs{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.social-tab{font-size:11px;padding:5px 8px}.social-row{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px solid var(--border);min-width:0}.social-row:last-child{border-bottom:0}.social-row .social-copy{flex:1;min-width:0}.social-name{font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.social-meta{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.social-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.social-actions .btn{padding:4px 7px;font-size:10px;min-height:30px}.social-empty{padding:12px 4px;color:var(--muted);font-size:11px;text-align:center}.social-danger{color:var(--danger,#ef4444)}
.avatar-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:10px 0 14px}
.avatar-opt{
  font-size:25px; border:2px solid var(--border); border-radius:12px; background:var(--card);
  padding:6px 0; line-height:1.2;
}
.avatar-opt.selected{border-color:var(--primary); background:rgba(79,110,247,.08)}
.avatar-opt:hover{border-color:var(--primary)}
.avatar-opt.locked{opacity:.62; position:relative; cursor:not-allowed}
.avatar-opt.locked:hover{border-color:var(--border)}
.avatar-lock{
  position:absolute; top:-3px; right:-3px; font-size:8.5px; font-weight:700;
  background:rgba(15,23,42,.78); color:#fff; border-radius:99px; padding:1px 5px;
  line-height:1.5; white-space:nowrap; z-index:3;
}
.auth-avatar-grid{max-height:230px; overflow-y:auto; padding-right:4px}
.nick-input{
  width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:10px;
  font-size:15px; font-family:inherit; box-sizing:border-box;
}
.nick-input:focus{outline:2px solid var(--primary); outline-offset:1px}
.profile-stats{display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 14px}
.stat-chip{display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--text); background:var(--p1bg); border:1px solid var(--border); border-radius:99px; padding:4px 10px}
.stat-chip.small{background:transparent}
.roster-list{display:flex; flex-direction:column; gap:6px; margin:10px 0 12px}
.roster-item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:rgba(255,255,255,.78); border:1px solid var(--border); border-radius:10px; padding:8px 12px; font-size:14px;
}
.roster-item:hover{border-color:var(--primary)}
.roster-item .av{font-size:22px}
.roster-item .nm{flex:1; font-weight:500}

/* 平台虚拟现金 */
.coin{
  display:inline-flex; align-items:center; justify-content:center;
  width:18px; height:18px; flex:none;
}
.coin.sm{width:14px; height:14px}
.coin .coin-asset{width:100%; height:100%; display:block; object-fit:contain; filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.coin .coin-fallback{display:none; line-height:1}
.coin.asset-failed .coin-fallback{display:inline}
.coin-line{display:inline-flex; align-items:center; gap:3px}
.online-dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 2px #fff; flex:none}
.online-dot.off{background:#cbd5e1}
.me-chip .me-online{margin-left:2px}

/* 房间面板 */
.room-panel{
  background:linear-gradient(180deg, rgba(79,110,247,.08), rgba(79,110,247,.03));
  border:1px solid var(--primary); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:14px;
}
.room-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px}
.room-head h3{margin:0; font-size:15px}
.room-code-big{font-size:19px; font-weight:700; letter-spacing:2px; color:var(--primary)}
.room-info{font-size:13px; margin-bottom:6px}
.room-status{font-size:13px; font-weight:500; margin-bottom:10px; min-height:18px}
.room-actions{display:flex; gap:8px; flex-wrap:wrap}
.seat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:8px; margin:10px 0}
.seat-card{min-height:92px; padding:10px; border:1px solid var(--border); border-radius:12px; background:var(--card); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; text-align:center; position:relative}
.seat-card.is-host{border-color:var(--primary); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--primary) 35%,transparent)}
.seat-card.is-empty{border-style:dashed; color:var(--muted)}
.seat-card.is-offline{opacity:.65}.seat-name{font-size:13px;font-weight:700}.seat-meta{font-size:11px;color:var(--muted)}
.seat-badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}.seat-badge{font-size:10px;padding:2px 6px;border-radius:999px;background:var(--soft);color:var(--text-secondary)}
.seat-badge.ready{background:rgba(34,197,94,.14);color:#15803d}.seat-badge.bot{background:rgba(139,92,246,.14);color:#7c3aed}
.play-panel{align-items:flex-start;flex-direction:column}.play-actions{width:100%}.play-actions input{min-width:130px;flex:1}
.avatar-art-v2{display:block;object-fit:cover;border-radius:4px;image-rendering:auto}
.mini-profile-card{position:fixed;z-index:10000;width:min(300px,calc(100vw - 16px));padding:10px;border:1px solid rgba(255,255,255,.28);border-radius:14px;box-shadow:var(--shadow-lg);background:linear-gradient(135deg,#334155,#111827);color:#fff}
.mini-profile-scrim{display:flex;gap:10px;align-items:center;padding:9px;border-radius:11px;background:rgba(15,23,42,.6);backdrop-filter:blur(12px)}.mini-profile-copy{min-width:0;flex:1}.mini-profile-card .seat-meta{color:rgba(255,255,255,.82)}

/* 游戏大厅 */
.lobby-panel{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:14px;
}
.lobby-panel h3{margin:0 0 10px; font-size:15px}
.lobby-list{display:flex; flex-direction:column; gap:8px}
.lobby-row{
  display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.78);
  border:1px solid var(--border); border-radius:12px; padding:9px 12px;
}
.lobby-row .av{flex:none}
.lobby-row .info{flex:1; min-width:0}
.lobby-row .nm{font-weight:600; font-size:14px}
.lobby-row .meta{font-size:12px; color:var(--muted)}
.lobby-seat-strip{display:flex;gap:3px;margin-top:4px}.lobby-seat-dot{font-size:10px;padding:2px 5px;border-radius:999px;background:var(--soft)}
.lobby-row{transition:transform var(--dur-base) var(--ease-out), border-color var(--dur-base), box-shadow var(--dur-base)}
.lobby-row:hover{transform:translateY(-1px); border-color:var(--primary); box-shadow:var(--shadow-sm)}
.lobby-empty{color:var(--muted); font-size:13px; padding:8px 0}
.player-list{display:flex; flex-direction:column; gap:4px}
.player-row{display:flex; align-items:center; gap:10px; font-size:13.5px; padding:5px 8px; border-radius:8px}
.player-row .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.player-row .pts{font-weight:600; font-variant-numeric:tabular-nums}
.invite-btn{padding:4px 12px; font-size:12.5px}

/* 游戏顶栏 */
.game-top{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:10px 14px; margin-bottom:12px;
}
.game-top h2{margin:0; font-size:18px}
.game-top h2{background:linear-gradient(120deg,var(--primary),#8b5cf6); -webkit-background-clip:text; background-clip:text; color:transparent}
.game-top .top-actions{display:flex; gap:8px}

/* 规则/结算弹层 */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(18,24,42,.46); display:flex;
  align-items:center; justify-content:center; z-index:80;
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
}
.modal-card{
  background:var(--card); border-radius:16px; padding:22px 26px; max-width:88vw;
  width:430px; box-shadow:0 16px 50px rgba(0,0,0,.25); max-height:82vh; overflow:auto;
}
.modal-card h3{margin:0 0 12px; font-size:17px}
.modal-card .lines{margin:0 0 16px; padding-left:20px; font-size:13.5px; line-height:1.8; color:var(--text)}
.modal-card .lines li{margin-bottom:3px}

/* 玩家栏 */
.player-bar{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:10px}
.pchip{
  display:flex; align-items:center; gap:7px; padding:7px 12px; border-radius:99px;
  background:var(--card); border:2px solid var(--border); font-size:13.5px; font-weight:500;
}
.pchip .dot{width:12px; height:12px; border-radius:50%; flex:none}
.pchip .extra{font-size:11.5px; color:var(--muted); font-weight:400}
.pchip.active{border-color:var(--primary); background:rgba(79,110,247,.07)}
.pchip.bankrupt{opacity:.5; text-decoration:line-through}

/* 状态栏 */
.status-bar{
  text-align:center; color:var(--text); background:var(--card);
  border:1px solid var(--border); border-radius:10px; padding:9px 14px;
  font-size:14px; margin-bottom:12px; min-height:42px; display:flex;
  align-items:center; justify-content:center;
}
.status-bar.win{background:rgba(34,160,107,.1); border-color:rgba(34,160,107,.35); font-weight:600}

.board-area{display:flex; justify-content:center; position:relative}
.game-extra{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:14px}

/* ============ 五子棋画布 ============ */
canvas.board-canvas{width:100%; max-width:560px; display:block; border-radius:12px; background:var(--card); border:1px solid var(--border)}

/* ============ 飞行棋 ============ */
.ludo-board{position:relative; background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow)}
.tcell,.hcell{
  position:absolute; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:#f8fafc; border:1px solid var(--border);
}
.tcell.start{border-width:2px}
.hcell{background:transparent; border-style:dashed}
.ludo-center{
  position:absolute; border-radius:50%; background:#fff; border:2px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:22px;
}
.ludo-base{
  position:absolute; border-radius:12px; display:grid; grid-template-columns:1fr 1fr;
  place-items:center; border:2px solid; isolation:isolate; overflow:hidden;
}
.ludo-base[data-base-skin="classic"]{
  background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.95),transparent 34%),linear-gradient(145deg,var(--ludo-player-soft),#fff);
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.45),0 7px 16px rgba(15,23,42,.12);
}
.ludo-base[data-base-skin="cyber"]{
  background:linear-gradient(145deg,#071426,#172554 58%,var(--ludo-player));
  background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--ludo-player) 58%,#fff),transparent 30%),repeating-linear-gradient(90deg,rgba(125,211,252,.11) 0 1px,transparent 1px 8px),linear-gradient(145deg,#071426,#172554 58%,var(--ludo-player));
  border-color:#67e8f9!important;
  border-color:color-mix(in srgb,var(--ludo-player) 75%,#e0f2fe)!important;
  box-shadow:inset 0 0 16px rgba(125,211,252,.32),0 0 14px rgba(34,211,238,.3);
  box-shadow:inset 0 0 16px rgba(125,211,252,.32),0 0 14px color-mix(in srgb,var(--ludo-player) 42%,transparent);
}
.ludo-base-emblem{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);font-size:clamp(22px,5vw,38px);font-weight:900;color:var(--ludo-player);opacity:.18;pointer-events:none;z-index:0}
.ludo-base[data-base-skin="cyber"] .ludo-base-emblem{color:#e0f2fe;opacity:.42;text-shadow:0 0 9px var(--ludo-player)}
.ludo-base .slot{width:46%; aspect-ratio:1; border-radius:50%; background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.7); box-shadow:inset 0 2px 5px rgba(15,23,42,.12); position:relative; z-index:1}
.ludo-base[data-base-skin="cyber"] .slot{background:rgba(3,12,28,.45);border-color:rgba(186,230,253,.5);box-shadow:inset 0 0 8px rgba(125,211,252,.26)}
.ludo-base .slot .tok{position:absolute; inset:0}
.tok{
  border-radius:50%; border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.25);
  position:absolute; transform:translate(-50%,-50%);
}
.tok.movable{cursor:pointer; animation:pulse 1s ease-in-out infinite}
.tok.movable:hover{transform:translate(-50%,-50%) scale(1.18)}
.tok[data-piece-skin="jet"]::after{content:'✈';position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-52%);font-size:.82em;line-height:1;color:#fff;text-shadow:0 1px 2px rgba(15,23,42,.7);pointer-events:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(79,110,247,.55)}50%{box-shadow:0 0 0 7px rgba(79,110,247,0)}}

/* 骰子 */
.dice{
  width:56px; height:56px; background:#fff; border:2px solid var(--border); border-radius:12px;
  display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
  padding:7px; box-shadow:var(--shadow); flex:none;
}
.dice.sm{width:44px; height:44px; padding:5px}
.pip{display:flex; align-items:center; justify-content:center}
.pip::before{content:''; width:10px; height:10px; border-radius:50%; background:var(--text); opacity:0}
.pip.on::before{opacity:1}
.dice-btn{
  border:none; background:transparent; padding:0; border-radius:12px; line-height:0;
}
.dice-btn:disabled{cursor:not-allowed}
.dice-btn:hover .dice{border-color:var(--primary)}
.dice-btn[data-dice-skin="classic"] .dice3d .face{background:linear-gradient(145deg,#fffdf7,#efe7d4);border-color:#c8b99c;box-shadow:inset 0 0 10px rgba(120,87,45,.10),0 6px 14px rgba(69,49,28,.18)}
.dice-btn[data-dice-skin="classic"] .dice3d .pip::before{background:#3f3428}
.dice-btn[data-dice-skin="cyber"] .dice3d{filter:drop-shadow(0 0 9px rgba(34,211,238,.62))}
.dice-btn[data-dice-skin="cyber"] .dice3d .face{background:linear-gradient(145deg,rgba(8,25,50,.97),rgba(30,58,138,.94));border-color:#67e8f9;box-shadow:inset 0 0 14px rgba(34,211,238,.34),0 0 10px rgba(59,130,246,.28)}
.dice-btn[data-dice-skin="cyber"] .dice3d .pip::before{background:#a5f3fc;box-shadow:0 0 6px #22d3ee}

/* 3D 骰子 */
.dice3d-wrap{width:66px; height:66px; perspective:280px; display:inline-flex; align-items:center; justify-content:center}
.dice3d-wrap.sm{width:52px; height:52px; perspective:220px}
.dice3d{position:relative; transform-style:preserve-3d; transition:transform .55s cubic-bezier(.2,.75,.3,1)}
.dice3d .face{
  position:absolute; inset:0; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
  padding:8px; border-radius:12px; background:#fff; border:1px solid var(--border);
  box-shadow:inset 0 0 10px rgba(0,0,0,.06); backface-visibility:hidden;
}
.dice3d-wrap.sm .face{padding:5px; border-radius:9px}
.dice3d .pip{display:flex; align-items:center; justify-content:center}
.dice3d .pip::before{content:''; width:9px; height:9px; border-radius:50%; background:#28334d}
.dice3d-wrap.sm .pip::before{width:6px; height:6px}

/* 开局倒计时 */
.cd-overlay{background:rgba(12,17,32,.58); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); z-index:40}
.cd-overlay.fade{opacity:0; transition:opacity .25s ease}
.cd-num{font-size:66px; font-weight:800; color:#fff; text-shadow:0 6px 30px rgba(109,139,255,.85); animation:cdPop .68s ease}
@keyframes cdPop{0%{transform:scale(1.7); opacity:0}40%{transform:scale(.9); opacity:1}100%{transform:scale(1)}}

/* 棋子覆盖层 */
.overlay{
  position:absolute; inset:0; background:rgba(29,41,75,.35); border-radius:16px;
  display:flex; align-items:center; justify-content:center; z-index:20;
}
.overlay-card{
  background:var(--card); border-radius:16px; padding:22px 28px; text-align:center;
  box-shadow:0 16px 50px rgba(0,0,0,.25); max-width:80%;
}
.overlay-card .big{font-size:30px; margin-bottom:6px}
.overlay-card h3{margin:0 0 4px; font-size:19px}
.overlay-card p{margin:0 0 14px; color:var(--muted); font-size:13px}

/* ============ 迷你大富翁 ============ */
.m-board{position:relative; background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow)}
.m-cell{
  position:absolute; border-radius:10px; background:#fff; border:1px solid var(--border);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  box-shadow:0 1px 3px rgba(29,41,75,.08); font-size:11px; font-weight:500; text-align:center;
}
.m-cell .stripe{position:absolute; top:0; left:0; right:0; height:6px; border-radius:9px 9px 0 0}
.m-cell .emo{font-size:15px; line-height:1}
.m-cell .owner-dot{
  position:absolute; bottom:-3px; right:-3px; width:11px; height:11px; border-radius:50%;
  border:2px solid #fff; box-shadow:0 1px 2px rgba(0,0,0,.2);
}
.m-marker{
  position:absolute; width:10px; height:10px; border-radius:50%; border:1.5px solid #fff;
  transform:translate(-50%,-50%); box-shadow:0 1px 2px rgba(0,0,0,.25); z-index:3;
}
.m-center{
  position:absolute; border-radius:50%; background:#fff; border:2px solid var(--border);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  font-size:13px; font-weight:600; color:var(--muted);
}
.m-center .dice-row{display:flex; gap:6px}
.money-row{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:10px}
.money-chip{
  display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--border);
  border-radius:99px; padding:6px 12px; font-size:13px;
}
.money-chip.active{border-color:var(--primary); background:rgba(79,110,247,.07)}
.money-chip .dot{width:10px; height:10px; border-radius:50%}
.money-chip .amt{font-weight:600; font-variant-numeric:tabular-nums}

/* 机会卡弹层 */
.chance-modal{
  position:absolute; inset:0; background:rgba(29,41,75,.35); border-radius:16px;
  display:flex; align-items:center; justify-content:center; z-index:25;
}
.chance-card{
  background:var(--card); border-radius:16px; padding:24px 30px; text-align:center;
  box-shadow:0 16px 50px rgba(0,0,0,.25); max-width:78%;
}
.chance-card .emo{font-size:34px}
.chance-card h3{margin:10px 0 4px; font-size:19px}
.chance-card p{margin:0 0 14px; color:var(--muted); font-size:13px}

/* Toast */
#toast-wrap{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:99; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none}
.toast{
  background:#1d2433; color:#fff; font-size:13.5px; border-radius:10px; padding:9px 18px;
  box-shadow:0 8px 24px rgba(0,0,0,.25); animation:toastIn .18s ease; max-width:86vw; text-align:center;
}
@keyframes toastIn{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}

/* ============ 账号 / 个人化 ============ */
.auth-hero{
  border-radius:14px; padding:26px 22px; text-align:center; margin-bottom:14px;
  background:linear-gradient(135deg, rgba(79,110,247,.16), rgba(139,92,246,.18));
  border:1px solid var(--border);
}
.auth-hero .big{font-size:40px; line-height:1; margin-bottom:8px}
.auth-hero h2{margin:0 0 4px; font-size:19px}
.auth-hero p{margin:0; font-size:12.5px; color:var(--muted)}
.auth-avatar-wrap{display:flex; justify-content:center; margin:12px 0}
.avatar-stage{position:relative; width:84px; height:84px}
.avatar-stage canvas{position:relative; z-index:2; display:block; border-radius:50%}
.avatar-stage .frame-ring{
  position:absolute; inset:-7px; border-radius:50%; z-index:1; pointer-events:none;
  border:3px solid transparent; background-clip:padding-box;
}
.avatar-stage .frame-ring.frame-1{border-color:linear-gradient(135deg,#f6d365,#fda085)}
.avatar-stage .frame-ring.frame-1{border-color:#e8b63a; box-shadow:0 0 14px rgba(232,182,58,.75)}
.avatar-stage .frame-ring.frame-2{border-color:#22d3ee; box-shadow:0 0 14px rgba(34,211,238,.85)}
.avatar-stage .frame-ring.frame-3{border-color:#a78bfa; box-shadow:0 0 14px rgba(167,139,250,.9)}
.avatar-stage .frame-ring.frame-4{box-shadow:0 0 0 3px #fff, 0 0 18px rgba(244,63,94,.9)}
.avatar-stage.effect-1 canvas{animation:fxPulse 2s ease-in-out infinite}
.avatar-stage.effect-2 canvas{animation:fxTwinkle 1.8s ease-in-out infinite}
.avatar-stage.effect-3{animation:fxFloat 3s ease-in-out infinite}
.avatar-stage.effect-4{animation:fxSpin 6s linear infinite}
.avatar-stage.effect-4 .frame-ring{animation:none}
@keyframes fxPulse{0%,100%{box-shadow:0 0 0 0 rgba(79,110,247,.55)}50%{box-shadow:0 0 0 12px rgba(79,110,247,0)}}
@keyframes fxTwinkle{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35) saturate(1.3)}}
@keyframes fxFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fxSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.mini-avatar-stage{position:relative; display:inline-flex; align-items:center; justify-content:center; flex:none}
.mini-avatar-stage canvas{position:relative; z-index:2; border-radius:50%; display:block}
.mini-avatar-stage .frame-ring{
  position:absolute; inset:-4px; border-radius:50%; z-index:1; pointer-events:none; border:2px solid transparent;
}
.mini-avatar-stage .frame-ring.frame-1{border-color:#e8b63a; box-shadow:0 0 8px rgba(232,182,58,.7)}
.mini-avatar-stage .frame-ring.frame-2{border-color:#22d3ee; box-shadow:0 0 8px rgba(34,211,238,.8)}
.mini-avatar-stage .frame-ring.frame-3{border-color:#a78bfa; box-shadow:0 0 8px rgba(167,139,250,.85)}
.mini-avatar-stage .frame-ring.frame-4{box-shadow:0 0 0 2px #fff, 0 0 10px rgba(244,63,94,.85)}
.mini-avatar-stage.effect-1 canvas{animation:fxPulseMini 2s ease-in-out infinite}
.mini-avatar-stage.effect-2 canvas{animation:fxTwinkle 1.8s ease-in-out infinite}
.mini-avatar-stage.effect-3{animation:fxFloat 3s ease-in-out infinite}
@keyframes fxPulseMini{0%,100%{box-shadow:0 0 0 0 rgba(79,110,247,.5)}50%{box-shadow:0 0 0 7px rgba(79,110,247,0)}}

/* ====== 触屏 & 移动端适配 ====== */
/* 消除 300ms 延迟，防止双击缩放 */
button, canvas, .game-card, .ttt-cell, .j-cell, .xq-cell,
.slot-chip, .lobby-row, .roster-item, .lb-row, .player-row,
.shop-item, .avatar-opt, .bg-swatch, .shop-tab, .pchip,
.tcell, .hcell, .m-cell, .tok, .dice-btn, .count-btn, .btn {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

/* 手机横屏 / 小屏 (< 480px) */
@media (max-width: 480px) {
  #app { padding: 8px 6px 24px; }
  .app-header { margin-bottom: 10px; }
  .brand { font-size: 15px; gap: 5px; }
  .brand .brand-icon { font-size: 20px; }
  .brand .brand-tag { font-size: 10px; display: none; }
  .hub-grid { grid-template-columns: 1fr; gap: 10px; }
  .hub-side { gap: 10px; }
  .hub-count { gap: 6px; margin-bottom: 10px; }
  .hub-label { font-size: 12px; }
  .count-btn { padding: 6px 12px; font-size: 12px; }
  .game-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .game-card { padding: 12px 10px; }
  .game-card .icon { font-size: 26px; }
  .game-card .name { font-size: 14px; }
  .game-card .desc { font-size: 11px; min-height: 28px; }
  .slots-row { gap: 5px; }
  .slot-chip { padding: 5px 8px; min-width: 60px; font-size: 10px; }
  .slot-chip .av { font-size: 18px; }
  .btn { padding: 7px 10px; font-size: 12px; border-radius: 8px; }
  .online-panel { padding: 10px 12px; }
  .online-panel h3 { font-size: 13px; }
  .lb-panel, .lobby-panel { padding: 10px 12px; }
  .lb-panel h3, .lobby-panel h3 { font-size: 13px; }
  .modal-card { padding: 16px 18px; max-width: 95vw; width: auto; }
  .modal-card h3 { font-size: 15px; }
  .game-top { padding: 8px 10px; }
  .game-top h2 { font-size: 15px; }
  canvas.board-canvas { max-width: 100%; }
  .hero-banner { padding: var(--sp-lg) var(--sp-md); }
  .hero-banner h1 { font-size: 22px; }
  .hero-banner .hero-icon { font-size: 34px; }
}

/* 平板 / 中等屏 (481px - 768px) */
@media (min-width: 481px) and (max-width: 768px) {
  .hub-grid { grid-template-columns: 1fr; gap: 12px; }
  .hub-side { gap: 12px; }
  .game-grid { grid-template-columns: repeat(3, 1fr); }
  .brand .brand-tag { font-size: 10px; }
}

/* 中等屏 (769px - 1024px) */
@media (min-width: 769px) and (max-width: 1024px) {
  .hub-grid { grid-template-columns: minmax(0, 1fr) 280px; gap: 12px; }
}

/* 通用移动端按钮放大（确保至少 44px 触控目标） */
@media (max-width: 768px) {
  .btn, .count-btn, .shop-tab {
    min-height: 40px;
    min-width: 40px;
  }
  .invite-btn { padding: 6px 14px; }
  .online-row { gap: 6px; }
}

/* ====== 胜利结算动画 ====== */
.victory-overlay {
  background: rgba(12,17,32,.62); backdrop-filter: blur(8px); 
  -webkit-backdrop-filter: blur(8px); z-index: 50;
  animation: vicFadeIn .35s ease;
}
.victory-card {
  text-align: center; padding: 28px 30px; max-width: 380px;
}
.victory-emoji {
  font-size: 56px; line-height: 1; margin-bottom: 8px;
  animation: vicBounce .7s cubic-bezier(.22,.86,.4,1.2);
}
.victory-title {
  font-size: 20px; margin: 6px 0 4px; font-weight: 700;
  background: linear-gradient(120deg, #f59e0b, #ef4444);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.victory-subtitle {
  font-size: 13px; color: var(--muted); margin: 4px 0 10px;
}
.victory-coins {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 22px; font-weight: 700; color: #f59e0b;
  background: rgba(245,158,11,.1); border-radius: 99px;
  padding: 6px 18px; margin-bottom: 14px;
  animation: vicCoinPop .5s .3s ease both;
}
.coin-lg {
  width: 28px; height: 28px; font-size: 16px;
}
.victory-btns {
  display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
}
.victory-btn { padding: 10px 20px; font-size: 14px; }
.reward-breakdown-overlay {
  z-index: 80; background: rgba(8,12,24,.72); backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px); animation: vicFadeIn .25s ease;
}
.reward-breakdown-card {
  width: min(420px, calc(100vw - 28px)); max-height: min(620px, calc(100vh - 32px));
  overflow: auto; padding: 24px; border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border));
}
.reward-breakdown-title { margin: 0 0 16px; text-align: center; font-size: 22px; }
.reward-breakdown-list { display: grid; gap: 8px; }
.reward-breakdown-row, .reward-breakdown-total {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  min-height: 38px; padding: 8px 10px; border-radius: 10px; background: color-mix(in srgb, var(--card) 82%, transparent);
}
.reward-breakdown-label { color: var(--muted); }
.reward-breakdown-values { font-weight: 750; color: var(--accent); text-align: right; }
.reward-breakdown-total { margin-top: 12px; border-top: 1px solid var(--border); font-size: 16px; }
.reward-level-up { text-align: center; color: var(--accent); font-weight: 750; }
.reward-breakdown-close { width: 100%; margin-top: 14px; min-height: 44px; }
@keyframes vicFadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes vicBounce {
  0% { transform: scale(.2); opacity: 0; }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes vicCoinPop {
  from { transform: scale(.5); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.my-card {

.my-card-name { font-size: 16px; font-weight: 700; }
.my-card-title { font-size: 13px; color: var(--primary); font-weight: 500; margin-top: 2px; }

}

/* ================= i18n 国际化框架 ================= */
const LOCALES = {};
let currentLocale = {};
let currentLang = 'zh-CN';

async function loadLocale(lang) {
  if (LOCALES[lang]) { currentLocale = LOCALES[lang]; currentLang = lang; return; }
  try {
    const resp = await fetch('locales/' + lang + '.json');
    if (!resp.ok) throw new Error('locale not found');
    const data = await resp.json();
    LOCALES[lang] = data;
    currentLocale = data;
    currentLang = lang;
  } catch (e) {
    if (lang !== 'zh-CN') { loadLocale('zh-CN'); return; }
    currentLocale = {};
    currentLang = 'zh-CN';
  }
}

function t(key, ...args) {
  let text = currentLocale[key];
  if (text === undefined || text === null) {
    if (currentLang !== 'en-US' && LOCALES['en-US'] && LOCALES['en-US'][key] !== undefined) {
      text = LOCALES['en-US'][key];
    } else {
      return key;
    }
  }
  if (args.length > 0) {
    let i = 0;
    text = text.replace(/%[sd]/g, () => {
      const arg = args[i++];
      return arg !== undefined ? String(arg) : '';
    });
  }
  return text;
}

function applyI18n(root) {
  root = root || document;
  root.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (key) el.textContent = t(key);
  });
  root.querySelectorAll('[data-i18n-title]').forEach(el => {
    const key = el.getAttribute('data-i18n-title');
    if (key) el.title = t(key);
  });
  root.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (key) el.placeholder = t(key);
  });
  const titleEl = typeof document !== 'undefined' && document.querySelector ? document.querySelector('title[data-i18n]') : null;
  if (titleEl) titleEl.textContent = t(titleEl.getAttribute('data-i18n'));
}

const LANG_FLAGS = { 'zh-CN': '🇨🇳', 'en-US': '🇺🇸', 'uk-UA': '🇺🇦' };

/* ---------------- 轻量音效（WebAudio，零资源加载） ---------------- */
let _actx = null;
function sfx(kind){
  try {
    const AC = (typeof AudioContext !== 'undefined' && AudioContext) || (typeof webkitAudioContext !== 'undefined' && webkitAudioContext);
    if (!AC) return;
    if (!_actx) _actx = new AC();
    if (_actx.state === 'suspended') _actx.resume();
    const cfg = {
      click: { f: 520, dur: .05, vol: .06, type: 'sine' },
      move:  { f: 680, dur: .06, vol: .05, type: 'triangle' },
      pop:   { f: 440, dur: .04, vol: .04, type: 'sine' },
      place: { f: 540, dur: .09, vol: .07, type: 'triangle' },
      capture:{ f: 220, dur: .12, vol: .08, type: 'sawtooth' },
      score: { f: 760, dur: .10, vol: .07, type: 'triangle' },
      win:   { f: 880, dur: .20, vol: .09, type: 'triangle' },
      lose:  { f: 320, dur: .16, vol: .06, type: 'sine' },
    }[kind] || { f: 440, dur: .05, vol: .05, type: 'sine' };
    const t = _actx.currentTime;
    const osc = _actx.createOscillator();
    const gain = _actx.createGain();
    osc.type = cfg.type;
    osc.frequency.setValueAtTime(cfg.f, t);
    if (kind === 'win') osc.frequency.exponentialRampToValueAtTime(cfg.f * 1.5, t + .12);
    gain.gain.setValueAtTime(cfg.vol, t);
    gain.gain.exponentialRampToValueAtTime(.0001, t + cfg.dur);
    osc.connect(gain).connect(_actx.destination);
    osc.start(t);
    osc.stop(t + cfg.dur + .03);
  } catch {}
}
/* 震动反馈（移动端；桌面端静默忽略） */
function haptic(kind){
  try {
    if (typeof navigator === 'undefined' || !navigator.vibrate) return;
    const map = { light: 8, medium: [12, 30, 12], strong: [20, 40, 20, 40, 20], win: [30, 60, 30, 60, 40], lose: [60, 40, 60] };
    navigator.vibrate(map[kind] || map.light);
  } catch {}
}
/* 分级反馈：关键操作重反馈，普通操作轻反馈 */
function playFeedback(kind){

    lose:    { sfx: 'lose',   haptic: 'lose' },
  }[kind] || { sfx: 'click', haptic: 'light' };
  sfx(fx.sfx); haptic(fx.haptic);
}

function el(tag, cls, text){

function showModal(title, lines, btnText){

function pipsHTML(v){
  const map = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
  let h = '';
  for (let i=0;i<9;i++) h += '<span class="pip' + (map[v].includes(i) ? ' on' : '') + '"></span>';

}
function prefersReducedMotion(){
  try {
    return typeof window !== 'undefined' && typeof window.matchMedia === 'function' &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch {
    return false;
  }
}
function animateDice(faces, final, cb){
  if (prefersReducedMotion()){
    faces.forEach(f => { f.innerHTML = pipsHTML(final); f.classList.remove('rolling'); });
    if (cb) cb();
    return;
  }
  faces.forEach(f => f.classList.add('rolling'));
  let tick = 0;
  const iv = setInterval(() => {
    faces.forEach(f => f.innerHTML = pipsHTML(1 + Math.floor(Math.random()*6)));
    if (++tick >= 8){
      clearInterval(iv);
      faces.forEach(f => { f.innerHTML = pipsHTML(final); f.classList.remove('rolling'); });
      if (cb) cb();
    }
  }, 55);
}

function makeDice3D(size, sm){
  const wrap = el('div', 'dice3d-wrap' + (sm ? ' sm' : ''));
  const die = el('div', 'dice3d');
  wrap.style.width = wrap.style.height = (size + 10) + 'px';
  die.style.width = die.style.height = size + 'px';
  const half = size / 2;
  const faces = [
    [1, 'translateZ(' + half + 'px)'],
    [6, 'rotateY(180deg) translateZ(' + half + 'px)'],
    [3, 'rotateY(90deg) translateZ(' + half + 'px)'],
    [4, 'rotateY(-90deg) translateZ(' + half + 'px)'],
    [2, 'rotateX(90deg) translateZ(' + half + 'px)'],
    [5, 'rotateX(-90deg) translateZ(' + half + 'px)'],
  ];
  for (const [v, tf] of faces){
    const f = el('div', 'face');
    f.style.transform = tf;
    f.innerHTML = pipsHTML(v);
    die.appendChild(f);
  }
  const ROT = {
    1: 'rotateX(0deg) rotateY(0deg)',
    2: 'rotateX(-90deg) rotateY(0deg)',
    3: 'rotateX(0deg) rotateY(-90deg)',
    4: 'rotateX(0deg) rotateY(90deg)',
    5: 'rotateX(90deg) rotateY(0deg)',
    6: 'rotateX(0deg) rotateY(180deg)',
  };
  let rolling = false;
  let rollInterval = null;
  let settleTimer = null;
  let generation = 0;
  function roll(final, cb){
    if (rolling) return false;
    const gen = ++generation;
    rolling = true;
    if (prefersReducedMotion()){
      die.style.transition = 'none';
      die.style.transform = ROT[final] || ROT[1];
      rolling = false;
      if (cb) cb();
      return true;
    }
    die.style.transition = 'transform .09s linear';
    let i = 0;
    rollInterval = setInterval(() => {
      if (gen !== generation) return;
      i++;
      die.style.transform = 'rotateX(' + Math.floor(Math.random() * 720) + 'deg) rotateY(' + Math.floor(Math.random() * 720) + 'deg)';
      if (i >= 12){
        clearInterval(rollInterval);
        rollInterval = null;
        die.style.transition = 'transform .55s cubic-bezier(.2,.75,.3,1)';
        die.style.transform = ROT[final] || ROT[1];
        settleTimer = setTimeout(() => {
          settleTimer = null;
          if (gen !== generation) return;
          rolling = false;
          if (cb) cb();
        }, 560);
      }
    }, 65);
    return true;
  }
  function reset(){
    generation++;
    if (rollInterval) clearInterval(rollInterval);
    if (settleTimer) clearTimeout(settleTimer);
    rollInterval = null;
    settleTimer = null;
    rolling = false;
    die.style.transition = 'none';
    die.style.transform = ROT[1];
  }
  wrap.appendChild(die);
  return { wrap, die, roll, reset };
}

/* ---------------- AI 助手（DeepSeek 代理） ---------------- */
async function aiChoose(game, state, options, persona){
  const token = (typeof account !== 'undefined' && account && typeof account.authToken === 'string')
    ? account.authToken.trim() : '';
  if (!token || !Array.isArray(options) || !options.length ||
      options.some(option => typeof option !== 'string') ||
      typeof fetch !== 'function' || typeof AbortController === 'undefined') return null;
  const legalOptions = options.slice(0, 200);
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 2200);
  try {
    const server = resolveServer();
    const url = server ? server.replace(/\/+$/, '') + '/api/ai' : '/api/ai';
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + token,
      },
      body: JSON.stringify({ game, state, options: legalOptions, persona: persona || null }),
      signal: controller.signal,
    });
    if (!res.ok) return null;
    const data = await res.json();
    return data && legalOptions.includes(data.choice) ? data.choice : null;
  } catch {
    return null;
  } finally {
    clearTimeout(timer);
  }
}

// 为 canvas 元素提供统一的触摸/鼠标坐标提取
function getEventPos(e, element) {
  const rect = element.getBoundingClientRect();
  let clientX, clientY;
  if (e.touches && e.touches.length > 0) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else if (e.changedTouches && e.changedTouches.length > 0) {
    clientX = e.changedTouches[0].clientX;
    clientY = e.changedTouches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  return {
    x: (clientX - rect.left) / rect.width,
    y: (clientY - rect.top) / rect.height,
    px: clientX - rect.left,
    py: clientY - rect.top,
  };
}

function prefersReducedMotion(){
  return typeof window !== 'undefined' && typeof window.matchMedia === 'function' &&

}

function premiumStaticAsset(item, context){
  if (context === 'mini') return item.miniCrop;

function releasePremiumBackground(element){
  if (!element || typeof element._premiumBackgroundCleanup !== 'function') return;
  element._premiumBackgroundCleanup();
  element._premiumBackgroundCleanup = null;
}

function applyPremiumBackground(element, id, context){
  releasePremiumBackground(element);
  const item = premiumBackgroundMeta(id);
  if (!item) return false;
  const useContext = context || 'profile';
  const fallback = premiumStaticAsset(item, useContext);
  element.classList.add('premium-background', 'premium-bg-' + item.textTone);
  element.dataset.backgroundId = String(item.id);
  element.dataset.backgroundAnimated = item.animated ? 'true' : 'false';
  setPremiumBackgroundImage(element, item, item.animated ? item.poster : fallback);
  let visible = true;
  let active = false;
  let observer = null;
  const mayAnimate = item.animated && !prefersReducedMotion() && useContext !== 'shop-grid';
  const sync = () => {
    const pageVisible = typeof document === 'undefined' || !document.hidden;
    const next = !!(mayAnimate && visible && pageVisible);
    if (next === active) return;
    active = next;
    setPremiumBackgroundImage(element, item, active ? item.asset : fallback);
    element.dataset.animationActive = active ? 'true' : 'false';
  };
  const onVisibility = () => sync();
  if (mayAnimate && typeof IntersectionObserver !== 'undefined'){
    visible = false;
    observer = new IntersectionObserver(entries => {
      const entry = entries[0];
      visible = !!(entry && entry.isIntersecting);
      sync();
    }, { threshold:.05 });
    observer.observe(element);
  }
  if (mayAnimate && typeof document !== 'undefined' && document.addEventListener){
    document.addEventListener('visibilitychange', onVisibility);
  }
  sync();
  element._premiumBackgroundCleanup = () => {
    if (observer) observer.disconnect();
    if (mayAnimate && typeof document !== 'undefined' && document.removeEventListener){
      document.removeEventListener('visibilitychange', onVisibility);
    }
    active = false;
    setPremiumBackgroundImage(element, item, fallback);
    element.dataset.animationActive = 'false';
  };
  return true;
}

function backgroundPosterNode(item, options){

  const wrap = el('div', 'background-poster' + (item.animated ? ' is-animated' : ''));
  const img = document.createElement('img');
  img.src = assetUrl(item.poster);

﻿/* ================= 游戏插件化框架 ================= */
// 统一 Game 生命周期：
//   init() / render() / move(payload) / serialize() / deserialize(state)
//   restart() / destroy()
// 大厅只认 Game Instance；游戏只需实现标准接口即可被平台使用。
// 兼容旧接口：raw 返回 { reset, resetLocal, onMove, onRestart, snapshot }。

const GAME_REGISTRY = {}; // id -> factory

function registerGame(id, factory) {
  GAME_REGISTRY[id] = factory;
}

function createGameInstance(id, area, extra, playerCount, opts) {
  const factory = GAME_REGISTRY[id] || (typeof games !== 'undefined' && games[id]);
  if (!factory) throw new Error('game not found: ' + id);
  opts = opts || {};
  opts.destroyed = false;
  const raw = factory(area, extra, playerCount, opts);

  const instance = {
    id: id,
    _raw: raw,

    // ---- 统一生命周期 ----
    init() {
      if (raw.init) raw.init();
      else if (raw.resetLocal) raw.resetLocal();
      else if (raw.reset) raw.reset();
    },
    render() {
      if (raw.render) raw.render();
    },
    move(payload, player) {
      if (raw.move) return raw.move(payload, player);
      if (raw.onMove) return raw.onMove(payload, player);
    },
    serialize() {
      // serialize() 可包含表现层、统计等扩展数据；snapshot() 仅是旧协议回退。
      if (raw.serialize) return raw.serialize();
      if (raw.snapshot) return raw.snapshot();
      return null;
    },
    deserialize(state) {
      if (raw.deserialize) return raw.deserialize(state);
      if (raw.onRestore) return raw.onRestore(state);
      return false;
    },
    restart() {
      if (raw.reset) raw.reset();
      else if (raw.resetLocal) raw.resetLocal();
      else if (raw.restart) raw.restart();
    },
    destroy() {
      opts.destroyed = true;
      if (raw.destroy) raw.destroy();
      // 清理 DOM（可选，由调用方决定是否清空 area/extra）
    },

    // ---- 兼容别名（旧代码仍可用） ----
    reset: raw.reset || raw.resetLocal || (() => {}),
    onMove: raw.onMove || (() => {}),
    onRestart: raw.onRestart || raw.resetLocal || raw.reset || (() => {}),
    snapshot: raw.snapshot || raw.serialize || (() => null),
  };

  // 游戏可按需声明观战、皮肤、棋钟、统计、实时帧等能力。框架不解释这些
  // 接口，只保持 this 指向原始游戏对象并向平台透传，避免每新增能力都改框架。
  Object.keys(raw).forEach(key => {
    if (typeof raw[key] !== 'function' || key in instance) return;
    instance[key] = (...args) => raw[key].apply(raw, args);
  });
  return instance;
}

// 从旧 games 注册表自动注册（在 games 定义后调用）
function autoRegisterGames() {
  if (typeof games === 'undefined') return;
  for (const id in games) {
    if (!GAME_REGISTRY[id]) registerGame(id, games[id]);
  }
}

// 获取已注册游戏列表（保持顺序稳定）
function listRegisteredGames() {
  return Object.keys(GAME_REGISTRY);
}

const ACHIEVEMENTS = [
  { id: 'first_win', name: '首胜', icon: '🥇', desc: '赢下第一局', check: p => (p.totalWins || 0) >= 1 },
  { id: 'win_10', name: '十胜', icon: '💎', desc: '累计赢 10 局', check: p => (p.totalWins || 0) >= 10 },
  { id: 'win_50', name: '五十胜', icon: '🏆', desc: '累计赢 50 局', check: p => (p.totalWins || 0) >= 50 },

  { id: 'streak_5', name: '五连胜', icon: '⚡', desc: '连胜 5 局', check: p => (p.bestStreak || 0) >= 5 },

  { id: 'all_games', name: '全能玩家', icon: '🎯', desc: '玩过 5 种游戏', check: p => Object.keys(p.played || {}).filter(k => p.played[k] > 0).length >= 5 },
  { id: 'social', name: '社交达人', icon: '🤝', desc: '和 3 位不同玩家对局', check: p => Object.keys(p.playmates || {}).length >= 3 },
];
function checkAchievements(profile){
  const earned = [];
  const p = profile || {};
  for (const a of ACHIEVEMENTS){
    if (!(p.achievements || []).includes(a.id) && a.check(p)) earned.push(a.id);
  }
  return earned;
}
function achievementsEarned(p){
  return (p.achievements || []).slice();
}

const DAILY_TASKS = [
  { id: 'play_1', name: '玩 1 局', icon: '🎮', target: 1, reward: 5, kind: 'play' },
  { id: 'play_3', name: '玩 3 局', icon: '🕹️', target: 3, reward: 10, kind: 'play' },
  { id: 'win_1', name: '赢 1 局', icon: '🏅', target: 1, reward: 8, kind: 'win' },
  { id: 'streak_2', name: '连胜 2 局', icon: '🔥', target: 2, reward: 12, kind: 'streak' },
];
function dailyTasksState(profile){
  const now = new Date();
  const dayKey = now.toISOString().slice(0, 10);
  const p = profile || {};
  if (p.dailyKey !== dayKey){
    p.dailyKey = dayKey;
    p.daily = { play: 0, win: 0, streak: 0 };
  }
  return p.daily || { play: 0, win: 0, streak: 0 };
}
function updateDaily(profile, kind, amount){
  const p = profile || {};
  const state = dailyTasksState(p);
  state[kind] = (state[kind] || 0) + (amount || 1);
  p.daily = state;
  return state;
}
function dailyProgress(profile){
  const state = dailyTasksState(profile);
  return DAILY_TASKS.map(t => {
    const cur = Math.min(state[t.kind] || 0, t.target);
    return { ...t, cur, done: cur >= t.target };
  });
}

/* ---- 最近一起玩（本地记录 + 服务端同步 playmates） ---- */
function recordPlaymate(profile, otherUid, otherName, gameId){
  if (!profile || !otherUid || otherUid === profile.uid) return;
  if (!profile.playmates) profile.playmates = {};
  const now = Date.now();
  const pm = profile.playmates[otherUid] || { name: otherName || '玩家', count: 0, lastAt: 0, games: {} };
  pm.name = otherName || pm.name;
  pm.count++;
  pm.lastAt = now;
  if (gameId) pm.games[gameId] = (pm.games[gameId] || 0) + 1;
  profile.playmates[otherUid] = pm;
}
function recentPlaymates(profile, limit){
  const p = profile || {};
  return Object.keys(p.playmates || {})
    .map(uid => ({ uid, ...p.playmates[uid] }))
    .sort((a, b) => (b.lastAt || 0) - (a.lastAt || 0))
    .slice(0, limit || 5);
}

let currentPersona = AI_PERSONAS[0];

function personaById(id) {
  return AI_PERSONAS.find(p => p.id === id) || AI_PERSONAS[0];
}

function setAiPersona(id) {
  currentPersona = personaById(id);
  try { localStorage.setItem('mg_persona', currentPersona.id); } catch {}
  return currentPersona;
}

function initAiPersona() {
  try {
    const saved = localStorage.getItem('mg_persona');
    if (saved) currentPersona = personaById(saved);
  } catch {}
}

/* 角色化选点：按角色随机性决定是否放弃最优走法 */
function aiPersonaMove(listLength, bestIdx, persona) {
  persona = persona || currentPersona;
  if (!persona || listLength <= 1) return bestIdx;
  if (Math.random() < (persona.randomness || 0)) {
    return Math.floor(Math.random() * listLength);
  }
  return bestIdx;
}

/* 角色发言：think / win / lose */
function aiSpeak(persona, kind) {
  persona = persona || currentPersona;
  if (!persona) return;
  const quotes = persona.quotes && persona.quotes[kind];
  if (!quotes || !quotes.length) return;
  const q = quotes[Math.floor(Math.random() * quotes.length)];
  toast(persona.icon + ' ' + persona.name + '：' + q);
  sfx('pop');
}

/* AI 对手信息（用于「最近一起玩」记录） */
function aiMateInfo(persona) {
  persona = persona || currentPersona;
  return {
    uid: 'ai_' + (persona ? persona.id : 'default'),
    name: (persona ? persona.icon + ' ' + persona.name : '🤖 AI'),
  };
}

/* 渲染 AI 角色选择行 */
function renderPersonaRow() {
  const row = $('persona-row');
  if (!row) return;
  if (!aiMode) {
    row.classList.add('hidden');
    return;
  }
  row.classList.remove('hidden');
  row.innerHTML = '';
  row.appendChild(el('span', 'hub-label', '🤖 选择 AI 对手'));
  const cards = el('div', 'persona-cards');
  AI_PERSONAS.forEach(p => {
    const card = el('button', 'persona-card' + (currentPersona.id === p.id ? ' selected' : ''));
    card.type = 'button';
    card.title = p.desc;
    card.appendChild(el('span', 'persona-icon', p.icon));
    card.appendChild(el('span', 'persona-name', p.name));
    card.appendChild(el('span', 'persona-desc', p.desc));
    card.addEventListener('click', () => {
      setAiPersona(p.id);
      renderPersonaRow();
      toast('已选择 AI 对手：' + p.icon + ' ' + p.name);
    });
    cards.appendChild(card);
  });
  row.appendChild(cards);
}

const online = {

  socialTab: 'friends',

  connect(){
    if (this.connected || (this.ws && (this.ws.readyState === 0 || this.ws.readyState === 1))) return;

    try {
      const raw = resolveServer();

        const u = raw.replace(/\/+$/, '');
        wsUrl = (u.startsWith('https') ? 'wss://' : 'ws://') + u.replace(/^https?:\/\//, '') + '/ws';
      } else {
        wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
      }

    }
    const ws = new WebSocket(wsUrl);
    this.ws = ws;
    ws.onopen = () => {
      if (this.ws !== ws) return;
      this.connected = true;
      this._authenticated = false;
      this.status('已连接服务器，可创建或加入房间');
      const authAccount = typeof account !== 'undefined' ? account : null;
      const authPin = typeof pendingAuthPin !== 'undefined' ? pendingAuthPin : null;
      this.send({ type: 'hello', payload: {
        uid: authAccount && authAccount.uid ? authAccount.uid : (typeof deviceUid !== 'undefined' ? deviceUid : null),
        token: authAccount && authAccount.authToken ? authAccount.authToken : null,
        proto: typeof PROTOCOL_VERSION !== 'undefined' ? PROTOCOL_VERSION : 2,
      } });
      this.send({ type: 'lobby' });
      const needsRegister = authAccount && authAccount.uid && authPin && authAccount.registered === false;
      const needsLogin = authAccount && authAccount.uid && authPin && !authAccount.authToken && authAccount.registered !== false;
      if (needsRegister){
        this.send({ type: 'register', payload: {
          uid: authAccount.uid, pin: authPin, name: authAccount.name, avatar: authAccount.avatar,
          background: authAccount.background, frame: authAccount.frame, effect: authAccount.effect, owned: authAccount.owned, nameFx: authAccount.nameFx || 0,
        } });
      } else if (needsLogin){
        this.send({ type: 'login', payload: { pin: authPin } });
      } else if (typeof syncProfiles === 'function') {
        syncProfiles();
      }
      if (this._hb) clearInterval(this._hb);
      this._hb = setInterval(() => { if (this.connected) this.send({ type: 'ping' }); }, 10000);
      if (this.resume){
        const expectedRoom = this.resume.room;
        setTimeout(() => {
          if (this.connected && this.resume && this.resume.room === expectedRoom && !this.room){
            this.clearResume();
            this.status(t('room_resume_missing'));
          }
        }, 1500);
      }
      if (this.pending){
        const p = this.pending;
        this.pending = null;
        if (p.type === 'create') this.create(p.settings);
        else if (p.type === 'join') this.join(p.room);
        else if (p.type === 'quick_join') this.quickJoin(p.game);
      }
    };
    ws.onmessage = e => { if (this.ws === ws) this.onMessage(JSON.parse(e.data)); };
    ws.onclose = () => {
      if (this.ws !== ws) return;
      const shouldResume = !this._manualClose && !!(account && account.authToken) && !!(this.room || this.resume);
      if (this.room){
        this.resume = {
          room: this.room, player: this.player, isHost: this.isHost, game: this.game,
          matchId: this.matchId, deadline: Date.now() + 60000,

      }
      this.connected = false;
      this._authenticated = false;
      this.ws = null;
      if (this._hb){ clearInterval(this._hb); this._hb = null; }
      this.status(shouldResume ? t('online_reconnecting') : '连接已断开');
      this.resetState(shouldResume);
      if (shouldResume) this.scheduleReconnect();
      this._manualClose = false;
    };
    ws.onerror = () => { if (this.ws === ws) this.status(this.resume ? t('online_reconnecting') : '连接失败，请确认服务已启动'); };
  },
  scheduleReconnect(){
    if (!this.resume || !account || !account.authToken) return;
    if (this.resume.deadline && Date.now() >= this.resume.deadline){

      this.status(t('reconnect_timeout'));
      return;
    }
    if (this._reconnectTimer || this.connected || (this.ws && this.ws.readyState === 0)) return;
    const delay = Math.min(5000, 500 * Math.pow(2, Math.min(4, this._reconnectAttempts++)));
    this._reconnectTimer = setTimeout(() => {
      this._reconnectTimer = null;
      this.connect();
    }, delay);
  },
  clearResume(){
    if (this._reconnectTimer) clearTimeout(this._reconnectTimer);
    this._reconnectTimer = null;
    this._reconnectAttempts = 0;
    this.resume = null;
  },
  loadPendingResultClaim(){
    if (this.pendingResultClaim || !account || !account.uid) return this.pendingResultClaim;
    try {
      const saved = JSON.parse(localStorage.getItem('mg_pending_result_claim') || 'null');
      if (saved && saved.uid === account.uid && saved.matchId && saved.game && Array.isArray(saved.results)){
        this.pendingResultClaim = saved;

        localStorage.removeItem('mg_pending_result_claim');

    } catch {

    }
    return this.pendingResultClaim;
  },
  savePendingResultClaim(){
    try {
      if (this.pendingResultClaim) localStorage.setItem('mg_pending_result_claim', JSON.stringify(this.pendingResultClaim));
      else localStorage.removeItem('mg_pending_result_claim');
    } catch {}
  },
  clearPendingResultClaim(matchId){
    if (matchId && this.pendingResultClaim && String(this.pendingResultClaim.matchId) !== String(matchId)) return;
    if (this._resultRetryTimer) clearTimeout(this._resultRetryTimer);
    this._resultRetryTimer = null;
    this.pendingResultClaim = null;
    this.savePendingResultClaim();
  },
  submitResultClaim(claim){
    if (!claim || !claim.matchId || !claim.game || !Array.isArray(claim.results)) return;
    if (this.pendingResultClaim && String(this.pendingResultClaim.matchId) === String(claim.matchId)){
      this.flushPendingResultClaim();
      return;
    }
    this.clearPendingResultClaim();
    this.pendingResultClaim = {
      uid: account && account.uid,
      matchId: String(claim.matchId),
      game: String(claim.game),
      results: claim.results,
      won: !!claim.won,
      createdAt: Date.now(),
    };
    this.savePendingResultClaim();
    this.flushPendingResultClaim();
  },
  scheduleResultRetry(){
    if (!this.pendingResultClaim || this._resultRetryTimer) return;

      this._resultRetryTimer = null;
      this.flushPendingResultClaim();
    }, 3000);
  },
  flushPendingResultClaim(){
    const claim = this.pendingResultClaim || this.loadPendingResultClaim();
    if (!claim) return;
    if (!account || claim.uid !== account.uid){ this.clearPendingResultClaim(); return; }
    if (Date.now() - Number(claim.createdAt || 0) > 10 * 60 * 1000){ this.clearPendingResultClaim(); return; }
    if (!this.connected || !this._authenticated || !this.room || String(this.matchId || '') !== String(claim.matchId)){
      this.scheduleResultRetry();
      return;
    }
    this.send({ type: 'result', payload: {
      matchId: claim.matchId,
      game: claim.game,
      results: claim.results,
    } });
    this.scheduleResultRetry();
  },
  async replayMoveLog(log){
    const replayGame = currentGame;
    const gameScreen = $('screen-game');
    const oldInert = gameScreen ? !!gameScreen.inert : false;
    this._replaying = true;
    this._liveMoveQueue = [];
    if (gameScreen){ gameScreen.inert = true; gameScreen.setAttribute('aria-busy', 'true'); }
    this.status(t('online_restoring'));
    try {
      const events = Array.isArray(log) ? log.slice().sort((a, b) => (a.seq || 0) - (b.seq || 0)) : [];
      for (const event of events){
        if (!this.game || currentGame !== replayGame || !replayGame || !replayGame.onMove) break;
        replayGame.onMove(event && event.payload, event && event.player);
        const raw = replayGame._raw || replayGame;
        if (raw && typeof raw.whenIdle === 'function') await raw.whenIdle();
        else {
          const p = event && event.payload || {};
          const delay = p.roll ? 1250 : (p.decision ? 650 : 90);
          await new Promise(resolve => setTimeout(resolve, delay));
        }
      }
    } finally {
      try {
        while (currentGame === replayGame && replayGame && replayGame.onMove && this._liveMoveQueue.length){
          const event = this._liveMoveQueue.shift() || {};
          const payload = event.payload;
          replayGame.onMove(payload, event.player);
          const raw = replayGame._raw || replayGame;
          if (raw && typeof raw.whenIdle === 'function') await raw.whenIdle();
        }
      } finally {
        this._replaying = false;
        if (gameScreen){
          gameScreen.inert = oldInert;
          if (typeof gameScreen.removeAttribute === 'function') gameScreen.removeAttribute('aria-busy');
          else gameScreen.setAttribute('aria-busy', 'false');
        }
        if (this.room && currentGame === replayGame) this.status(t('online_restored', this.room));
      }
    }
  },
  status(text, trustedHtml){

    if (trustedHtml) node.innerHTML = text;

  send(msg){ if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(msg)); },
  create(settings){
    if (!account){ toast('请先创建账号或登录后再联机'); openAuthModal(); return; }
    settings = settings || {};
    if (this.connected){
      this.send({type:'create', payload:{ capacity:Math.max(2,Math.min(5,Number(settings.capacity)||2)), visibility:settings.visibility || 'public', allowSpectators:settings.allowSpectators !== false }});
      this.status('正在创建房间…');

  },

  sendMove(payload){
    if (this.game === 'tank' && payload && payload.act === 'input'){
      this.send({ type:'tank_input', payload:{ matchId:this.matchId, seq:payload.seq, clientTick:Number(this.serverTick)||0, input:payload.input } }); return;
    }
    if (this.game === 'tank' && payload && payload.act === 'shoot'){
      this.send({ type:'tank_input', payload:{ matchId:this.matchId, seq:payload.seq, clientTick:Number(this.serverTick)||0, input:{ fire:true } } }); return;
    }
    if (this.game === 'tank' && payload && payload.act === 'move'){
      const input={up:false,right:false,down:false,left:false}; input[['up','right','down','left'][Number(payload.d)]] = true;
      this.send({ type:'tank_input', payload:{ matchId:this.matchId, seq:payload.seq, clientTick:Number(this.serverTick)||0, input } }); return;
    }
    if (this.game === 'tetris' && payload){
      if (payload.act === 'lock'){
        this.send({ type:'tetris_lock_claim', payload:{ ...payload, matchId:this.matchId, linesCleared:Number(payload.linesCleared)||0, attack:Number(payload.attack)||0 } }); return;

      case 'joined':
        msg.room = String(msg.room || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
        this.room = msg.room; this.player = msg.player; this.isHost = false;
        this.roomInfo = msg.payload || { room: msg.room, game: null, capacity: 2, players: [{ uid: null, player: 0 }], seats:[], size: 1, started: false };
        this.status('已加入房间 <span class="room-code">' + msg.room + '</span>，等待房主开始…', true);
        renderRoomPanel();

      case 'room_update':
        this.roomInfo = msg.payload;
        this.capacity = msg.payload.capacity || this.capacity;
        if (this.room) this.isHost = !!(msg.payload.host && Number(msg.payload.host.seatId) === Number(this.player));

        }
        renderRoomPanel();
        if (this.pendingGame){ const game=this.pendingGame; this.pendingGame=null; this.selectGame(game); }

        this.spectatorRoom = msg.payload && msg.payload.room;
        this.roomInfo = msg.payload || null; this.player = null; this.isHost = false;
        this.game = msg.payload && msg.payload.started ? msg.payload.game : null;

          }

        this.rewardVersion = msg.rewardVersion || null;

        if (typeof renderSocialRail === 'function') renderSocialRail();

        break;

          const p = msg.payload || {};
          this.room = p.room;
          this.player = Number.isInteger(p.player) ? p.player : 0;

          this.capacity = p.capacity || 2;
          this.matchId = p.matchId || null;
          this.roomInfo = {
            room: p.room, game: p.game || null, capacity: this.capacity,
            players: p.players || [], size: p.size || 1, onlineSize: p.onlineSize || 1,
            started: !!p.started, matchId: p.matchId || null,

          this.game = p.started ? (p.game || null) : null;
          this.clearResume();
          renderRoomPanel();
          if (this.game){
            startOnlineGame(this.game, p.size);
            if (p.tankSnapshot && currentGame && typeof currentGame.applyServerSnapshot === 'function'){
              this.serverTick=Number(p.tankSnapshot.serverTick)||0; currentGame.applyServerSnapshot(p.tankSnapshot);

      case 'peer_status':
        {

function socialRelationshipFor(uid){
  const state = online.socialState || {};
  if ((state.blocked || []).some(item => item.uid === uid)) return 'blocked';
  if ((state.friends || []).some(item => item.uid === uid)) return 'friends';
  if ((state.incoming || []).some(item => item.user && item.user.uid === uid)) return 'incoming';
  if ((state.outgoing || []).some(item => item.user && item.user.uid === uid)) return 'outgoing';
  return 'none';
}

function openProfileModal(uid){
  if (!uid){
    if (!account){ openAuthModal(); return; }
    renderProfilePopup(account, true);
    return;
  }
  const isMe = account && account.uid === uid;
  if (isMe){ renderProfilePopup(account, true); return; }
  const local = profileByUid(uid);
  if (online.connected && lastServerLB){
    const u = lastServerLB.list.find(x => x.uid === uid);
    if (u) renderProfilePopup(u, false);
    else if (local) renderProfilePopup(local, false);
  } else if (local){
    renderProfilePopup(local, false);
  } else {
    toast(t('profile_not_found'));
  }

function requestPurchase(category, id, button){
  if (!online.connected){
    toast(t('shop_connect_required'));
    return;
  }
  const requestId = (typeof crypto !== 'undefined' && crypto.randomUUID)
    ? 'buy_' + crypto.randomUUID()
    : 'buy_' + Date.now().toString(36) + '_' + (++purchaseRequestSeq).toString(36);
  online.send({ type: 'purchase', payload: { category, id, requestId } });
  if (button){
    button.disabled = true;
    button.textContent = t('shop_processing');
    setTimeout(() => {
      if (button.isConnected){
        button.disabled = false;
        button.textContent = '购买';
      }
    }, 8000);
  }
}

  try { s += String(screen.width) + 'x' + String(screen.height) + '|'; } catch {}

  try { s += (Intl.DateTimeFormat().resolvedOptions().timeZone || '') + '|'; } catch {}
  try { s += (navigator.platform || '') + '|'; } catch {}

  for (let i = 0; i < s.length; i++){
    h1 = (h1 * 31 + s.charCodeAt(i)) | 0;

  }

// 等级只由累计 XP 决定；升级需求：min(200, 30 + 5 × 当前等级)。
function xpRequiredForNextLevel(level){
  return Math.min(200, 30 + 5 * Math.max(1, Math.floor(Number(level) || 1)));
}
function xpForLevel(level){
  const target = Math.max(1, Math.floor(Number(level) || 1));
  const steps = target - 1;
  const uncapped = Math.min(steps, 33);
  return uncapped * 30 + 5 * uncapped * (uncapped + 1) / 2 + Math.max(0, steps - uncapped) * 200;
}
function levelFromXp(xp){
  const total = Math.max(0, Math.floor(Number(xp) || 0));
  let low = 1, high = Math.max(2, Math.floor(total / 35) + 2);
  while (low < high){
    const mid = Math.ceil((low + high) / 2);
    if (xpForLevel(mid) <= total) low = mid;
    else high = mid - 1;
  }
  return low;
}

function recordPlaymatesFromResult(results, currentResult, gameId){
  if (!account) return;
  results.forEach(other => {
    if (other.slot === currentResult.slot) return;
    const otherUid = online.connected && online.game ? null : slots[other.slot];
    if (!otherUid) return;
    const otherP = profileByUid(otherUid);
    if (otherP) recordPlaymate(account, otherUid, otherP.name, gameId);
  });
  // Also record online opponents via player list
  if (online.connected && online.game && online.roomInfo) {
    const players = online.roomInfo.players || [];
    players.forEach(pl => {
      if (pl.uid && pl.uid !== account.uid) {
        recordPlaymate(account, pl.uid, pl.name || 'Player', gameId);
      }
    });
  }

  if ((results || []).length === 2 && winners.length === 0 && Number(results[0].rank) === Number(results[1].rank)) return 'draw';
