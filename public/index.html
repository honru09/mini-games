/* ================= 井字棋 ================= */
function gameTicTacToe(area, extra, n, opts){
  opts = opts || {};
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let board = Array(9).fill(null), cur = 0, over = false, winLine = null;
  let aiPending = false;
  function tttScore(bd, turn){
    for (const L of LINES){
      if (bd[L[0]] !== null && bd[L[0]] === bd[L[1]] && bd[L[1]] === bd[L[2]]){
        return bd[L[0]] === 0 ? 10 : -10;
      }
    }
    if (bd.every(v => v !== null)) return 0;
    if (turn === 0){
      let best = -Infinity;
      for (let i = 0; i < 9; i++){
        if (bd[i] === null){ bd[i] = 0; best = Math.max(best, tttScore(bd, 1)); bd[i] = null; }
      }
      return best;
    }
    let best = Infinity;
    for (let i = 0; i < 9; i++){
      if (bd[i] === null){ bd[i] = 1; best = Math.min(best, tttScore(bd, 0)); bd[i] = null; }
    }
    return best;
  }
  function scheduleAI(){
    if (aiPending || over) return;
    if (!opts.ai || !opts.ai.has(cur)) return;
    aiPending = true;
    setTimeout(() => {
      aiPending = false;
      if (over) return;
      const legal = [];
      for (let i = 0; i < 9; i++) if (board[i] === null) legal.push(String(i));
      if (!legal.length) return;
      // 完美走法：minimax（AI 永不输）
      let bestI = -1, bestV = -Infinity;
      for (const s of legal){
        const i = Number(s);
        board[i] = cur;
        const v = tttScore(board, cur ^ 1);
        board[i] = null;
        if (v > bestV){ bestV = v; bestI = i; }
      }
      applyMove(bestI);
    }, 500);
  }
  function render(){
    area.innerHTML = '';
    const grid = el('div','ttt-grid');
    for (let i=0;i<9;i++){
      const b = el('button','ttt-cell');
      b.setAttribute('aria-label','格子 ' + (i+1));
      b.style.color = board[i] === 0 ? PLAYER_COLORS[0] : PLAYER_COLORS[1];
      if (board[i] === 0) b.textContent = '✕';
      if (board[i] === 1) b.textContent = '◯';
      if (winLine && winLine.includes(i)) b.classList.add('win');
      if (!over && board[i] === null){
        b.addEventListener('click', () => move(i));
      } else {
        b.disabled = true;
      }
      grid.appendChild(b);
    }
    area.appendChild(grid);
    renderPlayers(cur, null);
    if (over){
      setStatus(winLine ? ('🏆 玩家' + (cur+1) + ' 获胜！') : '🤝 平局', !!winLine);
    } else {
      setStatus(opts.online ? (cur === opts.myIdx ? t('your_turn') + '，点击空格落子' : t('opponent_turn') + '…') : ('玩家' + (cur+1) + ' 的回合'));
    }
  }
  function applyMove(i){
    board[i] = cur;
    for (const L of LINES){
      if (L.includes(i) && board[L[0]] !== null && board[L[0]] === board[L[1]] && board[L[1]] === board[L[2]]){
        winLine = L; over = true;
        if (opts.onEnd) opts.onEnd([
          { slot: cur, coins: 1, rank: 1 },
          { slot: cur ^ 1, coins: 0, rank: 2 },
        ]);
        render(); return;
      }
    }
    if (board.every(v => v !== null)){
      over = true;
      if (opts.onEnd) opts.onEnd([
        { slot: 0, coins: 0, rank: 1 },
        { slot: 1, coins: 0, rank: 1 },
      ]);
    } else {
      cur ^= 1;
    }
    render();
    scheduleAI();
  }
  opts.onMove = applyMove;
  function move(i){
    if (opts.online && cur !== opts.myIdx) return;
    if (opts.ai && opts.ai.has(cur)) return;
    if (opts.online) opts.sendMove(i);
    applyMove(i);
  }
  function resetLocal(){ board = Array(9).fill(null); cur = 0; over = false; winLine = null; aiPending = false; render(); }
  function reset(){
    if (opts.online && !opts.isHost){ toast('由房主开始新一局'); return; }
    if (opts.online) opts.sendRestart();
    resetLocal();
  }
  render();
  return { reset, onMove: opts.onMove, onRestart: resetLocal, snapshot: () => ({ board: board.slice(), cur, over, winLine: winLine ? winLine.slice() : null }) };
}

/* ================= 五子棋 ================= */
function checkGomokuWin(grid, r, c){
  const N = grid.length, p = grid[r][c];
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  for (const [dr,dc] of dirs){
    let cnt = 1;
    for (const s of [1,-1]){
      let nr = r + dr*s, nc = c + dc*s;
      while (nr>=0 && nr<N && nc>=0 && nc<N && grid[nr][nc] === p){ cnt++; nr += dr*s; nc += dc*s; }
    }
    if (cnt >= 5) return true;
  }
  return false;
}
function gameGomoku(area, extra, n, opts){
  opts = opts || {};
  const N = 15, CELL = 34, PAD = 22, LOGICAL = PAD*2 + CELL*(N-1);
  let grid = Array.from({length:N}, () => Array(N).fill(-1));
  let cur = 0, over = false, hist = [], last = null;
  let aiPending = false;
  function gomokuLineScore(r, c, p){
    let best = 0;
    for (const [dr,dc] of [[1,0],[0,1],[1,1],[1,-1]]){
      let cnt = 1, open = 0;
      for (const s of [1,-1]){
        let nr = r + dr*s, nc = c + dc*s;
        while (nr >= 0 && nr < N && nc >= 0 && nc < N && grid[nr][nc] === p){ cnt++; nr += dr*s; nc += dc*s; }
        if (nr >= 0 && nr < N && nc >= 0 && nc < N && grid[nr][nc] === -1) open++;
      }
      if (cnt >= 5) return 1e9;
      best = Math.max(best, Math.pow(cnt, 3) * (open + 1));
    }
    return best;
  }
  function scheduleAI(){
    if (aiPending || over) return;
    if (!opts.ai || !opts.ai.has(cur)) return;
    aiPending = true;
    setTimeout(() => {
      aiPending = false;
      if (over) return;
      const empties = [];
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c] === -1) empties.push(r + ',' + c);
      if (!empties.length) return;
      let bestR = -1, bestC = -1, bestV = -1;
      for (const s of empties){
        const [r, c] = s.split(',').map(Number);
        const atk = gomokuLineScore(r, c, cur);
        const def = gomokuLineScore(r, c, cur ^ 1);
        const v = Math.max(atk, def * 1.1);
        if (v > bestV){ bestV = v; bestR = r; bestC = c; }
      }
      applyMove(r, c);
    }, 550);
  }
  const canvas = document.createElement('canvas');
  canvas.className = 'board-canvas';
  const dpr = window.devicePixelRatio || 1;
  canvas.width = LOGICAL * dpr; canvas.height = LOGICAL * dpr;
  area.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  function draw(){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, LOGICAL, LOGICAL);
    ctx.strokeStyle = '#b8c2d4'; ctx.lineWidth = 1;
    for (let i=0;i<N;i++){
      ctx.beginPath(); ctx.moveTo(PAD + i*CELL, PAD); ctx.lineTo(PAD + i*CELL, PAD + (N-1)*CELL); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(PAD, PAD + i*CELL); ctx.lineTo(PAD + (N-1)*CELL, PAD + i*CELL); ctx.stroke();
    }
    ctx.fillStyle = '#1d2433';
    for (const [r,c] of [[3,3],[3,11],[7,7],[11,3],[11,11]]){
      ctx.beginPath(); ctx.arc(PAD + c*CELL, PAD + r*CELL, 3, 0, Math.PI*2); ctx.fill();
    }
    for (let r=0;r<N;r++) for (let c=0;c<N;c++){
      if (grid[r][c] === -1) continue;
      ctx.fillStyle = PLAYER_COLORS[grid[r][c]];
      ctx.beginPath(); ctx.arc(PAD + c*CELL, PAD + r*CELL, CELL*0.42, 0, Math.PI*2); ctx.fill();
    }
    if (last){
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(PAD + last[1]*CELL, PAD + last[0]*CELL, CELL*0.18, 0, Math.PI*2); ctx.stroke();
    }
  }
  canvas.addEventListener('click', e => {
    if (over) return;
    if (opts.online && cur !== opts.myIdx) return;
    if (opts.ai && opts.ai.has(cur)) return;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width * LOGICAL;
    const y = (e.clientY - rect.top) / rect.height * LOGICAL;
    const c = Math.round((x - PAD) / CELL), r = Math.round((y - PAD) / CELL);
    if (r < 0 || r >= N || c < 0 || c >= N) return;
    if (grid[r][c] !== -1) return;
    if (opts.online) opts.sendMove([r, c]);
    applyMove(r, c);
  });
  function applyMove(r, c){
    if (Array.isArray(r)){ c = r[1]; r = r[0]; }
    grid[r][c] = cur; last = [r,c]; hist.push([r,c]);
    if (checkGomokuWin(grid, r, c)){
      over = true;
      if (opts.onEnd) opts.onEnd([
        { slot: cur, coins: 1, rank: 1 },
        { slot: cur ^ 1, coins: 0, rank: 2 },
      ]);
      draw(); renderPlayers(cur, null);
      setStatus('🏆 玩家' + (cur+1) + ' 获胜！', true);
      return;
    }
    if (hist.length === N*N){
      over = true;
      if (opts.onEnd) opts.onEnd([
        { slot: 0, coins: 0, rank: 1 },
        { slot: 1, coins: 0, rank: 1 },
      ]);
      draw(); renderPlayers(cur, null);
      setStatus('🤝 平局', false);
      return;
    }
    cur ^= 1;
    draw(); renderPlayers(cur, null);
    setStatus(opts.online ? (cur === opts.myIdx ? '你的回合，点击棋盘落子' : '等待对方落子…') : ('玩家' + (cur+1) + ' 的回合'));
    scheduleAI();
  }
  opts.onMove = applyMove;
  if (!opts.online){
    const undoBtn = el('button','btn','↩ 悔棋');
    undoBtn.addEventListener('click', () => {
      if (over || !hist.length) return;
      const [r,c] = hist.pop();
      grid[r][c] = -1;
      cur ^= 1;
      last = hist.length ? hist[hist.length-1] : null;
      draw(); renderPlayers(cur, null);
      setStatus('玩家' + (cur+1) + ' 的回合');
      scheduleAI();
    });
    extra.appendChild(undoBtn);
  }
  function resetLocal(){
    grid = Array.from({length:N}, () => Array(N).fill(-1));
    cur = 0; over = false; hist = []; last = null; aiPending = false;
    draw(); renderPlayers(0, null);
    setStatus(opts.online ? (cur === opts.myIdx ? '你的回合，点击棋盘落子' : '等待对方落子…') : '玩家1 的回合');
  }
  function reset(){
    if (opts.online && !opts.isHost){ toast('由房主开始新一局'); return; }
    if (opts.online) opts.sendRestart();
    resetLocal();
  }
  resetLocal();
  return { reset, onMove: opts.onMove, onRestart: resetLocal, snapshot: () => ({ hist: hist.map(h => h.slice()), cur, over, last: last ? last.slice() : null }) };
}

/* ================= 飞行棋 ================= */
function gameLudo(area, extra, n, opts){
  opts = opts || {};
  const TRACK = 52, HOME = 56;
  const pids = n === 2 ? [0,2] : (n === 3 ? [0,1,2] : [0,1,2,3]);
  const START = [0,13,26,39];
  const color = pid => PLAYER_COLORS[pid];
  let tokens = pids.map(() => Array(4).fill(-1));
  let curIdx = 0, phase = 'roll', dice = 0, over = false, winner = -1;
  let S = 520;
  const board = el('div','ludo-board');
  area.appendChild(board);
  const diceBtn = el('button','dice-btn');
  const dice3d = makeDice3D(58);
  diceBtn.appendChild(dice3d.wrap);
  diceBtn.addEventListener('click', roll);
  extra.appendChild(diceBtn);
  let aiPending = false;
  function scheduleAI(){
    if (aiPending || over) return;
    if (!opts.ai || !opts.ai.has(curIdx)) return;
    aiPending = true;
    setTimeout(async () => {
      aiPending = false;
      if (over) return;
      if (phase === 'roll'){ roll(); return; }
      if (phase === 'pick'){
        const mv = movable();
        if (!mv.length){ nextTurn('无子可动'); return; }
        // 启发式：优先击落/回家，其次推进
        let bestT = mv[0], bestS = -1e9;
        mv.forEach(ti => {
          const arr = tokens[curIdx];
          const curPos = arr[ti];
          const newPos = curPos === -1 ? 0 : Math.min(HOME, curPos + dice);
          let s = curPos === -1 ? 6 : (newPos === HOME ? 120 : newPos);
          if (newPos <= 50){
            const cell = cellOf(curPid(), newPos);
            let hit = 0;
            pids.forEach((p2, p2i) => {
              if (p2 === curPid()) return;
              for (let j = 0; j < 4; j++){
                const t2 = tokens[p2i][j];
                if (t2 >= 0 && t2 <= 50 && cellOf(p2, t2) === cell) hit++;
              }
            });
            s += hit * 45;
          }
          if (s > bestS){ bestS = s; bestT = ti; }
        });
        pick(curPid(), bestT);
      }
    }, 700);
  }

  function curPid(){ return pids[curIdx]; }
  function canMove(t){ if (t === -1) return dice === 6; if (t >= HOME) return false; return t + dice <= HOME; }
  function movable(){
    const arr = [];
    for (let i=0;i<4;i++) if (canMove(tokens[curIdx][i])) arr.push(i);
    return arr;
  }
  function cellOf(pid, t){ return (START[pid] + t) % TRACK; }
  function geometry(){
    const c = S/2, R = S*0.40;
    const ang = i => (-90 + i * 360/TRACK) * Math.PI/180;
    const tpos = i => [c + R*Math.cos(ang(i)), c + R*Math.sin(ang(i))];
    const colPos = (pid, k) => {
      const [ex,ey] = tpos((START[pid] - 1 + TRACK) % TRACK);
      const t = (k+1)/5;
      return [c + (ex-c)*(1-t), c + (ey-c)*(1-t)];
    };
    const basePos = pid => {
      const m = S*0.035, b = S*0.19;
      const corners = [[m,m],[S-m-b,m],[S-m-b,S-m-b],[m,S-m-b]];
      return corners[pid];
    };
    return { c, tpos, colPos, basePos };
  }
  function renderBoard(){
    const w = area.clientWidth || 520;
    S = Math.min(w, 540);
    board.style.width = S + 'px'; board.style.height = S + 'px';
    board.innerHTML = '';
    const g = geometry();
    const cellSize = Math.max(20, Math.min(30, S*0.056));
    const tokSize = cellSize * 0.52;
    // 轨道格
    for (let i=0;i<TRACK;i++){
      const [x,y] = g.tpos(i);
      const cell = el('div','tcell' + (START.includes(i) ? ' start' : ''));
      cell.style.left = x + 'px'; cell.style.top = y + 'px';
      cell.style.width = cell.style.height = cellSize + 'px';
      cell.style.marginLeft = cell.style.marginTop = (-cellSize/2) + 'px';
      if (START.includes(i)){
        const pid = START.indexOf(i);
        cell.style.borderColor = color(pid);
      }
      cell.dataset.cell = i;
      board.appendChild(cell);
    }
    // 终点航线和中心
    const colSizes = [cellSize*0.85, cellSize*0.85, cellSize*0.85, cellSize*0.85, S*0.13];
    for (const pid of pids){
      for (let k=0;k<4;k++){
        const [x,y] = g.colPos(pid,k);
        const h = el('div','hcell');
        h.style.left = x + 'px'; h.style.top = y + 'px';
        h.style.width = h.style.height = colSizes[k] + 'px';
        h.style.marginLeft = h.style.marginTop = (-colSizes[k]/2) + 'px';
        h.style.borderColor = color(pid);
        board.appendChild(h);
      }
    }
    const center = el('div','ludo-center');
    const cs = S*0.13;
    center.style.left = center.style.top = (S/2) + 'px';
    center.style.width = center.style.height = cs + 'px';
    center.style.marginLeft = center.style.marginTop = (-cs/2) + 'px';
    center.textContent = '🏁';
    board.appendChild(center);
    // 基地
    for (const pid of pids){
      const [bx,by] = g.basePos(pid);
      const base = el('div','ludo-base');
      const b = S*0.19;
      base.style.left = bx + 'px'; base.style.top = by + 'px';
      base.style.width = base.style.height = b + 'px';
      base.style.borderColor = color(pid);
      base.style.background = PLAYER_BG[pid];
      for (let j=0;j<4;j++) base.appendChild(el('div','slot'));
      board.appendChild(base);
    }
    // 棋子
    const slots = [[0.28,0.28],[0.72,0.28],[0.28,0.72],[0.72,0.72]];
    const place = (parent, x, y, pid, ti) => {
      const tok = el('div','tok');
      tok.style.width = tok.style.height = tokSize + 'px';
      tok.style.background = color(pid);
      tok.style.left = x + 'px'; tok.style.top = y + 'px';
      tok.dataset.pid = pid; tok.dataset.ti = ti;
      if (phase === 'pick' && pid === curPid() && canMove(tokens[pids.indexOf(pid)][ti])){
        tok.classList.add('movable');
      }
      tok.addEventListener('click', () => pick(pid, ti));
      parent.appendChild(tok);
    };
    // 收集每个格子的棋子
    const trackMap = new Map(), colMap = new Map(), baseMap = new Map();
    pids.forEach((pid, pi) => {
      tokens[pi].forEach((t, ti) => {
        if (t === -1){
          const k = pid;
          if (!baseMap.has(k)) baseMap.set(k, []);
          baseMap.get(k).push([pid,ti]);
        } else if (t <= 50){
          const c = cellOf(pid,t);
          if (!trackMap.has(c)) trackMap.set(c, []);
          trackMap.get(c).push([pid,ti]);
        } else if (t < HOME){
          const k = pid + '-' + (t-51);
          if (!colMap.has(k)) colMap.set(k, []);
          colMap.get(k).push([pid,ti]);
        }
      });
    });
    for (const [c, list] of trackMap){
      const cell = board.querySelector('[data-cell="' + c + '"]');
      if (!cell) continue;
      list.slice(0,4).forEach(([pid,ti], j) => {
        const [sx,sy] = slots[j];
        place(cell, cellSize*sx, cellSize*sy, pid, ti);
      });
    }
    for (const [k, list] of colMap){
      const [pid, kk] = k.split('-').map(Number);
      const [x,y] = g.colPos(pid,kk);
      const host = el('div');
      host.style.left = x + 'px'; host.style.top = y + 'px';
      host.style.position = 'absolute';
      host.style.width = host.style.height = colSizes[kk] + 'px';
      list.slice(0,4).forEach(([pid2,ti], j) => {
        const [sx,sy] = slots[j];
        place(host, colSizes[kk]*sx, colSizes[kk]*sy, pid2, ti);
      });
      board.appendChild(host);
    }
    for (const [pid, list] of baseMap){
      const base = board.querySelectorAll('.ludo-base')[pids.indexOf(pid)];
      const slotsEls = base.querySelectorAll('.slot');
      list.slice(0,4).forEach(([pid2,ti], j) => {
        const s = slotsEls[j];
        place(s, '50%', '50%', pid2, ti);
      });
    }
    // 结束覆盖层
    if (over){
      const ov = el('div','overlay');
      const card = el('div','overlay-card');
      card.appendChild(el('div','big','🏆'));
      card.appendChild(el('h3', null, '玩家' + (pids.indexOf(winner)+1) + ' 获胜！'));
      card.appendChild(el('p', null, '四架飞机全部归位'));
      const btn = el('button','btn btn-primary','再来一局');
      btn.addEventListener('click', reset);
      card.appendChild(btn);
      ov.appendChild(card);
      board.appendChild(ov);
    }
    const infos = pids.map(pid => {
      const pi = pids.indexOf(pid);
      const cnt = tokens[pi].filter(t => t === HOME).length;
      return '归位 ' + cnt + '/4';
    });
    diceBtn.disabled = over || phase !== 'roll' || (opts.online && curIdx !== opts.myIdx) || (opts.ai && opts.ai.has(curIdx));
    renderPlayers(curIdx, infos, null, pids.map(pid => PLAYER_COLORS[pid]));
  }
  function roll(){
    if (over || phase !== 'roll') return;
    if (opts.online && curIdx !== opts.myIdx) return;
    if (opts.ai && opts.ai.has(curIdx)) return;
    const d = 1 + Math.floor(Math.random()*6);
    if (opts.online) opts.sendMove({ dice: d });
    applyDice(d);
  }
  function applyDice(d){
    dice = d;
    diceBtn.disabled = true;
    setStatus('玩家' + (curIdx+1) + ' 掷骰子…');
    dice3d.roll(dice, () => {
      const mv = movable();
      if (!mv.length){
        nextTurn('玩家' + (curIdx+1) + ' 掷出 ' + dice + '，无子可动');
        return;
      }
      phase = 'pick';
      renderBoard();
      setStatus('玩家' + (curIdx+1) + ' 掷出 ' + dice + '，点击高亮棋子移动');
      scheduleAI();
    });
  }
  function pick(pid, ti){
    if (over || phase !== 'pick' || pid !== curPid()) return;
    if (opts.online && curIdx !== opts.myIdx) return;
    if (opts.ai && opts.ai.has(curIdx)) return;
    const pi = pids.indexOf(pid);
    const arr = tokens[pi];
    if (!canMove(arr[ti])) return;
    if (opts.online) opts.sendMove({ ti });
    applyPick(pid, ti);
  }
  function applyPick(pid, ti){
    const pi = pids.indexOf(pid);
    const arr = tokens[pi];
    arr[ti] = arr[ti] === -1 ? 0 : arr[ti] + dice;
    if (arr[ti] <= 50){
      const cell = cellOf(pid, arr[ti]);
      let captured = 0;
      pids.forEach((p2, p2i) => {
        if (p2 === pid) return;
        for (let j=0;j<4;j++){
          const t2 = tokens[p2i][j];
          if (t2 >= 0 && t2 <= 50 && cellOf(p2,t2) === cell){
            tokens[p2i][j] = -1; captured++;
          }
        }
      });
      if (captured) toast('💥 击落对方 ' + captured + ' 个棋子！');
    }
    if (arr.every(v => v === HOME)){
      over = true; winner = pid;
      if (opts.onEnd) opts.onEnd(pids.map((p2, i) => ({
        slot: i,
        coins: i === curIdx ? 1 : 0,
        rank: i === curIdx ? 1 : 2,
      })));
      renderBoard();
      setStatus('🏆 玩家' + (curIdx+1) + ' 获胜！', true);
      return;
    }
    if (dice === 6){
      phase = 'roll';
      diceBtn.disabled = false;
      renderBoard();
      setStatus('玩家' + (curIdx+1) + ' 掷出 6，再掷一次！');
      scheduleAI();
    } else {
      nextTurn('玩家' + (curIdx+1) + ' 完成移动');
    }
  }
  function nextTurn(msg){
    phase = 'roll';
    curIdx = (curIdx + 1) % pids.length;
    diceBtn.disabled = false;
    renderBoard();
    setStatus((msg ? msg + '，' : '') + '轮到玩家' + (curIdx+1) + '，请掷骰子');
    scheduleAI();
  }
  opts.onMove = payload => {
    if (payload && payload.dice !== undefined) applyDice(payload.dice);
    else if (payload && payload.ti !== undefined) applyPick(curPid(), payload.ti);
  };
  function resetLocal(){
    tokens = pids.map(() => Array(4).fill(-1));
    curIdx = 0; phase = 'roll'; dice = 0; over = false; winner = -1; aiPending = false;
    diceBtn.disabled = false;
    dice3d.reset();
    renderBoard();
    setStatus('玩家1 的回合，请掷骰子');
  }
  function reset(){
    if (opts.online && !opts.isHost){ toast('由房主开始新一局'); return; }
    if (opts.online) opts.sendRestart();
    resetLocal();
  }
  renderBoard();
  setStatus('玩家1 的回合，请掷骰子');
  return { reset, onMove: opts.onMove, onRestart: resetLocal, snapshot: () => ({ tokens: tokens.map(t => t.slice()), curIdx, phase, dice, over, winner }) };
}

    {name:'机会', type:'chance', emo:'🎁'},
  ];
  const CHANCE = [
    {text:'意外之财，获得 800', v:800},
    {text:'房屋维修，支出 600', v:-600},
    {text:'前进 3 格', move:3},
    {text:'后退 2 格', move:-2},

  ];

  let aiPending = false;
  function scheduleAI(){

      aiPending = false;

        const p = players[cur];
        const cell = CELLS[p.pos];
        // 启发式：买得起的便宜地就买，贵地保留现金
        const buy = p.money >= cell.price && (p.money - cell.price >= 800 || cell.price <= 400);

  function renderMoney(){

  }
  function roll(){
    if (over || phase !== 'roll') return;
    if (opts.online && cur !== opts.myIdx) return;
    if (opts.ai && opts.ai.has(cur)) return;
    const d1 = 1 + Math.floor(Math.random()*6), d2 = 1 + Math.floor(Math.random()*6);
    if (opts.online) opts.sendMove({ roll: [d1, d2] });

  }
  function applyRoll(d1, d2){
    rollBtn.disabled = true;

  function movePlayer(pi, steps, cb){

  function resolveCell(pi, depth){
    if (over) return;

    const cell = CELLS[p.pos];
    if (cell.type === 'go'){
      nextTurn();

      pay(pi, cell.amt, '缴纳了 ' + cell.amt + ' 税款');

      if (cell.owner === -1){
        phase = 'buy';
