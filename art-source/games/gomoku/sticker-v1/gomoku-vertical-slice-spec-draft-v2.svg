<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Playroom Gomoku sticker art vertical-slice specification</title>
  <desc id="desc">An exact fifteen by fifteen Gomoku board with five-in-a-row, last-move, hover, invalid and result-state samples.</desc>
  <defs>
    <filter id="contact" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="10" dy="16" stdDeviation="7" flood-color="#211923" flood-opacity=".22"/>
    </filter>
    <g id="blackStone">
      <circle r="20" fill="#211923" stroke="#211923" stroke-width="6"/>
      <path d="M-11-9A17 17 0 0 1 7-14L3-7A12 12 0 0 0-8-3Z" fill="#443443"/>
      <circle cx="-7" cy="-8" r="4" fill="#FFF9F2"/>
    </g>
    <g id="whiteStone">
      <circle r="20" fill="#FFF9F2" stroke="#211923" stroke-width="6"/>
      <path d="M-13 8A18 18 0 0 0 14 2L10 12A17 17 0 0 1-12 14Z" fill="#F3E5C4"/>
      <circle cx="-7" cy="-8" r="4" fill="#FFFFFF"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="#FFF9F2"/>
  <path d="M0 0H520L380 90H0Z" fill="#39B9B2"/>
  <path d="M0 0H520L478 28H0Z" fill="#4BCB83" opacity=".55"/>

  <g filter="url(#contact)">
    <rect x="65" y="60" width="1030" height="780" rx="52" fill="#82513F" stroke="#211923" stroke-width="14"/>
    <rect x="105" y="100" width="950" height="700" rx="34" fill="#F1B640" stroke="#211923" stroke-width="10"/>
    <path d="M140 180H1015M140 360H1015M140 650H1015" stroke="#82513F" stroke-width="13" opacity=".38"/>
  </g>

  <!-- Exact 15 x 15 intersection grid: 15 vertical and 15 horizontal lines. -->
  <g id="grid" data-grid-size="15" stroke="#443443" stroke-width="6" stroke-linecap="round">
    <path d="M180 125V769M226 125V769M272 125V769M318 125V769M364 125V769M410 125V769M456 125V769M502 125V769M548 125V769M594 125V769M640 125V769M686 125V769M732 125V769M778 125V769M824 125V769"/>
    <path d="M180 125H824M180 171H824M180 217H824M180 263H824M180 309H824M180 355H824M180 401H824M180 447H824M180 493H824M180 539H824M180 585H824M180 631H824M180 677H824M180 723H824M180 769H824"/>
  </g>
  <g data-standard-star-count="5" fill="#211923">
    <circle cx="318" cy="263" r="8"/><circle cx="686" cy="263" r="8"/>
    <circle cx="502" cy="447" r="8"/>
    <circle cx="318" cy="631" r="8"/><circle cx="686" cy="631" r="8"/>
  </g>

  <!-- Non-winning context stones. -->
  <g>
    <use href="#whiteStone" x="456" y="309"/><use href="#blackStone" x="502" y="309"/>
    <use href="#whiteStone" x="548" y="355"/><use href="#blackStone" x="594" y="355"/>
    <use href="#blackStone" x="410" y="401"/><use href="#whiteStone" x="456" y="447"/>
    <use href="#whiteStone" x="594" y="447"/><use href="#blackStone" x="640" y="493"/>
  </g>

  <!-- Exactly five black stones, columns 4 through 8 on row 10. -->
  <path d="M364 563H548" stroke="#F1B640" stroke-width="12" stroke-linecap="round"/>
  <g id="five-in-a-row" data-win-length="5">
    <use href="#blackStone" x="364" y="539"/><use href="#blackStone" x="410" y="539"/>
    <use href="#blackStone" x="456" y="539"/><use href="#blackStone" x="502" y="539"/>
    <use href="#blackStone" x="548" y="539"/>
  </g>
  <path d="M530 521H566V557H530Z" fill="none" stroke="#EF665F" stroke-width="9" stroke-linejoin="round"/>

  <!-- State samples. -->
  <g transform="translate(1150 66)" font-family="system-ui,sans-serif">
    <rect width="385" height="768" rx="36" fill="#F3E5C4" stroke="#211923" stroke-width="10" filter="url(#contact)"/>
    <g transform="translate(58 62)">
      <rect width="269" height="122" rx="26" fill="#FFF9F2" stroke="#211923" stroke-width="7"/>
      <use href="#blackStone" x="82" y="61"/><use href="#whiteStone" x="187" y="61"/>
    </g>
    <g transform="translate(58 216)">
      <rect width="269" height="122" rx="26" fill="#FFF9F2" stroke="#211923" stroke-width="7"/>
      <circle cx="82" cy="61" r="24" fill="#443443" opacity=".12" stroke="#443443" stroke-width="6" stroke-dasharray="10 9"/>
      <path d="M169 37H215V83H169Z" fill="none" stroke="#EF665F" stroke-width="8" stroke-linejoin="round"/>
    </g>
    <g transform="translate(58 370)">
      <rect width="269" height="142" rx="26" fill="#FFF9F2" stroke="#211923" stroke-width="7"/>
      <path d="M42 88H226" stroke="#F1B640" stroke-width="9" stroke-linecap="round"/>
      <use href="#blackStone" x="53" y="66"/><use href="#blackStone" x="94" y="66"/><use href="#blackStone" x="135" y="66"/><use href="#blackStone" x="176" y="66"/><use href="#blackStone" x="217" y="66"/>
    </g>
    <g transform="translate(58 544)">
      <rect width="269" height="162" rx="26" fill="#211923" stroke="#211923" stroke-width="7"/>
      <g transform="translate(134 58)">
        <path d="M0-30L9-10L31-9L14 5L20 27L0 15L-20 27L-14 5L-31-9L-9-10Z" fill="#F1B640"/>
      </g>
      <circle cx="84" cy="118" r="11" fill="#4BCB83"/><circle cx="134" cy="118" r="11" fill="#F1B640"/><circle cx="184" cy="118" r="11" fill="#EF665F"/>
    </g>
  </g>
</svg>
